{"openapi":"3.0.0","info":{"title":"SCIM Provisioning","description":"Provision Bandwidth users and groups from an identity provider using SCIM 2.0 (RFC 7643, RFC 7644).\n\n## Base URL\n\n\u0060https://api.bandwidth.com/api/scim/v2\u0060\n\n## Identity provider setup requirements\n\n- **userName must be the user\u0027s primary email.** Email is derived from userName on create, and the\n  \u0060userName eq\u0060 filter matches on the Bandwidth email. A pre-existing Bandwidth user can only be matched by\n  the IdP when its login and email are the same.\n- **Accounts follow the credential, not the request.** Users have no \u0060accounts\u0060 attribute in SCIM. Creating or\n  replacing a user sets its accounts to every account on the SCIM credential, so a credential bound to several\n  accounts grants all of them. Use a credential bound to a single account unless that is intended.\n- **The SCIM credential must hold every role it manages through /Groups.** Pushing a group for a role the\n  credential does not hold is rejected with a 403.\n- **Populate an IdP group before linking it to a Bandwidth Group.** Linking typically sends \u0060PUT /Groups/{groupId}\u0060\n  with the IdP group\u0027s current, often empty, membership. PUT replaces the membership, so any current holder of\n  the role who is not in the IdP group has the role revoked.\n\nResponses with status 429 and 500 are retryable; the service never reports a transient failure as a 4xx.","version":"1.0.0","contact":{"name":"Bandwidth"},"termsOfService":"https://www.bandwidth.com/legal/terms-of-use-bandwidthcom-web-sites/"},"servers":[{"url":"https://api.bandwidth.com/api/scim/v2"}],"paths":{"/Users":{"get":{"tags":["Users"],"summary":"List All Users","description":"Returns a paginated list of User resources; if none match, returns 200 with the same ListResponse envelope:\ntotalResults: 0 and an empty Resources array. Supports\nfiltering with the eq operator on userName; the value is matched against the user\u0027s primary email, which is\nthe userName of every SCIM-created user. A filtered request matching more than 100 users is rejected\nwith a 400 and scimType \u0022tooMany\u0022; unfiltered requests are paginated normally regardless of size.","operationId":"listUsers","parameters":[{"$ref":"#/components/parameters/filter"},{"$ref":"#/components/parameters/startIndex"},{"$ref":"#/components/parameters/count"},{"$ref":"#/components/parameters/attributes"},{"$ref":"#/components/parameters/excludedAttributes"}],"responses":{"200":{"$ref":"#/components/responses/scimListResponse"},"400":{"$ref":"#/components/responses/scimBadRequestResponse"},"401":{"$ref":"#/components/responses/scimUnauthorizedResponse"},"403":{"$ref":"#/components/responses/scimForbiddenResponse"},"404":{"$ref":"#/components/responses/scimNotFoundResponse"},"405":{"$ref":"#/components/responses/scimMethodNotAllowedResponse"},"429":{"$ref":"#/components/responses/scimTooManyRequestsResponse"},"500":{"$ref":"#/components/responses/scimInternalServerErrorResponse"}}},"post":{"tags":["Users"],"summary":"Create Users","description":"Creates a new user with the default basicAccess role. Roles are managed through the /Groups endpoints; a roles\nattribute in the request body is rejected with a 400 and scimType \u0022invalidValue\u0022. basicAccess is an ordinary role:\nit is never removed automatically, is listed as a Group, and can be revoked like any other Group membership\n(subject to the at-least-one-role rule). The new user is assigned to every account on the SCIM credential;\nthe request body carries no account information.","operationId":"createUser","requestBody":{"$ref":"#/components/requestBodies/scimCreateUserRequest"},"responses":{"201":{"$ref":"#/components/responses/scimCreatedResponse"},"400":{"$ref":"#/components/responses/scimBadRequestResponse"},"401":{"$ref":"#/components/responses/scimUnauthorizedResponse"},"403":{"$ref":"#/components/responses/scimForbiddenResponse"},"404":{"$ref":"#/components/responses/scimNotFoundResponse"},"405":{"$ref":"#/components/responses/scimMethodNotAllowedResponse"},"409":{"$ref":"#/components/responses/scimConflictResponse"},"429":{"$ref":"#/components/responses/scimTooManyRequestsResponse"},"500":{"$ref":"#/components/responses/scimInternalServerErrorResponse"}}}},"/Users/{userId}":{"get":{"tags":["Users"],"summary":"Get User","description":"Returns the User resource with the specific ID","operationId":"getUser","parameters":[{"$ref":"#/components/parameters/userId"},{"$ref":"#/components/parameters/attributes"},{"$ref":"#/components/parameters/excludedAttributes"}],"responses":{"200":{"$ref":"#/components/responses/scimUserResponse"},"400":{"$ref":"#/components/responses/scimBadRequestResponse"},"401":{"$ref":"#/components/responses/scimUnauthorizedResponse"},"403":{"$ref":"#/components/responses/scimForbiddenResponse"},"404":{"$ref":"#/components/responses/scimNotFoundResponse"},"405":{"$ref":"#/components/responses/scimMethodNotAllowedResponse"},"429":{"$ref":"#/components/responses/scimTooManyRequestsResponse"},"500":{"$ref":"#/components/responses/scimInternalServerErrorResponse"}}},"patch":{"tags":["Users"],"summary":"Update User","description":"Partially modifies a User resource. The primary use is deprovisioning a user by setting active to false;\nprovisioning is handled via POST /Users.\n\nOperations may target an attribute with a path or supply a path-less value object. Supported paths, matched\ncase-insensitively, are active, name.givenName, name.familyName, emails, and phoneNumbers. The field userName\nis immutable after creation. Value-filter paths (e.g. emails[type eq \u0022work\u0022].value) and schema-URN-prefixed\npaths are not supported; any unsupported path returns a 400 with scimType \u0022invalidPath\u0022.\n\nAttribute behavior, deviating from RFC 7644 \u00A73.5.2 where noted:\n- roles: not supported. Roles are managed through the /Groups endpoints. A path of roles returns a 400 with\n  scimType \u0022invalidPath\u0022, and a roles attribute in a path-less value object returns a 400 with scimType \u0022invalidValue\u0022.\n- emails and phoneNumbers: each maps to a single value on the Bandwidth user, so add behaves as replace,\n  and remove is rejected with a 400 and scimType \u0022invalidValue\u0022 instead of clearing the value.\n- active, name.givenName, name.familyName: add and replace are supported; remove is rejected with a 400\n  and scimType \u0022invalidValue\u0022.","operationId":"updateUser","requestBody":{"$ref":"#/components/requestBodies/scimPatchUserRequest"},"parameters":[{"$ref":"#/components/parameters/userId"}],"responses":{"200":{"$ref":"#/components/responses/scimUserResponse"},"400":{"$ref":"#/components/responses/scimBadRequestResponse"},"401":{"$ref":"#/components/responses/scimUnauthorizedResponse"},"403":{"$ref":"#/components/responses/scimForbiddenResponse"},"404":{"$ref":"#/components/responses/scimNotFoundResponse"},"405":{"$ref":"#/components/responses/scimMethodNotAllowedResponse"},"429":{"$ref":"#/components/responses/scimTooManyRequestsResponse"},"500":{"$ref":"#/components/responses/scimInternalServerErrorResponse"}}},"put":{"tags":["Users"],"summary":"Replace User","description":"Fully replaces a User resource with the provided payload. As a deviation from RFC 7644, omitted optional\nfields are preserved rather than cleared. Modifying an immutable field returns a 400; echoing the\nresource\u0027s own id back unchanged is permitted. The user\u0027s accounts are set to every account on the SCIM\ncredential, as on create.","operationId":"replaceUser","requestBody":{"$ref":"#/components/requestBodies/scimPutUserRequest"},"parameters":[{"$ref":"#/components/parameters/userId"}],"responses":{"200":{"$ref":"#/components/responses/scimUserResponse"},"400":{"$ref":"#/components/responses/scimBadRequestResponse"},"401":{"$ref":"#/components/responses/scimUnauthorizedResponse"},"403":{"$ref":"#/components/responses/scimForbiddenResponse"},"404":{"$ref":"#/components/responses/scimNotFoundResponse"},"405":{"$ref":"#/components/responses/scimMethodNotAllowedResponse"},"409":{"$ref":"#/components/responses/scimConflictResponse"},"429":{"$ref":"#/components/responses/scimTooManyRequestsResponse"},"500":{"$ref":"#/components/responses/scimInternalServerErrorResponse"}}},"delete":{"tags":["Users"],"summary":"Delete User","description":"Permanently deletes a User. Implemented for SCIM compliance and expected to see almost no use \u2014 the\nsuggested way to deprovision an account is PATCH /Users/{userId} with active set to false.","operationId":"deleteUser","parameters":[{"$ref":"#/components/parameters/userId"}],"responses":{"204":{"$ref":"#/components/responses/scimNoContentResponse"},"400":{"$ref":"#/components/responses/scimBadRequestResponse"},"401":{"$ref":"#/components/responses/scimUnauthorizedResponse"},"403":{"$ref":"#/components/responses/scimForbiddenResponse"},"404":{"$ref":"#/components/responses/scimNotFoundResponse"},"405":{"$ref":"#/components/responses/scimMethodNotAllowedResponse"},"429":{"$ref":"#/components/responses/scimTooManyRequestsResponse"},"500":{"$ref":"#/components/responses/scimInternalServerErrorResponse"},"501":{"$ref":"#/components/responses/scimNotImplementedResponse"}}}},"/Me":{"get":{"tags":["Users"],"summary":"Get Authenticated User","description":"Returns the User resource of the authenticated subject. /Me is the RFC 7644 \u00A73.11 URI alias for that\nuser\u0027s own resource and returns the same representation as GET /Users/{userId}. Bandwidth\u0027s SCIM service\ntargets IdP-driven provisioning rather than self-service access, so prefer GET /Users/{userId} where the\nid is known.\n\nNote: not supported by Bandwidth\u0027s current implementation \u2014 requests are rejected with a 501 error.","operationId":"getMe","responses":{"200":{"$ref":"#/components/responses/scimUserResponse"},"400":{"$ref":"#/components/responses/scimBadRequestResponse"},"401":{"$ref":"#/components/responses/scimUnauthorizedResponse"},"403":{"$ref":"#/components/responses/scimForbiddenResponse"},"404":{"$ref":"#/components/responses/scimNotFoundResponse"},"405":{"$ref":"#/components/responses/scimMethodNotAllowedResponse"},"429":{"$ref":"#/components/responses/scimTooManyRequestsResponse"},"500":{"$ref":"#/components/responses/scimInternalServerErrorResponse"},"501":{"$ref":"#/components/responses/scimNotImplementedResponse"}}}},"/Groups":{"get":{"tags":["Groups"],"summary":"List All Groups","description":"Returns a paginated list of Group resources; if no groups match, returns 200 with the same ListResponse envelope: \ntotalResults: 0 and an empty Resources array. Only roles available to your account are exposed as Groups. Supports filtering with the eq operator on displayName only. The field members is not returned by default; \nrequest it explicitly with attributes=members.","operationId":"listGroups","parameters":[{"$ref":"#/components/parameters/groupFilter"},{"$ref":"#/components/parameters/startIndex"},{"$ref":"#/components/parameters/count"},{"$ref":"#/components/parameters/attributes"},{"$ref":"#/components/parameters/excludedAttributes"}],"responses":{"200":{"$ref":"#/components/responses/scimGroupListResponse"},"400":{"$ref":"#/components/responses/scimBadRequestResponse"},"401":{"$ref":"#/components/responses/scimUnauthorizedResponse"},"403":{"$ref":"#/components/responses/scimForbiddenResponse"},"404":{"$ref":"#/components/responses/scimNotFoundResponse"},"405":{"$ref":"#/components/responses/scimMethodNotAllowedResponse"},"429":{"$ref":"#/components/responses/scimTooManyRequestsResponse"},"500":{"$ref":"#/components/responses/scimInternalServerErrorResponse"}}},"post":{"tags":["Groups"],"summary":"Create Group","description":"Creates a new Group, adding a role to the role catalog. To assign users to a\ngroup that already exists, use PATCH /Groups/{groupId}.\n\nNote: not supported by Bandwidth\u0027s current implementation \u2014 requests are rejected with a 501 error.","operationId":"createGroup","requestBody":{"$ref":"#/components/requestBodies/scimCreateGroupRequest"},"responses":{"201":{"$ref":"#/components/responses/scimGroupCreatedResponse"},"400":{"$ref":"#/components/responses/scimBadRequestResponse"},"401":{"$ref":"#/components/responses/scimUnauthorizedResponse"},"403":{"$ref":"#/components/responses/scimForbiddenResponse"},"404":{"$ref":"#/components/responses/scimNotFoundResponse"},"405":{"$ref":"#/components/responses/scimMethodNotAllowedResponse"},"409":{"$ref":"#/components/responses/scimConflictResponse"},"429":{"$ref":"#/components/responses/scimTooManyRequestsResponse"},"500":{"$ref":"#/components/responses/scimInternalServerErrorResponse"},"501":{"$ref":"#/components/responses/scimNotImplementedResponse"}}}},"/Groups/{groupId}":{"get":{"tags":["Groups"],"summary":"Get Group","description":"Returns the Group resource with the specified ID. The field members is not returned by default; request it\nexplicitly with attributes=members. Requests addressing a role that is not exposed as a Group return 404.","operationId":"getGroup","parameters":[{"$ref":"#/components/parameters/groupId"},{"$ref":"#/components/parameters/attributes"},{"$ref":"#/components/parameters/excludedAttributes"}],"responses":{"200":{"$ref":"#/components/responses/scimGroupResponse"},"400":{"$ref":"#/components/responses/scimBadRequestResponse"},"401":{"$ref":"#/components/responses/scimUnauthorizedResponse"},"403":{"$ref":"#/components/responses/scimForbiddenResponse"},"404":{"$ref":"#/components/responses/scimNotFoundResponse"},"405":{"$ref":"#/components/responses/scimMethodNotAllowedResponse"},"429":{"$ref":"#/components/responses/scimTooManyRequestsResponse"},"500":{"$ref":"#/components/responses/scimInternalServerErrorResponse"}}},"put":{"tags":["Groups"],"summary":"Replace Group","description":"Fully replaces a Group resource. Because the group\u0027s identity is managed by Bandwidth, members is the only\nmutable attribute: the provided list replaces the membership, assigning the role to new members and\nrevoking it from absent ones. Echoing id and displayName back unchanged is permitted; changing either is\nrejected with a 400 and scimType \u0022mutability\u0022. As with PUT /Users/{userId}, omitted optional fields are\npreserved, so omitting members leaves the membership unchanged. A replacement that would strip a member\u0027s\nlast role is rejected with a 400 and scimType \u0022invalidValue\u0022. Requests addressing a role that is not exposed\nas a Group return 404.\n\nIdPs commonly send this request when a group is first linked, with the IdP group\u0027s current membership. An\nempty members list revokes the role from every current holder the credential is authorized to modify, so\npopulate the IdP group before linking it.","operationId":"replaceGroup","requestBody":{"$ref":"#/components/requestBodies/scimPutGroupRequest"},"parameters":[{"$ref":"#/components/parameters/groupId"}],"responses":{"200":{"$ref":"#/components/responses/scimGroupResponse"},"400":{"$ref":"#/components/responses/scimBadRequestResponse"},"401":{"$ref":"#/components/responses/scimUnauthorizedResponse"},"403":{"$ref":"#/components/responses/scimForbiddenResponse"},"404":{"$ref":"#/components/responses/scimNotFoundResponse"},"405":{"$ref":"#/components/responses/scimMethodNotAllowedResponse"},"429":{"$ref":"#/components/responses/scimTooManyRequestsResponse"},"500":{"$ref":"#/components/responses/scimInternalServerErrorResponse"}}},"patch":{"tags":["Groups"],"summary":"Update Group","description":"Partially modifies a Group resource \u2014 the primary path for IdP group push. The field members is the only mutable\nattribute: adding a user assigns the projected Bandwidth role, removing a user revokes it.\n\n- add: assigns the role to the users in value, merging with the current membership (de-duplicated).\n- replace: replaces the entire membership with the users in value.\n- remove: revokes the role from the users in value, or from all current members if value is omitted. The\n  filtered path form members[value eq \u0022\u003CuserId\u003E\u0022] is also supported.\n\nAn operation that would strip a user\u0027s last role is rejected with a 400 and scimType \u0022invalidValue\u0022; to\ndeprovision a user, use PATCH /Users/{userId} with active set to false instead. The fields id and displayName are not\nmodifiable (400 with scimType \u0022mutability\u0022); any other path returns a 400 with scimType \u0022invalidPath\u0022.\nRequests addressing a role that is not exposed as a Group return 404.","operationId":"updateGroup","requestBody":{"$ref":"#/components/requestBodies/scimPatchGroupRequest"},"parameters":[{"$ref":"#/components/parameters/groupId"}],"responses":{"200":{"$ref":"#/components/responses/scimGroupResponse"},"400":{"$ref":"#/components/responses/scimBadRequestResponse"},"401":{"$ref":"#/components/responses/scimUnauthorizedResponse"},"403":{"$ref":"#/components/responses/scimForbiddenResponse"},"404":{"$ref":"#/components/responses/scimNotFoundResponse"},"405":{"$ref":"#/components/responses/scimMethodNotAllowedResponse"},"429":{"$ref":"#/components/responses/scimTooManyRequestsResponse"},"500":{"$ref":"#/components/responses/scimInternalServerErrorResponse"}}},"delete":{"tags":["Groups"],"summary":"Delete Group","description":"Deletes the Group with the specified ID, removing the projected role from the role\ncatalog. To revoke the role from its members without deleting the group, remove them via\nPATCH /Groups/{groupId}. Requests addressing a role that is not exposed as a Group return 404.\n\nNote: not supported by Bandwidth\u0027s current implementation \u2014 requests are rejected with a 501 error.","operationId":"deleteGroup","parameters":[{"$ref":"#/components/parameters/groupId"}],"responses":{"204":{"$ref":"#/components/responses/scimNoContentResponse"},"400":{"$ref":"#/components/responses/scimBadRequestResponse"},"401":{"$ref":"#/components/responses/scimUnauthorizedResponse"},"403":{"$ref":"#/components/responses/scimForbiddenResponse"},"404":{"$ref":"#/components/responses/scimNotFoundResponse"},"405":{"$ref":"#/components/responses/scimMethodNotAllowedResponse"},"429":{"$ref":"#/components/responses/scimTooManyRequestsResponse"},"500":{"$ref":"#/components/responses/scimInternalServerErrorResponse"},"501":{"$ref":"#/components/responses/scimNotImplementedResponse"}}}},"/Bulk":{"post":{"tags":["Bulk"],"summary":"Process Bulk Operations","description":"Combines multiple operations (POST, PUT, PATCH, DELETE against /Users and /Groups) into a single request,\nper RFC 7644 \u00A73.7. A POST operation\u0027s bulkId is a temporary identifier that later operations in the same\nrequest may reference. Requests exceeding the maxOperations or maxPayloadSize limits announced in\nServiceProviderConfig are rejected with a 413.\n\nNote: not supported by Bandwidth\u0027s current implementation \u2014 requests are rejected with a 501 error, and\nServiceProviderConfig reports bulk.supported: false.","operationId":"createBulkRequest","requestBody":{"$ref":"#/components/requestBodies/scimBulkRequest"},"responses":{"200":{"$ref":"#/components/responses/scimBulkResponse"},"400":{"$ref":"#/components/responses/scimBadRequestResponse"},"401":{"$ref":"#/components/responses/scimUnauthorizedResponse"},"403":{"$ref":"#/components/responses/scimForbiddenResponse"},"404":{"$ref":"#/components/responses/scimNotFoundResponse"},"405":{"$ref":"#/components/responses/scimMethodNotAllowedResponse"},"413":{"$ref":"#/components/responses/scimPayloadTooLargeResponse"},"429":{"$ref":"#/components/responses/scimTooManyRequestsResponse"},"500":{"$ref":"#/components/responses/scimInternalServerErrorResponse"},"501":{"$ref":"#/components/responses/scimNotImplementedResponse"}}}},"/ServiceProviderConfig":{"get":{"tags":["Discovery"],"summary":"List SCIM Features","description":"Describes the SCIM features supported by Bandwidth\u0027s service provider. No authentication required.","security":[],"operationId":"getServiceProviderConfig","responses":{"200":{"$ref":"#/components/responses/serviceProviderConfigResponse"},"400":{"$ref":"#/components/responses/scimBadRequestResponse"},"401":{"$ref":"#/components/responses/scimUnauthorizedResponse"},"403":{"$ref":"#/components/responses/scimForbiddenResponse"},"404":{"$ref":"#/components/responses/scimNotFoundResponse"},"405":{"$ref":"#/components/responses/scimMethodNotAllowedResponse"},"429":{"$ref":"#/components/responses/scimTooManyRequestsResponse"},"500":{"$ref":"#/components/responses/scimInternalServerErrorResponse"}}}},"/ResourceTypes":{"get":{"tags":["Discovery"],"summary":"List Available SCIM Resources","description":"Retrieves the types of resources available on Bandwidth\u0027s SCIM service. No authentication required.","security":[],"operationId":"listResourceTypes","responses":{"200":{"$ref":"#/components/responses/resourceTypesResponse"},"400":{"$ref":"#/components/responses/scimBadRequestResponse"},"401":{"$ref":"#/components/responses/scimUnauthorizedResponse"},"403":{"$ref":"#/components/responses/scimForbiddenResponse"},"404":{"$ref":"#/components/responses/scimNotFoundResponse"},"405":{"$ref":"#/components/responses/scimMethodNotAllowedResponse"},"429":{"$ref":"#/components/responses/scimTooManyRequestsResponse"},"500":{"$ref":"#/components/responses/scimInternalServerErrorResponse"}}}},"/ResourceTypes/{resourceTypeId}":{"get":{"tags":["Discovery"],"summary":"Get Resource Type","description":"Returns the ResourceType definition for a single resource type. No authentication required.","security":[],"operationId":"getResourceType","parameters":[{"$ref":"#/components/parameters/resourceTypeId"}],"responses":{"200":{"$ref":"#/components/responses/getResourceTypesResponse"},"400":{"$ref":"#/components/responses/scimBadRequestResponse"},"401":{"$ref":"#/components/responses/scimUnauthorizedResponse"},"403":{"$ref":"#/components/responses/scimForbiddenResponse"},"404":{"$ref":"#/components/responses/scimNotFoundResponse"},"405":{"$ref":"#/components/responses/scimMethodNotAllowedResponse"},"429":{"$ref":"#/components/responses/scimTooManyRequestsResponse"},"500":{"$ref":"#/components/responses/scimInternalServerErrorResponse"}}}},"/Schemas":{"get":{"tags":["Discovery"],"summary":"List Supported Schemas","description":"Retrieves the schemas supported by Bandwidth\u0027s SCIM service. No authentication required.","security":[],"operationId":"listSchemas","responses":{"200":{"$ref":"#/components/responses/schemasResponse"},"400":{"$ref":"#/components/responses/scimBadRequestResponse"},"401":{"$ref":"#/components/responses/scimUnauthorizedResponse"},"403":{"$ref":"#/components/responses/scimForbiddenResponse"},"404":{"$ref":"#/components/responses/scimNotFoundResponse"},"405":{"$ref":"#/components/responses/scimMethodNotAllowedResponse"},"429":{"$ref":"#/components/responses/scimTooManyRequestsResponse"},"500":{"$ref":"#/components/responses/scimInternalServerErrorResponse"}}}},"/Schemas/{schemaId}":{"get":{"tags":["Discovery"],"summary":"Get Schema","description":"Returns a single SCIM schema definition by ID. No authentication required.","security":[],"operationId":"getSchema","parameters":[{"$ref":"#/components/parameters/schemaId"}],"responses":{"200":{"$ref":"#/components/responses/getSchemaResponse"},"400":{"$ref":"#/components/responses/scimBadRequestResponse"},"401":{"$ref":"#/components/responses/scimUnauthorizedResponse"},"403":{"$ref":"#/components/responses/scimForbiddenResponse"},"404":{"$ref":"#/components/responses/scimNotFoundResponse"},"405":{"$ref":"#/components/responses/scimMethodNotAllowedResponse"},"429":{"$ref":"#/components/responses/scimTooManyRequestsResponse"},"500":{"$ref":"#/components/responses/scimInternalServerErrorResponse"}}}}},"components":{"schemas":{"scimUserName":{"type":"string","format":"email","description":"Unique identifier for the user, mapped to the Bandwidth UserId. Always an email address for SSO (SCIM-provisioned) users.","example":"bjensen@bandwidth.com"},"scimName":{"type":"object","required":["givenName","familyName"],"properties":{"givenName":{"type":"string","description":"Maps to Bandwidth FirstName.","example":"Barbara"},"familyName":{"type":"string","description":"Maps to Bandwidth LastName.","example":"Jensen"}}},"scimEmail":{"type":"object","properties":{"value":{"type":"string","format":"email","nullable":true,"description":"Maps to Bandwidth email. Must match userName.","example":"bjensen@bandwidth.com"},"type":{"type":"string","nullable":true,"description":"Type of email address (e.g., work, home).","example":"work"},"display":{"type":"string","nullable":true,"description":"Human-readable label for this email address.","example":"bjensen@bandwidth.com"},"primary":{"type":"boolean","nullable":true,"description":"Whether or not the email address is the user\u0027s primary","example":true}}},"scimPhoneNumber":{"type":"object","properties":{"value":{"type":"string","nullable":true,"description":"Maps to Bandwidth Phone Number. E.164 format, which SCIM states as a SHOULD.","example":"\u002B19195551234"},"type":{"type":"string","nullable":true,"description":"Type of phone number (e.g., work, mobile, home).","example":"work"},"display":{"type":"string","nullable":true,"description":"Human-readable label for this phone number.","example":"\u002B1 (919) 555-1234"},"primary":{"type":"boolean","nullable":true,"description":"Whether or not the phone number is the user\u0027s primary","example":true}}},"scimExternalId":{"type":"string","nullable":true,"writeOnly":true,"description":"Client-defined identifier. Accepted in requests for SCIM compatibility, but Bandwidth has never persisted\nit and never returns it in a response.","example":"701984"},"scimCreateUserRequest":{"type":"object","required":["schemas","userName","name"],"properties":{"schemas":{"type":"array","items":{"type":"string"},"example":["urn:ietf:params:scim:schemas:core:2.0:User"]},"userName":{"$ref":"#/components/schemas/scimUserName"},"name":{"$ref":"#/components/schemas/scimName"},"emails":{"type":"array","nullable":true,"items":{"$ref":"#/components/schemas/scimEmail"}},"active":{"type":"boolean","nullable":true,"description":"Initial active state of the user. Defaults to true if omitted.","example":true},"externalId":{"$ref":"#/components/schemas/scimExternalId"},"phoneNumbers":{"type":"array","nullable":true,"items":{"$ref":"#/components/schemas/scimPhoneNumber"}}}},"scimPatchUserRequest":{"type":"object","required":["schemas","Operations"],"properties":{"schemas":{"type":"array","items":{"type":"string"},"example":["urn:ietf:params:scim:api:messages:2.0:PatchOp"]},"Operations":{"type":"array","description":"List of patch operations to apply to the User resource.","items":{"oneOf":[{"description":"Add or replace operation \u2014 value is required.","type":"object","required":["op","value"],"properties":{"op":{"$ref":"#/components/schemas/scimPatchAddReplaceOp"},"path":{"type":"string","nullable":true,"example":"active"},"value":{}}},{"description":"Remove operation \u2014 value must be omitted.","type":"object","required":["op","path"],"properties":{"op":{"$ref":"#/components/schemas/scimPatchRemoveOp"},"path":{"type":"string","description":"Required for remove operations; if omitted, returns a 400 with scimType \u0022noTarget\u0022 (RFC 7644 \u00A73.5.2.2).","example":"active"}}}]}}}},"scimPutUserRequest":{"type":"object","required":["schemas","userName","name","active"],"properties":{"schemas":{"type":"array","items":{"type":"string"},"example":["urn:ietf:params:scim:schemas:core:2.0:User"]},"userName":{"$ref":"#/components/schemas/scimUserName"},"name":{"$ref":"#/components/schemas/scimName"},"emails":{"type":"array","nullable":true,"items":{"$ref":"#/components/schemas/scimEmail"}},"active":{"type":"boolean","description":"Maps to Bandwidth Status. false = DEPROVISIONED (soft delete).","example":true},"exte