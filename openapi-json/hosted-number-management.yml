{"openapi":"3.0.1","info":{"title":"Hosted Number Management","description":"Bandwidth\u0027s Hosted Number Management APIs\n\nThis API provides endpoints to manage hosted telephone numbers, either for voice and messaging. \n\nNote that specs are still being moved over from the [Numbers section](https://dev.bandwidth.com/apis/numbers-apis/numbers)","contact":{"name":"Bandwidth","url":"https://support.bandwidth.com","email":"support@bandwidth.com"},"version":"1.0.0","termsOfService":"https://www.bandwidth.com/legal/terms-of-use-bandwidthcom-web-sites/"},"servers":[{"url":"https://api.bandwidth.com/api/v2","description":"Production"}],"security":[{"Basic":[]},{"Bearer":[]}],"tags":[{"name":"Hosted Messaging"},{"name":"Import TN Checker"},{"name":"Operator Information"},{"name":"Hosted Voice"},{"name":"External TN Orders"}],"paths":{"/accounts/{accountId}/importPhoneNumberOrders/messaging":{"get":{"tags":["Hosted Messaging"],"description":"Retrieves the importPhoneNumberOrders requests for the given account ID. A maximum of 1,000 orders can be retrieved per request. If no date range or required query parameter is provided, the order results will be limited to the last two years.\n\nIn this table are presented capabilities that are not universally available. The following request query parameters are only allowed for numbers from specific region/country:\n| Number Region | Request Query Parameter |\n|:--------------|:------------------------|\n|NANP|loaType|\n","summary":"List Hosted Messaging Orders","operationId":"readImportMessagingPhoneNumberOrders","parameters":[{"$ref":"#/components/parameters/accountIdPathParam"},{"$ref":"#/components/parameters/statusQueryParam"},{"$ref":"#/components/parameters/phoneNumberQueryParam"},{"$ref":"#/components/parameters/customerOrderIdQueryParam"},{"$ref":"#/components/parameters/createdDateFromQueryParam"},{"$ref":"#/components/parameters/createdDateToQueryParam"},{"$ref":"#/components/parameters/modifiedDateFromQueryParam"},{"$ref":"#/components/parameters/modifiedDateToQueryParam"},{"$ref":"#/components/parameters/loaTypeQueryParam"}],"responses":{"200":{"$ref":"#/components/responses/getImportMessagingPhoneNumberOrdersResponse"},"400":{"$ref":"#/components/responses/getImportMessagingPhoneNumberOrders400ErrorResponse"}}},"post":{"tags":["Hosted Messaging"],"description":"Creates an importPhoneNumberOrder request to add numbers under the given sub account ID and location ID as specified in the body.\nA successfully submitted order will have a status of \u0022RECEIVED\u0022. A successfully completed order will have a status of \u0022COMPLETE\u0022 if all of the telephone numbers were successfully imported and  \u0022PARTIAL\u0022 if some of the telephone numbers were imported. A failed order with will have a staus of \u0022FAILED\u0022 and no telephone numbers would have been imported.\n\nThe following request parameters are only required for numbers from specific region/country:\n| Number Region | Request Parameter |\n|:--------------|:------------------------|\n|NANP|LoaAuthorizingPerson|\n|NANP|LoaType|\n|NANP|Subscriber|","summary":"Create Hosted Messaging Order","operationId":"createImportMessagingPhoneNumberOrder","parameters":[{"$ref":"#/components/parameters/accountIdPathParam"}],"requestBody":{"$ref":"#/components/requestBodies/postImportMessagingPhoneNumberOrdersRequest"},"responses":{"201":{"$ref":"#/components/responses/postImportMessagingPhoneNumberOrdersResponse"},"400":{"$ref":"#/components/responses/postImportMessagingPhoneNumberOrders400ErrorResponse"}}}},"/accounts/{accountId}/importPhoneNumberOrders/messaging/{orderId}":{"get":{"tags":["Hosted Messaging"],"description":"Retrieve an order to import hosted messaging to a phone number by order ID","summary":"Get Hosted Messaging Order","operationId":"retrieveImportMessagingPhoneNumberOrder","parameters":[{"$ref":"#/components/parameters/accountIdPathParam"},{"$ref":"#/components/parameters/orderIdPathParam"}],"responses":{"200":{"$ref":"#/components/responses/getImportMessagingPhoneNumberOrderResponse"},"400":{"$ref":"#/components/responses/getImportMessagingPhoneNumber400ErrorOrderResponse"}}}},"/accounts/{accountId}/importPhoneNumberOrders/messaging/{orderId}/history":{"get":{"tags":["Hosted Messaging"],"description":"Retrieves the history of the specified importPhoneNumberOrder.","summary":"Get Hosted Messaging Order History","operationId":"readImportMessagingPhoneNumberOrderHistory","parameters":[{"$ref":"#/components/parameters/accountIdPathParam"},{"$ref":"#/components/parameters/orderIdPathParam"}],"responses":{"200":{"$ref":"#/components/responses/getImportMessagingPhoneNumberOrdersHistoryResponse"}}}},"/accounts/{accountId}/importPhoneNumberOrders/messaging/{orderId}/loas":{"get":{"description":"Retrieves the list of the LOA files associated with the order. Only for orders involving NANP numbers.","operationId":"listImportMessagingPhoneNumberOrderLoas","parameters":[{"$ref":"#/components/parameters/accountIdPathParam"},{"$ref":"#/components/parameters/orderIdPathParam"},{"$ref":"#/components/parameters/metaDataQueryParam"}],"responses":{"200":{"$ref":"#/components/responses/getImportMessagingPhoneNumberOrdersLoasResponse"},"400":{"$ref":"#/components/responses/getImportMessagingPhoneNumberOrdersLoas400ErrorResponse"}},"summary":"List Hosted Messaging Order LOA files","tags":["Hosted Messaging"]},"post":{"description":"POSTing to the /loas resource will enable the upload of the file.  The key attribute to the POST is ensuring that the headers are correctly set to support the file upload.\u003Cbr\u003E\nQuery parameter or header documentType can be used to specify type of document on upload.\n\u003Cp\u003EWhen uploading documents using the /loas resource, you must specify the MIME type of the document being upload using the Content-Type HTTP header.\u003C/p\u003E\n\u003Cp\u003EThe LOA document must be uploaded using one of the following MIME types:\u003C/p\u003E\n\u003Cul\u003E\n\u003Cli\u003Eapplication/pdf\u003C/li\u003E\n\u003Cli\u003Etext/plain\u003C/li\u003E\n\u003Cli\u003Eimage/jpeg\u003C/li\u003E\n\u003Cli\u003Eimage/png\u003C/li\u003E\n\u003Cli\u003Eimage/tiff\u003C/li\u003E\n\u003Cli\u003Etext/csv\u003C/li\u003E\n\u003Cli\u003Eapplication/vnd.ms-excel\u003C/li\u003E\n\u003Cli\u003Eapplication/vnd.openxmlformats-officedocument.spreadsheetml.sheet\u003C/li\u003E\n\u003Cli\u003Eapplication/msword\u003C/li\u003E\n\u003Cli\u003Eapplication/vnd.openxmlformats-officedocument.wordprocessingml.document\u003C/li\u003E\n\u003C/ul\u003E","operationId":"createImportMessagingPhoneNumberOrderLoas","parameters":[{"$ref":"#/components/parameters/accountIdPathParam"},{"$ref":"#/components/parameters/orderIdPathParam"},{"$ref":"#/components/parameters/documentTypeQueryParam"}],"requestBody":{"$ref":"#/components/requestBodies/postImportMessagingPhoneNumberOrdersLoasRequest"},"responses":{"201":{"$ref":"#/components/responses/postImportMessagingPhoneNumberOrdersLoasResponse"}},"summary":"Upload LOA File for Import Phone Number Order [NANP]","tags":["Hosted Messaging"]}},"/accounts/{accountId}/removeImportedPhoneNumberOrders/messaging":{"get":{"tags":["Hosted Messaging"],"description":"Retrieves the Remove Imported Messaging Tn Orders requests for the given account ID.\nA maximum of 1,000 orders can be retrieved per request. If no date range or specific query parameter as required is provided, the order results will be limited to the last two years.","summary":"List Orders for Removing Hosted Messaging","operationId":"listRemoveImportedTnOrders","parameters":[{"$ref":"#/components/parameters/accountIdPathParam"},{"$ref":"#/components/parameters/statusQueryParam"},{"$ref":"#/components/parameters/phoneNumberQueryParam"},{"$ref":"#/components/parameters/customerOrderIdQueryParam"},{"$ref":"#/components/parameters/createdDateFromQueryParam"},{"$ref":"#/components/parameters/createdDateToQueryParam"},{"$ref":"#/components/parameters/removeImportedModifiedDateFromQueryParam"},{"$ref":"#/components/parameters/removeImportedModifiedDateToQueryParam"}],"responses":{"200":{"$ref":"#/components/responses/getRemoveImportedMessagingPhoneNumberOrdersResponse"}}},"post":{"tags":["Hosted Messaging"],"description":"Create an order to remove imported phone numbers for messaging from the given account ID. An optional customer ID can be provided in the request body to track the order. A successfully submitted order will have a status of \u0022PROCESSING\u0022. A successfully completed order will have a status of \u0022COMPLETE\u0022 if all of the phone numbers were successfully removed and  \u0022PARTIAL\u0022 if some of the phone numbers were removed. A failed order will have a status of \u0022FAILED\u0022 and no phone numbers would have been removed.\n","summary":"Create Order to Remove Hosted Messaging","operationId":"createRemoveImportedPhoneNumberOrder","parameters":[{"$ref":"#/components/parameters/accountIdPathParam"}],"requestBody":{"$ref":"#/components/requestBodies/postRemoveImportedPhoneNumberOrderRequest"},"responses":{"201":{"$ref":"#/components/responses/postRemoveImportedMessagingTnOrdersResponse"},"400":{"$ref":"#/components/responses/postRemoveImportedMessagingTnOrders400ErrorResponse"}}}},"/accounts/{accountId}/removeImportedPhoneNumberOrders/messaging/{orderId}":{"get":{"tags":["Hosted Messaging"],"description":"Retrieve an order to remove hosted messaging from a phone number by ID","summary":"Get Order to Remove Hosted Messaging","operationId":"retrieveRemoveImportedPhoneNumberOrder","parameters":[{"$ref":"#/components/parameters/accountIdPathParam"},{"$ref":"#/components/parameters/orderIdPathParam"}],"responses":{"200":{"$ref":"#/components/responses/getRemoveImportedMessagingPhoneNumberOrderResponse"},"400":{"$ref":"#/components/responses/getRemoveImportedMessagingPhoneNumberOrder400ErrorResponse"}}}},"/accounts/{accountId}/importTnChecker":{"post":{"tags":["Import TN Checker"],"description":"Request importability information on a set of TNs. SipPeerId is an optional value. If SipPeerId is not specified, the id of the default Sip-Peer for the provided SiteId will be used.","operationId":"createRequestImportTnChecker","summary":"Check Tns importability","parameters":[{"$ref":"#/components/parameters/accountIdPathParam"}],"requestBody":{"content":{"application/xml":{"examples":{"example":{"description":"example","value":"\u003C?xml version=\u00221.0\u0022 encoding=\u0022UTF-8\u0022 standalone=\u0022yes\u0022?\u003E\n\u003CImportTnCheckerPayload\u003E\n  \u003CTelephoneNumbers\u003E\n    \u003CTelephoneNumber\u003E\u002B13032281000\u003C/TelephoneNumber\u003E\n    \u003CTelephoneNumber\u003E\u002B14109235436\u003C/TelephoneNumber\u003E\n    \u003CTelephoneNumber\u003E\u002B14104685864\u003C/TelephoneNumber\u003E\n  \u003C/TelephoneNumbers\u003E\n  \u003CSiteId\u003E486\u003C/SiteId\u003E\n  \u003CSipPeerId\u003E500025\u003C/SipPeerId\u003E\n\u003C/ImportTnCheckerPayload\u003E"}},"schema":{"$ref":"#/components/schemas/importTnCheckerPayload"}},"application/json":{"schema":{"$ref":"#/components/schemas/importTnCheckerRequest"},"examples":{"example":{"value":{"phoneNumbers":["\u002B13032281000","\u002B14109235436","\u002B14104685864"],"subAccountId":486,"locationId":500025}}}}}},"responses":{"200":{"description":"\u003Cp\u003EA successful check has been performed.\u003C/p\u003E","content":{"application/xml":{"examples":{"example":{"value":"\u003C?xml version=\u00221.0\u0022 encoding=\u0022UTF-8\u0022 standalone=\u0022yes\u0022?\u003E\n\u003CImportTnCheckerResponse\u003E\n  \u003CImportTnCheckerPayload\u003E\n    \u003CTelephoneNumbers\u003E\n      \u003CTelephoneNumber\u003E\u002B13032281000\u003C/TelephoneNumber\u003E\n    \u003C/TelephoneNumbers\u003E\n    \u003CImportTnErrors\u003E\n      \u003CImportTnError\u003E\n        \u003CCode\u003E19006\u003C/Code\u003E\n        \u003CDescription\u003EBandwidth numbers cannot be imported by this account at this time.\u003C/Description\u003E\n        \u003CTelephoneNumbers\u003E\n          \u003CTelephoneNumber\u003E\u002B14109235436\u003C/TelephoneNumber\u003E\n          \u003CTelephoneNumber\u003E\u002B14104685864\u003C/TelephoneNumber\u003E\n        \u003C/TelephoneNumbers\u003E\n      \u003C/ImportTnError\u003E\n    \u003C/ImportTnErrors\u003E\n  \u003C/ImportTnCheckerPayload\u003E\n\u003C/ImportTnCheckerResponse\u003E"}},"schema":{"$ref":"#/components/schemas/importTnCheckerResponse"}},"application/json":{"schema":{"$ref":"#/components/schemas/importTnCheckerJsonResponse"},"examples":{"example":{"value":{"phoneNumbers":["\u002B13032281000"],"errors":[{"code":19006,"description":"Bandwidth numbers cannot be imported by this account at this time.","phoneNumbers":["\u002B14109235436","\u002B14104685864"]}]}}}}}},"400":{"description":"\u003Cp\u003EBad Response - there were errors in evaluating the body of the request.\u003C/p\u003E \u003Cp\u003EPotential errors include:\u003C/p\u003E\u003Cul\u003E\u003Cli\u003E List of TNs is empty.\u003Cli\u003E List of TNs is more than 5000 TNs.\u003Cli\u003E The account does not have the necessary (IMPORT_TNS) flag.\u003Cli\u003E TNs are invalid (they are not actual TNs, and there are duplicates).\u003C/ul\u003E","content":{"application/xml":{"examples":{"example":{"value":"\u003C?xml version=\u00221.0\u0022 encoding=\u0022UTF-8\u0022 standalone=\u0022yes\u0022?\u003E\n\u003CImportTnCheckerResponse\u003E\n\u003CErrors\u003E\n  \u003CCode\u003E7201\u003C/Code\u003E\n    \u003CDescription\u003E\u002B161746052083 is not a valid NANP telephone number.\u003C/Description\u003E\n  \u003C/Errors\u003E\n  \u003CErrors\u003E\n    \u003CCode\u003E7201\u003C/Code\u003E\n    \u003CDescription\u003E\u002B161746052082 is not a valid NANP telephone number.\u003C/Description\u003E\n  \u003C/Errors\u003E\n\u003C/ImportTnCheckerResponse\u003E"}},"schema":{"$ref":"#/components/schemas/importTnCheckerErrorResponse"}},"application/json":{"schema":{"$ref":"#/components/schemas/importTnCheckerErrorJsonResponse"},"examples":{"example":{"value":{"errors":[{"code":7201,"description":"\u002B161746052083 is not a valid NANP telephone number."},{"code":7201,"description":"\u002B161746052082 is not a valid NANP telephone number."}]}}}}}}}}},"/accounts/{accountId}/operators":{"post":{"tags":["Operator Information"],"description":"\u003Cp\u003EStore an  operator information\u003C/p\u003E\n","operationId":"createOperators","summary":"Create Operator","parameters":[{"$ref":"#/components/parameters/accountIdPathParam"}],"requestBody":{"$ref":"#/components/requestBodies/operatorRequest"},"responses":{"201":{"$ref":"#/components/responses/operatorSuccessfulResponse"},"400":{"$ref":"#/components/responses/operatorBadRequestError"},"401":{"$ref":"#/components/responses/operatorUnauthorizedError"},"403":{"$ref":"#/components/responses/operatorForbiddenError"},"404":{"$ref":"#/components/responses/operatorNotFoundError"},"405":{"$ref":"#/components/responses/methodNotSupportedError"},"415":{"$ref":"#/components/responses/operatorInvalidMediaTypeError"},"429":{"$ref":"#/components/responses/operatorTooManyRequestsError"},"500":{"$ref":"#/components/responses/operatorsInternalServerError"}}},"get":{"tags":["Operator Information"],"description":"\u003Cp\u003EStore an operator information\u003C/p\u003E\n","operationId":"listOperators","summary":"List Operators","parameters":[{"$ref":"#/components/parameters/accountIdPathParam"},{"$ref":"#/components/parameters/operatorCountryCodeA3QueryParam"},{"$ref":"#/components/parameters/operatorSizeQueryParam"}],"responses":{"200":{"$ref":"#/components/responses/listOperatorsResponse"},"400":{"$ref":"#/components/responses/operatorBadRequestError"},"401":{"$ref":"#/components/responses/operatorUnauthorizedError"},"403":{"$ref":"#/components/responses/operatorForbiddenError"},"404":{"$ref":"#/components/responses/operatorNotFoundError"},"405":{"$ref":"#/components/responses/methodNotSupportedError"},"415":{"$ref":"#/components/responses/operatorInvalidMediaTypeError"},"429":{"$ref":"#/components/responses/operatorTooManyRequestsError"},"500":{"$ref":"#/components/responses/operatorsInternalServerError"}}}},"/accounts/{accountId}/operators/{operatorId}":{"patch":{"tags":["Operator Information"],"description":"Update the name and/or routing prefixes for an operator by ID.\n","operationId":"updateOperator","summary":"Update Operator","parameters":[{"$ref":"#/components/parameters/accountIdPathParam"},{"$ref":"#/components/parameters/operatorId"}],"requestBody":{"$ref":"#/components/requestBodies/operatorPatchRequest"},"responses":{"200":{"$ref":"#/components/responses/operatorSuccessfulResponse"},"400":{"$ref":"#/components/responses/operatorBadRequestError"},"401":{"$ref":"#/components/responses/operatorUnauthorizedError"},"403":{"$ref":"#/components/responses/operatorForbiddenError"},"404":{"$ref":"#/components/responses/operatorNotFoundError"},"405":{"$ref":"#/components/responses/methodNotSupportedError"},"415":{"$ref":"#/components/responses/operatorInvalidMediaTypeError"},"429":{"$ref":"#/components/responses/operatorTooManyRequestsError"},"500":{"$ref":"#/components/responses/operatorsInternalServerError"}}},"get":{"tags":["Operator Information"],"description":"\u003Cp\u003ERetrieve an operator information\u003C/p\u003E\n","operationId":"getOperator","summary":"Get Operator","parameters":[{"$ref":"#/components/parameters/accountIdPathParam"},{"$ref":"#/components/parameters/operatorId"}],"responses":{"200":{"$ref":"#/components/responses/operatorSuccessfulResponse"},"400":{"$ref":"#/components/responses/operatorBadRequestError"},"401":{"$ref":"#/components/responses/operatorUnauthorizedError"},"403":{"$ref":"#/components/responses/operatorForbiddenError"},"404":{"$ref":"#/components/responses/operatorNotFoundError"},"405":{"$ref":"#/components/responses/methodNotSupportedError"},"415":{"$ref":"#/components/responses/operatorInvalidMediaTypeError"},"429":{"$ref":"#/components/res