{"openapi":"3.1.0","info":{"title":"Phone Number Lookup V2","version":"2.1.0","contact":{"name":"Bandwidth Support","email":"support@bandwidth.com","url":"https://support.bandwidth.com"},"termsOfService":"https://www.bandwidth.com/legal/terms-of-use-bandwidthcom-web-sites/","description":"A Bandwidth API to provide carrier information for a telephone number or batch of telephone numbers.\n\nCurrently supports lookups of telephone numbers in the mainland United States, Alaska, Hawaii, the District of Columbia and Canada. Canadian numbers will not provide voice and messaging providers. Telephone numbers submitted must be in E.164 format to be processed.\n\n**PLEASE NOTE**: The NPA-NXX associated with an LRN and/or any derived or associated carrier information may only be used by non-NPAC users for the purposes of Rating, Routing, Billing and Network Maintenance as defined in [NPAC US Permitted Use Clarifications](https://numberportability.com/about/permitted-use). Any other uses are expressly restricted.\n\n## Base Path\n\u0060https://api.bandwidth.com/v2\u0060\n\n## DNI-Only\nProperties labeled *DNI-Only* in the Response Schema are only available to accounts that have subscribed to the Dynamic Number Intelligence bundled solution. Accounts not subscribed to DNI will not see these properties in the responses.\n\n## RCS-Only\nProperties labeled *RCS-Only* in the Response Schema are only available to accounts that have the RCS feature enabled. Accounts without this feature enabled will not see these properties in the responses.\n\n## Timestamps\nProperties in this endpoint with a datatype of \u0060date-time-local\u0060 have no time zone because these timestamps are sourced from a wide variety of carriers. Not all carriers provide time zone information."},"servers":[{"url":"https://api.bandwidth.com/v2","description":"Production"}],"paths":{"/accounts/{accountId}/phoneNumberLookup":{"post":{"summary":"Create Synchronous Number Lookup","description":"Creates a synchronous