 have a value of \u0060PROTECTED\u0060.","items":{"$ref":"#/components/schemas/phoneNumberAttributeJson"},"type":"array"}},"type":"object"}]}},"title":"Internal NANP LNP Order Request","type":"object"},"lnpOrderAdditionalFields":{"properties":{"AlternateSpid":{"description":"Even though the telephone numbers are being ported into Bandwidth\u2019s SPID, some of Bandwidth\u2019s wholesale customers have an alternate SPID that is used to identify the telephone number with that customer.","type":"string"},"BillingTelephoneNumber":{"description":"The \u0060BillingTelephoneNumber\u0060 is the primary telephone number associated with the invoice that the subscriber gets from the losing carrier. For wireline port-in, the BillingTelephoneNumber is typically the telephone number being ported in.","type":"string"},"RequestedFocDate":{"description":"Format: ISO8601 encoding such as \u201C2013-05-10T15:14:22Z\u201D, or \u00222019-10-31T17:15:00\u002B04:00\u0022.\u003Cbr/\u003E\u003Cbr/\u003EFor all ports, if \u0060RequestedFocDate\u0060 is specified, the date portion must be:\u003Cbr/\u003E - in the future\u003Cbr/\u003E - after the losing carrier\u0027s minimum number of days to port-out\u003Cbr/\u003E - not on a weekend or U.S. holiday\u003Cbr/\u003E\u003Cbr/\u003EIf \u0060RequestedFocDate\u0060 is not specified, the next available FOC date meeting the criteria above will be used. If the Time portion of the \u0060RequestedFocDate\u0060 is omitted the port-in order will be activated at the default activation time of 11:30 AM ET. If an activation time other than 11:30 AM ET is desired, that activation time should be included in the \u0060RequestedFocDate\u0060.","type":"string"},"Subscriber":{"oneOf":[{"$ref":"#/components/schemas/subscriberBusiness"},{"$ref":"#/components/schemas/subscriberResidential"}]},"Triggered":{"description":"The \u0060Triggered\u0060 field must be set to \u0060true\u0060 if you want an activation time other than the 11:30 AM ET default. The desired acti