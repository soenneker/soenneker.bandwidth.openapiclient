BC","pinNumber":"1234ab"}}}},"schema":{"$ref":"#/components/schemas/lnpOrderPutResponseJson"}},"application/xml":{"examples":{"example":{"description":"example","value":"\u003C?xml version=\u00221.0\u0022 encoding=\u0022UTF-8\u0022 standalone=\u0022yes\u0022?\u003E\n\u003CLnpOrderResponse\u003E\n  \u003COrderId\u003E969a26eb-3bc4-4db3-ab77-56808accb9b2\u003C/OrderId\u003E\n  \u003CStatus\u003E\n    \u003CCode\u003E409\u003C/Code\u003E\n    \u003CDescription\u003EValidation Failed. Please check your input parameters.\u003C/Description\u003E\n  \u003C/Status\u003E\n  \u003CErrors\u003E\n    \u003CCode\u003E7717\u003C/Code\u003E\n    \u003CDescription\u003EThis port-in order is associated with a draft bulk port-in order. Either submit the bulk port-in order, or detach this order from the bulk port-in prior to submitting it.\u003C/Description\u003E\n  \u003C/Errors\u003E\n  \u003CProcessingStatus\u003EEXCEPTION\u003C/ProcessingStatus\u003E\n  \u003CAlternateSpid\u003E1234\u003C/AlternateSpid\u003E\n  \u003CLoaAuthorizingPerson\u003ESuper Man\u003C/LoaAuthorizingPerson\u003E\n  \u003CSubscriber\u003E\n    \u003CSubscriberType\u003ERESIDENTIAL\u003C/SubscriberType\u003E\n    \u003CFirstName\u003EJohn\u003C/FirstName\u003E\n    \u003CLastName\u003EDoe\u003C/LastName\u003E\n    \u003CServiceAddress\u003E\n      \u003CHouseNumber\u003E10\u003C/HouseNumber\u003E\n      \u003CStreetName\u003EAwesome Lane\u003C/StreetName\u003E\n      \u003CCity\u003ENewBern\u003C/City\u003E\n      \u003CStateCode\u003ENC\u003C/StateCode\u003E\n      \u003CZip\u003E99999\u003C/Zip\u003E\n      \u003CCountry\u003EUnited States\u003C/Country\u003E\n      \u003CAddressType\u003EService\u003C/AddressType\u003E\n    \u003C/ServiceAddress\u003E\n  \u003C/Subscriber\u003E\n  \u003CWirelessInfo\u003E\n    \u003CAccountNumber\u003E771297665AABC\u003C/AccountNumber\u003E\n    \u003CPinNumber\u003E1234ab\u003C/PinNumber\u003E\n  \u003C/WirelessInfo\u003E\n  \u003CBillingTelephoneNumber\u003E\u002B12019721103\u003C/BillingTelephoneNumber\u003E\n  \u003CListOfPhoneNumbers\u003E\n    \u003CPhoneNumber\u003E\u002B12019721103\u003C/PhoneNumber\u003E\n  \u003C/ListOfPhoneNumbers\u003E\n  \u003CTriggered\u003Efalse\u003C/Triggered\u003E\n\u003C/LnpOrderResponse\u003E"}},"schema":{"$ref":"#/components/schemas/lnpOrderPutResponse"}}},"description":"The port-in is associated with a bulk port-in in DRAFT state. To submit this port-in detach it from the parent bulk port-in."}},"summary":"Update port-in order","tags":["Porting"]}},"/accounts/{accountId}/portins/statistics":{"get":{"tags":["Port-in Statistics"],"summary":"Retrieve port-in order statistics","description":"Fetches the statistics of port-in orders for a specific account ID, including status counts and total orders.","operationId":"getPortinStatistics","parameters":[{"$ref":"#/components/parameters/AccountIdPathParam"}],"responses":{"200":{"$ref":"#/components/responses/portinStatisticsResponse200"},"400":{"$ref":"#/components/responses/errorResponse400"},"401":{"$ref":"#/components/responses/errorResponse401"},"403":{"$ref":"#/components/responses/portinStatisticsForbiddenError"},"404":{"$ref":"#/components/responses/errorResponse404"},"405":{"$ref":"#/components/responses/errorResponse405"},"429":{"$ref":"#/components/responses/errorResponse429"},"500":{"$ref":"#/components/responses/errorResponse500"},"502":{"$ref":"#/components/responses/errorResponse500"}}}},"/accounts/{accountId}/portins/{orderId}/activationStatus":{"get":{"tags":["Porting"],"operationId":"retrievePortinActivationStatus","summary":"Retrieve port-in order activation status","description":"Retrieve the status (activated or not activated) of TNs associated with the customer activated (triggered) order. \u003Cbr\u003E\u003Cbr\u003E\nAt this time all phone numbers associated with a PON will be activated at the same time. \u003Cbr\u003E\u003Cbr\u003E\nThe response includes an \u0060activationInProgress\u0060 boolean field that is \u0060true\u0060 when toll-free on-demand activation has been triggered but is not yet complete, allowing callers to detect an in-flight activation and prevent duplicate triggers.","parameters":[{"$ref":"#/components/parameters/AccountIdPathParam"},{"$ref":"#/components/parameters/OrderIdPathParam"}],"responses":{"200":{"$ref":"#/components/responses/activationStatusResponse200"},"400":{"$ref":"#/components/responses/activationStatusResponse400"},"401":{"$ref":"#/components/responses/errorResponse401"},"403":{"$ref":"#/components/responses/errorResponse403"},"404":{"$ref":"#/components/responses/activationStatusResponse404"},"429":{"$ref":"#/components/responses/errorResponse429"},"5XX":{"$ref":"#/components/responses/errorResponse500"}}},"put":{"tags":["Porting"],"operationId":"updatePortinActivationStatus","summary":"Update port-in order activation status","description":"Sets the activation time for the port-in order.  \u003Cbr\u003E \u003Cbr\u003E\nThis API call is used to set the activation time of the customer activated (triggered) port. This endpoint also supports Toll Free on-demand activation.\n\n\u003Cul\u003E\n\u003Cli\u003EIf the time is in the past all of the TNs in the port-in request will be activated \u0027immediately\u0027.\u003C/li\u003E\n\u003Cli\u003EFor automated on-net port-ins, if the time is within three days after the approved FoC date, the auto-activation time for the port will be set to that time.\u003C/li\u003E\n\u003Cli\u003EFor automated off-net port-ins, if the date matches the actual FOC date and the time is between 6:00 AM ET and 10:00 PM ET, the auto-activation time for the port will be set to that time.\u003C/li\u003E\n\u003Cli\u003EFor automated toll-free port-ins, the auto-activation time is set to the FOC date/time, even if that date is in the future. The FOC time must fall within the Toll Free on-demand activation window (8:00 AM\u20136:00 PM ET).\u003C/li\u003E\n\u003Cli\u003EIf toll-free activation is already in progress (\u0060activationInProgress\u0060 is \u0060true\u0060 on the GET response), a second PUT request will be rejected with a 400 Bad Request to prevent duplicate activation.\u003C/li\u003E\n\u003C/ul\u003E\n","parameters":[{"$ref":"#/components/parameters/AccountIdPathParam"},{"$ref":"#/components/parameters/OrderIdPathParam"}],"requestBody":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/activationStatusJson"},"examples":{"example":{"value":{"autoActivationDate":"2014-08-30T18:30:00\u002B03:00"}}}},"application/xml":{"schema":{"$ref":"#/components/schemas/activationStatus"}}}},"responses":{"200":{"$ref":"#/components/responses/activationStatusPutResponse200"},"400":{"$ref":"#/components/responses/activationStatusResponse400"},"401":{"$ref":"#/components/responses/errorResponse401"},"403":{"$ref":"#/components/responses/errorResponse403"},"404":{"$ref":"#/components/responses/activationStatusResponse404"},"429":{"$ref":"#/components/responses/errorResponse429"},"5XX":{"$ref":"#/components/responses/errorResponse500"}}}},"/accounts/{accountId}/tnPortoutPasscodes":{"get":{"tags":["Porting"],"operationId":"getTnPortOutPasscode","summary":"Retrieve tn port-out passcode","description":"Retrieve information about one or more Telephone Numbers (TNs) with port out passcode.","parameters":[{"$ref":"#/components/parameters/AccountIdPathParam"},{"$ref":"#/components/parameters/tnPortoutPasscodesPageQueryParam"},{"$ref":"#/components/parameters/tnPortoutPasscodesSizeQueryParam"}],"responses":{"200":{"$ref":"#/components/responses/tnPortOutPasscodesGet200Response"},"400":{"$ref":"#/components/responses/tnPortOutPasscodesGet400Response"},"401":{"$ref":"#/components/responses/errorResponse401"},"403":{"$ref":"#/components/responses/errorResponse403"},"404":{"$ref":"#/components/responses/errorResponse404"},"429":{"$ref":"#/components/responses/errorResponse429"},"5XX":{"$ref":"#/components/responses/errorResponse500"}}},"post":{"tags":["Porting"],"operationId":"retrieveTnPortOutPasscode