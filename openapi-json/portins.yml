sites/id/sippeers\u0060, or by clicking on \u0027Accounts\u0027 on the upper right of the [Bandwidth App](Https://api.bandwidth.com), then clicking \u0027Locations\u0027 on the navigation bar. The SIP-peer (location) identifiers are listed next to each location name. If \u0060PeerId\u0060 is omitted, the SIP-peer (location) designated as the \u0027default location\u0027 for that site (sub-account) will be used.","type":"string"},"ProcessingStatus":{"description":"Including \u0060ProcessingStatus\u0060 with a value of DRAFT allows you to create a port-in request, but not process the request. This is useful if you wish to add items to the order over a period of time and submit once you have the order setup the way you want. Note, however, that draft orders that have not been updated in a couple of days are automatically deleted. Removal of stagnant draft orders is performed so that telephone numbers are not tied up in these orders, preventing them from being included in other orders.\u003Cbr/\u003E\u003Cbr/\u003EVery little validation is performed while an order is in draft state. Omitting \u0060ProcessingStatus\u0060 causes the port-in to be validated and, if correct, processed right away. The full validation is performed on the order when you change the ProcessingStatus to \u0027SUBMITTED\u0027 by performing a PUT request on the order. \u003Cbr\u003E\u003Cbr\u003E\u003Cp\u003EAll toll free telephone numbers provided will be validated (even in draft state) to ensure\nthat they are portable, and to allow you to separate telephone numbers into separate port-ins\nbased on the RespOrg that they are being ported from.\u003C/p\u003E","enum":["DRAFT"],"type":"string"},"RequestedFocDate":{"description":"Format: ISO8601 encoding such as \u201C2013-05-10T15:14:22Z\u201D, or \u00222019-10-31T17:15:00\u002B04:00\u0022.\u003Cbr/\u003E\u003Cbr/\u003EFor all ports, if \u0060RequestedFocDate\u0060 is specified, the date portion must be:\u003Cbr/\u003E - in the future\u003Cbr/\u003E - after the losing carrier\u0027s minimum number of days to port-out\u003Cbr/\u003E - not on a weekend or U.S. holiday\u003Cbr/\u003E\u003Cbr/\u003EIf \u0060RequestedFocDate\u0060 is not specified, the next available FOC date meeting the criteria above will be used. If the Time portion of the \u0060RequestedFocDate\u0060 is omitted the port-in order will be activated at the default activation time of 11:30 AM ET. If an activation time other than 11:30 AM ET is desired, that activation time should be included in the \u0060RequestedFocDate\u0060.","type":"string"},"SiteId":{"description":"\u0060SiteId\u0060 specifies the identifier of the site (sub-account) that the telephone numbers will be ported into.\u003Cbr/\u003E\u003Cbr/\u003EYou can find the identifier for a site (sub-account) by using \u0060GET /accounts/id/sites\u0060, or by clicking on \u0027Manage sub-account\u0027 for the desired sub-account on the main page of the Bandwidth App.","format":"int32","type":"integer"},"Tags":{"$ref":"#/components/schemas/phoneNumberTagsXml"}},"required":["SiteId","ListOfPhoneNumbers","LoaAuthorizingPerson"],"type":"object"},"lnpOrderBasicJson":{"oneOf":[{"required":["subAccountId","phoneNumbers"]},{"required":["phoneNumberGroups"]}],"properties":{"customerOrderId":{"description":"Optional customer-defined reference ID for this order. Only alphanumeric values, dashes and spaces are allowed. Not unique \u2014 Bandwidth applies no uniqueness constraint, so multiple orders may share the same value. Each order receives its own unique Bandwidth-assigned \u0060orderId\u0060.","maxLength":255,"type":"string"},"loaAuthorizingPerson":{"description":"This is the first and last names of the person that has authorized the port.","maxLength":15,"type":"string"},"locationId":{"description":"Specifies the numeric identifier of the SIP-peer (Location) that the telephone numbers will be ported into.\u003Cbr/\u003E\u003Cbr/\u003EYou can find the identifier for a SIP-peer (location) by using \u0060GET /accounts/id/sites/id/sippeers\u0060, or by clicking on \u0027Accounts\u0027 on the upper right of the [Bandwidth App](Https://api.bandwidth.com), then clicking \u0027Locations\u0027 on the navigation bar. The SIP-peer (location) identifiers are listed next to each location name. If \u0060LocationId\u0060 is omitted, the SIP-peer (location) designated as the \u0027default location\u0027 for that site (sub-account) will be used.","type":"string"},"phoneNumberGroups":{"description":"An alternative to \u0060phoneNumbers\u0060 \u002B \u0060subAccountId\u0060 \u002B \u0060locationId\u0060 that distributes TNs across multiple location/VCP groups in a single port-in order. Each group specifies its own \u0060locationId\u0060, \u0060phoneNumbers\u0060, and optionally \u0060voiceConfigurationPackageId\u0060. When present, top-level \u0060subAccountId\u0060, \u0060locationId\u0060, and \u0060voiceConfigurationPackageId\u0060 are ignored. Mutually exclusive with top-level \u0060phoneNumbers\u0060.","items":{"$ref":"#/components/schemas/portinPhoneNumberGroupJson"},"type":"array"},"phoneNumbers":{"$ref":"#/components/schemas/phoneNumbersJson"},"processingStatus":{"description":"Including \u0060ProcessingStatus\u0060 with a value of DRAFT allows you to create a port-in request, but not process the request. This is useful if you wish to add items to the order over a period of time and submit once you have the order setup the way you want. Note, however, that draft orders that have not been updated in a couple of days are automatically deleted. Removal of stagnant draft orders is performed so that telephone numbers are not tied up in these orders, preventing them from being included in other orders.\u003Cbr/\u003E\u003Cbr/\u003EVery little validation is performed while an order is in draft state. Omitting \u0060ProcessingStatus\u0060 causes the port-in to be validated and, if correct, processed right away. The full validation is performed on the order when you change the ProcessingStatus to \u0027SUBMITTED\u0027 by performing a PUT request on the order. \u003Cbr\u003E\u003Cbr\u003E\u003Cp\u003EAll toll free telephone numbers provided will be validated (even in draft state) to ensure\nthat they are portable, and to allow you to separate telephone numbers into separate port-ins\nbased on the RespOrg that they are being ported from.\u003C/p\u003E","enum":["DRAFT"],"type":"string"},"requestedFocDate":{"description":"Format: ISO8601 encoding such as \u201C2013-05-10T15:14:22Z\u201D. \u003Cbr/\u003E\u003Cbr/\u003EFor all ports, if \u0060RequestedFocDate\u0060 is specified, the date portion must be:\u003Cbr/\u003E - in the future\u003Cbr/\u003E - after the losing carrier\u0027s minimum number of days to port-out\u003Cbr/\u003E - not on a weekend or U.S. holiday\u003Cbr/\u003E\u003Cbr/\u003EIf \u0060RequestedFocDate\u0060 is not specified, the next available FOC date meeting the criteria above will be used.","format":"date-time","type":"string"},"subAccountId":{"description":"\u0060SubAccountId\u0060 specifies the identifier of the site (sub-account) that the telephone numbers will be ported into.\u003Cbr/\u003E\u003Cbr/\u003EYou can find the identifier for a site (sub-account) by using \u0060GET /accounts/id/sites\u0060, or by clicking on \u0027Manage sub-account\u0027 for the desired sub-account on the main page of the Bandwidth App.","format":"int32","type":"integer"},"tags":{"$ref":"#/components/schemas/phoneNumberTags"}},"required":["loaAuthorizingPerson"],"type":"object"},"lnpOrderBasicModifiableFields":{"properties":{"CustomerOrderId":{"description":"Optional customer-defined reference ID for this order. Only alphanumeric values, dashes and spaces are allowed. Not unique \u2014 Bandwidth applies no uniqueness constraint, so multiple orders may share the same value. Each order receives its own unique Bandwidth-assigned \u0060orderId\u0060. This field is removed from the order if not included in the PUT payload.\n","type":"string"},"Peer