e":"Generic Error","type":"object","properties":{"links":{"type":"array","items":{"$ref":"#/components/schemas/link"},"example":[]},"data":{"type":"object","nullable":true,"example":null},"errors":{"type":"array","items":{"$ref":"#/components/schemas/error"}}},"required":["links","data","errors"]},"sipUri":{"title":"SIP URI","type":"string","nullable":true,"description":"The application\u0027s default-realm SIP URI (\u0060sip:{applicationId}@{auth_realm}\u0060). \u0060null\u0060 when inbound SIP calls are disabled. Custom SIP domain hosts are listed in each SIP domain\u0027s \u0060fqdns\u0060.","example":"sip:479fbd44-3362-45f3-bb80-284f21111be4@sip.programmable-voice.bandwidth.com"},"inboundSipCallsEnabled":{"title":"Inbound SIP Calls Enabled","type":"boolean","description":"Whether the application accepts inbound SIP calls on its default-realm SIP identity (\u0060sip:{applicationId}@{auth_realm}\u0060). Does not affect calls to custom SIP domains bound to the application.","example":true},"passwordAuthEnabled":{"title":"Password Auth Enabled","type":"boolean","description":"Whether SIP digest authentication (407 challenge) is required for inbound SIP calls on the application\u0027s default-realm SIP identity. Custom SIP domains authenticate with per-user credentials from SIP Users instead.","example":true},"allowedSourceIps":{"title":"Allowed Source IPs","type":"array","description":"IPv4 CIDR blocks allowed to send SIP traffic to the application\u0027s default-realm SIP identity. An empty array means no IP restriction is applied. Maximum 25 entries. Custom SIP domains use IP access lists instead.","items":{"$ref":"#/components/schemas/ipv4Cidr"},"maxItems":25,"default":[],"example":["203.0.113.0/24","198.51.100.0/32"]},"region":{"title":"Region","type":"string","description":"A supported region for SIP authentication.","enum":["US","EU"],"example":"US"},"allowedRegions":{"title":"Allowed Regions","type":"array","nullable":true,"description":"The regions where calls to the application\u0027s default-realm SIP identity are permitted to authenticate. An application with no allowed regions cannot authenticate. Custom SIP domains use each SIP user\u0027s \u0060allowedRegions\u0060 instead.","items":{"$ref":"#/components/schemas/region"},"example":["US","EU"]},"callbackCreds":{"title":"Callback Credentials","type":"object","nullable":true,"properties":{"userId":{"type":"string","description":"The user ID for callback authentication.","example":"myApiUser"}}},"voiceApplicationData":{"title":"Voice Application Data","type":"object","properties":{"applicationId":{"type":"string","nullable":true,"description":"The unique ID of the application.","example":"15f99d57-f823-4718-80cc-5d95d5b83e59"},"serviceType":{"type":"string","nullable":true,"description":"The service type of the application.","example":"Voice-V2"},"applicationName":{"type":"string","nullable":true,"description":"The name of the application.","example":"My Voice App"},"callInitiatedCallbackUrl":{"type":"string","nullable":true,"description":"The URL to receive call initiated callbacks.","example":"https://example.com/callbacks/inbound"},"callInitiatedMethod":{"type":"string","nullable":true,"description":"The HTTP method used for call initiated callbacks.","example":"POST"},"callStatusCallbackUrl":{"type":"string","nullable":true,"description":"The URL to receive call status callbacks.","example":"https://example.com/callbacks/status"},"callStatusMethod":{"type":"string","nullable":true,"description":"The HTTP method used for call status callbacks.","example":"POST"},"callbackCreds":{"$ref":"#/components/schemas/callbackCreds"},"callInitiatedFallbackUrl":{"type":"string","nullable":true,"description":"The fallback URL to receive call initiated callbacks.","example":"https://fallback.example.com/callbacks/inbound"},"callInitiatedFallbackMethod":{"type":"string","nullable":true,"description":"The HTTP method used for the call initiated fallback callback.","example":"POST"},"callInitiatedFallbackCreds":{"$ref":"#/components/schemas/callbackCreds"},"callbackTimeout":{"type":"integer","nullable":true,"description":"The timeout in seconds for callbacks.","example":30},"sipUri":{"$ref":"#/components/schemas/sipUri"},"inboundSipCallsEnabled":{"$ref":"#/components/schemas/inboundSipCallsEnabled"},"passwordAuthEnabled":{"$ref":"#/components/schemas/passwordAuthEnabled"},"allowedSourceIps":{"$ref":"#/components/schemas/allowedSourceIps"},"allowedRegions":{"$ref":"#/components/schemas/allowedRegions"}},"nullable":true},"updateVoiceApplicationRequest":{"title":"Update Voice Application Request","description":"At least one field must be provided. When \u0060inboundSipCallsEnabled\u0060 is \u0060true\u0060, at least one auth mechanism must be active: \u0060passwordAuthEnabled: true\u0060 OR a non-empty \u0060allowedSourceIps\u0060 array.\n\nA \u0060null\u0060 value is treated the same as omitting the field; it does not clear the setting. To clear \u0060allowedSourceIps\u0060 or \u0060allowedRegions\u0060, send an empty array.","type":"object","properties":{"inboundSipCallsEnabled":{"$ref":"#/components/schemas/inboundSipCallsEnabled"},"passwordAuthEnabled":{"$ref":"#/components/schemas/passwordAuthEnabled"},"allowedSourceIps":{"$ref":"#/components/schemas/allowedSourceIps"},"allowedRegions":{"$ref":"#/components/schemas/allowedRegions"}}},"getVoiceApplicationResponse":{"title":"Get Voice Application Response","type":"object","properties":{"links":{"type":"array","items":{"$ref":"#/components/schemas/link"}},"data":{"$ref":"#/components/schemas/voiceApplicationData"},"errors":{"type":"array","items":{"$ref":"#/components/schemas/error"}}},"required":["links","data","errors"]},"updateVoiceApplicationResponse":{"title":"Update Voice Application Response","type":"object","properties":{"links":{"type":"array","items":{"$ref":"#/components/schemas/link"}},"data":{"allOf":[{"$ref":"#/components/schemas/voiceApplicationData"},{"type":"object","properties":{"sipAuthPassword":{"type":"string","nullable":true,"description":"The newly generated password to be used for SIP digest authentication. Only present when the request included \u0060passwordAuthEnabled: true\u0060; it is not returned again.","example":"super_secure_password"}}}]},"errors":{"type":"array","items":{"$ref":"#/components/schemas/error"},"nullable":true}},"required":["links","data","errors"]},"sipDomainLabel":{"title":"SIP Domain Label","type":"string","description":"The customer-chosen DNS label that identifies the SIP domain on this account. 1-63 alphanumeric or hyphen characters, no leading or trailing hyphen. Case-insensitive; stored and returned in lowercase.\n\nRegion codes (\u0060us\u0060, \u0060eu\u0060) are reserved and rejected as a domain label, since they are used as the region prefix in \u0060fqdns\u0060. \u0060null\u0060 is also reserved, since it is the list filters\u0027 value for an unassigned domain.","pattern":"^[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?$","minLength":1,"maxLength":63,"example":"mycompany"},"sipDomainName":{"title":"SIP Domain Name","type":"string","description":"A customer-chosen friendly name for the SIP domain.","minLength":1,"maxLength":255,"example":"Acme Support Domain"},"sipDomainStatus":{"title":"SIP Domain Status","type":"string","description":"The provisioning status of the SIP domain\u0027s DNS records. \u0060PENDING\u0060 immediately after create, or after a \u0060regions\u0060 update that changes the region set, while provisioning runs asynchronously; \u0060ACTIVE\u0060 once provisioning completes; \u0060FAILED\u0060 if provisioning could not complete (see \u0060failureReason\u0060). A domain still \u0060PENDING\u0060 after 10 minutes is reported as \u0060FAILED\u0060. Inbound calls are only accepted on an \u0060ACTIVE\u0060 domain.","enum":["PENDING","ACTIVE","FAILED"],"example":"ACTIVE"},"ipAccessListIds":{"title":"IP Access List IDs","type":"array","description":"IDs of account-scoped IP access lists attached to the domain (max 25). Inbound SIP traffic to the domain is allowed from the union of the lists\u0027 CIDRs, which may contain at most 50 unique CIDRs. Unknown IDs return \u0060404\u0060.","items":{"type":"string","format":"uuid"},"maxItems":25,"default":[],"example":["6d8e9b22-4c2c-4a37-8f54-1be0eaf6b3e2"]},"sipDomainRegions":{"title":"SIP Domain Regions","type":"array","description":"The regions this domain provisions DNS records for and accepts calls in. Drives the region-pinned entries in \u0060fqdns\u0060.\n\n**At least one region is required for the domain to accept calls.** If \u0060regions\u0060 is omitted or empty, every inbound call to the domain is rejected, even though the domain is created and becomes \u0060ACTIVE\u0060.\n\nA call to \u0060\u003CuserId\u003E@\u003Cfqdn\u003E\u0060 must also be in one of that SIP user\u0027s \u0060allowedRegions\u0060.","items":{"$ref":"#/components/schemas/region"},"default":[],"example":["US","EU"]},"sipUserId":{"title":"SIP User ID","type":"string","description":"The customer-chosen SIP user identifier. 1-64 letters, numbers, \u0060.\u0060, \u0060_\u0060, or \u0060-\u0060. Case-sensitive. Immutable after creation.","pattern":"^[A-Za-z0-9._-]{1,64}$","minLength":1,"maxLength":64,"example":"alice"},"sipUserName":{"title":"SIP User Friendly Name","type":"string","description":"A customer-chosen friendly name for the SIP user, distinct from the immutable \u0060userId\u0060.","minLength":1,"maxLength":255,"example":"Alice Support Line"},"sipPassword":{"title":"SIP Digest Password","type":"string","writeOnly":true,"description":"The customer-supplied plaintext digest password. Must be 8-128 printable ASCII characters and include at least one uppercase letter, one lowercase letter, one number, and one special character. Required on create; supply again on \u0060PATCH\u0060 to rotate it. Bandwidth never stores or returns the plaintext \u2014 it is not recoverable, and this field never appears in a response.","pattern":"^(?=.*[A-Z])(?=.*[a-z])(?=.*[0-9])(?=.*[!-/:-@\\[-\u0060{-~])[ -~]{8,128}$","minLength":8,"maxLength":128,"example":"s0meRand0mP4ssw0rd!"},"sipUserAllowedRegions":{"title":"SIP User Allowed Regions","type":"array","description":"The list of regions where this user is permitted to authenticate. A user with no allowed regions cannot authenticate.","items":{"$ref":"#/components/schemas/region"},"default":[],"example":["US"]},"createdAt":{"title":"Created At","type":"string","format":"date-time","description":"RFC 3339 timestamp (UTC) of when the resource was created. Preserved across updates.","example":"2026-04-29T12:34:56.789012\u002B00:00"},"sipDomain":{"title":"SIP Domain","type":"object","properties":{"domain":{"$ref":"#/components/schemas/sipDomainLabel"},"name":{"$ref":"#/components/schemas/sipDomainName"},"applicationId":{"type":"string","nullable":true,"description":"The unique ID of the voice application this domain is bound to, or \u0060null\u0060 if unbound. A domain with no \u0060applicationId\u0060 cannot accept inbound calls until bound; you may set this later via \u0060PATCH\u0060.","example":"15f99d57-f823-4718-80cc-5d95d5b83e59"},"regions":{"$ref":"#/components/schemas/sipDomainRegions"},"ipAccessListIds":{"$ref":"#/components/schemas/ipAccessListIds"},"fqdns":{"type":"array","readOnly":true,"description":"**Read-only / derived.** The full SIP host(s) that inbound calls to this domain are reachable on \u2014 one global entry (\u0060{domain}.{accountId}.{suffix}\u0060), plus one region-pinned entry (\u0060{region}.{domain}.{accountId}.{suffix}\u0060) for each region in \u0060regions\u0060. These are the values to configure as the destination in your SBC or PBX. Customers with data-residency requirements should use the region-pinned host rather than the global one, since the global host may route to any of the domain\u0027s configured regions.","items":{"type":"string"},"example":["mycompany.9900000.sip-uri.voice-api.bandwidth.com","us.mycompany.9900000.sip-uri.voice-api.bandwidth.com","eu.mycompany.9900000.sip-uri.voice-api.bandwidth.com"]},"status":{"allOf":[{"$ref":"#/components/schemas/sipDomainStatus"}],"readOnly":true},"failureReason":{"type":"string","nullable":true,"readOnly":true,"description":"Why provisioning failed when \u0060status\u0060 is \u0060FAILED\u0060 (\u0060Domain provisioning failed\u0060 or \u0060Provisioning timed out\u0060); \u0060null\u0060 otherwise.","example":"Provisioning timed out"},"userIds":{"type":"array","readOnly":true,"description":"**Read-only / derived.** The SIP user IDs currently assigned to this domain (i.e. the users whose \u0060domain\u0060 field equals this domain). Inbound SIP calls to \u0060\u003CuserId\u003E@\u003Cfqdn\u003E\u0060 authenticate against the named user\u0027s credentials. Always empty in the response to the create request. To assign or unassign a user, \u0060PATCH /sip-users/{userId}\u0060 with the new \u0060domain\u0060 value (or an empty string, \u0060\u0022\u0022\u0060, to unassign).","items":{"$ref":"#/components/schemas/sipUserId"},"maxItems":5000,"example":["alice","support"]},"createdAt":{"$ref":"#/components/schemas/createdAt"}},"required":["domain","name","applicationId","regions","ipAccessListIds","fqdns","status","failureReason","userIds","createdAt"]},"sipUser":{"title":"SIP User","type":"object","properties":{"userId":{"$ref":"#/components/schemas/sipUserId"},"name":{"$ref":"#/components/schemas/sipUserName"},"domain":{"type":"string","nullable":true,"description":"The label of the SIP domain this user is currently assigned to, or \u0060null\u0060 if unassigned. A SIP user can be assigned to **at most one** SIP domain at a time. Inbound SIP calls to \u0060\u003CuserId\u003E@\u003Cthis domain\u0027s fqdn\u003E\u0060 authenticate against this user\u0027s credentials; calls to the user on any other domain are rejected.","example":"mycompany"},"allowedRegions":{"$ref":"#/components/schemas/sipUserAllowedRegions"},"createdAt":{"$ref":"#/components/schemas/createdAt"}},"required":["userId","name","domain","allowedRegions","createdAt"]},"createSipDomainRequest":{"title":"Create SIP Domain Request","type":"object","description":"\u0060domain\u0060 and \u0060name\u0060 are required. The domain is created with no users assigned; assign users by \u0060PATCH /sip-users/{userId}\u0060 with this domain\u0027s label.","properties":{"domain":{"$ref":"#/components/schemas/sipDomainLabel"},"name":{"$ref":"#/components/schemas/sipDomainName"},"applicationId":{"type":"string","nullable":true,"description":"Optional voice application to bind this domain to at creation time. Omit or send \u0060null\u0060 to create the domain unbound; bind it later via \u0060PATCH\u0060.","example":"15f99d57-f823-4718-80cc-5d95d5b83e59"},"regions":{"$ref":"#/components/schemas/sipDomainRegions"},"ipAccessListIds":{"$ref":"#/components/schemas/ipAccessListIds"}},"required":["domain","name"]},"updateSipDomainRequest":{"title":"Update SIP Domain Request","type":"object","description":"At least one field must be supplied. \u0060domain\u0060 (the label) is immutable and ignored if supplied; to change it, delete this domain and create a new one.\n\nA \u0060null\u0060 value for any field is treated the same as omitting it; it never clears a setting. To unbind \u0060applicationId\u0060, send an empty string. To clear \u0060regions\u0060 or \u0060ipAccessListIds\u0060, send an empty array.","properties":{"name":{"type":"string","nullable":true,"allOf":[{"$ref":"#/components/schemas/sipDomainName"}],"description":"Replaces the friendly name for this domain."},"applicationId":{"type":"string","nullable":true,"description":"Binds or rebinds the domain to the named voice application, or an empty string (\u0060\u0022\u0022\u0060) to unbind. \u0060null\u0060 leaves the binding unchanged.","example":"15f99d57-f823-4718-80cc-5d95d5b83e59"},"regions":{"type":"array","nullable":true,"items":{"$ref":"#/components/schemas/region"},"description":"Replaces the domain\u0027s region set; send an empty array to clear it. \u0060null\u0060 leaves it unchanged. If the set changes, DNS records are reprovisioned and \u0060status\u0060 returns to \u0060PENDING\u0060."},"ipAccessListIds":{"type":"array","nullable":true,"items":{"type":"string","format":"uuid"},"maxItems":25,"description":"Replaces the domain\u0027s attached IP access lists; send an empty array to detach all. \u0060null\u0060 leaves them unchanged. Unknown IDs return \u0060404\u0060."}}},"createSipUserRequest":{"title":"Create SIP User Request","type":"object","description":"\u0060userId\u0060, \u0060name\u0060, and \u0060password\u0060 are required. Optionally supply \u0060domain\u0060 to assign the user to a SIP domain at creation time; omit (or send \u0060null\u0060) to leave the user unassigned. The user can be reassigned later via \u0060PATCH /sip-users/{userId}\u0060.","properties":{"userId":{"$ref":"#/components/schemas/sipUserId"},"name":{"$ref":"#/components/schemas/sipUserName"},"password":{"$ref":"#/components/schemas/sipPassword"},"domain":{"type":"string","nullable":true,"description":"Optional SIP domain label to assign this user to at creation time. Must reference an existing SIP domain on this account; unknown domains return \u0060404\u0060. Omit or send \u0060null\u0060 to create the user without a domain assignment.","example":"mycompany"},"allowedRegions":{"$ref":"#/components/schemas/sipUserAllowedRegions"}},"required":["userId","name","password"]},"updateSipUserRequest":{"title":"Update SIP User Request","type":"object","description":"At least one field must be supplied. \u0060userId\u0060 is immutable and ignored if supplied; to change it, delete the user and recreate.\n\nSupplying \u0060domain\u0060 reassigns the user to the named SIP domain, overwriting any prior assignment. Supply an empty string (\u0060\u0022\u0022\u0060) to unassign the user from any domain. Supplying \u0060password\u0060 rotates the digest credential; the plaintext