        DefaultRespOrgId:
          type: string
          description: >-
            The Bandwidth RespOrgId used as the default for this customer (e.g.
            JYT01).
        TollFreeSettings:
          $ref: '#/components/schemas/tollFreeSettings'
    tollFreeSettings:
      type: object
      properties:
        RespOrgException:
          type: boolean
          description: >-
            A value of true indicates that the customer is their own RespOrg, or
            Responsible Organization, and any numbers ported in should NOT be
            changed to a Bandwidth RespOrg ID. A value of false indicates that
            the customer would like to have Bandwidth act as RespOrg on their
            behalf.
          default: false
        RespOrgIdList:
          type: array
          description: >-
            A list of RespOrgId values that the customer owns if they are a
            RespOrg Exception customer (i.e. RespOrgException is set to true).
          items:
            type: object
            properties:
              RespOrgId:
                type: string
                description: A 5-character RespOrgId value assigned by SOMOS.
        TollFreeTemplateAssignmentsSearch:
          type: boolean
          description: >-
            A value of true indicates that all users of this account are
            authorized to use the tollFreeTemplateAssignments search endpoint to
            fetch the toll free routing template names associated with telephone
            numbers on this account.
          default: false
    tollFreeSettingsResponseJson:
      type: object
      properties:
        tollFreeSettings:
          $ref: '#/components/schemas/tollFreeSettingsJson'
        targetBandwidthRespOrgId:
          type: string
          description: >-
            The Bandwidth RespOrgId used as the default for this customer (e.g.
            JYT01).
    tollFreeSettingsJson:
      type: object
      properties:
        respOrgException:
          type: boolean
          description: >-
            A value of true indicates that the customer is their own RespOrg, or
            Responsible Organization, and any numbers ported in should NOT be
            changed to a Bandwidth RespOrg ID. A value of false indicates that
            the customer would like to have Bandwidth act as RespOrg on their
            behalf.
          default: false
        respOrgIds:
          type: array
          description: >-
            A list of RespOrgId values that the customer owns if they are a
            RespOrg Exception customer (i.e. respOrgException is set to true).
          items:
            type: string
            description: A 5-character RespOrgId value assigned by SOMOS.
        tollFreeTemplateAssignmentsSearch:
          type: boolean
          description: >-
            A value of true indicates that all users of this account are
            authorized to use the tollFreeTemplateAssignments search endpoint to
            fetch the toll free routing template names associated with telephone
            numbers on this account.
          default: false
