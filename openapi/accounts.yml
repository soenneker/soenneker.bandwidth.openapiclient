    customerProvidedId:
      description: >-
        Customer can provide an optional id. Note that the customer can use the
        same id across multiple orders.
      maxLength: 10
      type: string
      example: '123456'
    customName:
      description: Customer can provide an optional name
      type: string
      example: Custom Name
    ucType:
      description: >-
        For UC Trunking accounts the Type parameter describes the kind of UC
        trunking that is provided. The Type parameter is one of Seats, Premise,
        or Cloud.
      type: string
      enum:
        - Seats
        - Premise
        - Cloud
    ucUsageCategory:
      description: >-
        For UC Trunking accounts the UsageCategory parameter describes the kind
        of UC trunking that is provided. The UsageCategory parameter is one of
        UC250, UC500 or UC1000.
      type: string
      enum:
        - UC250
        - UC500
        - UC1000
