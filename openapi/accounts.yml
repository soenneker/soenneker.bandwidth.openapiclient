      type: string
    associatedOutboundNumberErrorReason:
      description: >-
        <p> Describes the reason an associated outbound number has failed. This
        could be due to validation or business logic.

        <br>

        Possible Error Reasons include:
          <ul>
            <li> Invalid number format. </li>
            <li> Number is already associated with location ${location_name} [ID: ${location_id}]. </li>
            <li> Associated Outbound Number not found with location [ID: ${location_id}]. </li>
