  securitySchemes:
    Bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Bearer authentication (also called token authentication) is an HTTP
        authentication scheme that involves security tokens called bearer
        tokens.

        The name “Bearer authentication” can be understood as “give access to
        the bearer of this token.”

        The client must send this token in the `Authorization` header when
        making requests to protected resources.


        - Example: `Authorization: Bearer <token>`


        Where `<token>` should be replaced with the token string without angle
        brackets.


        For more information, see our [Credentials](/docs/credentials)
        documentation.
