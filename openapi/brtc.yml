          minimum: 0
          example: 10
        totalElements:
          type: integer
          description: The total number of items.
          minimum: 0
          example: 100
        totalPages:
          type: integer
          description: The total number of pages.
          minimum: 0
          example: 10
        pageNumber:
          type: integer
          description: The current page number.
          minimum: 0
          example: 0
      required:
