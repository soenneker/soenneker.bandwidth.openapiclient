openapi: 3.0.3
info:
  title: Voice Application Management API
  description: >-
    Bandwidth's Voice Application Management API


    Bandwidth's Voice Application Management API allows you to manage SIP
    Authentication for inbound calls to your Voice Applications, and to manage
    account-scoped SIP domains, SIP users, and IP access lists for custom SIP
    domains and per-user identities.


    Two independent ways to receive inbound SIP calls are supported:


    - **Default-realm SIP identity** (`sip:{applicationId}@{auth_realm}`) —
    configured with the SIP fields on the Voice Applications endpoints
    (`inboundSipCallsEnabled`, `passwordAuthEnabled`, `allowedSourceIps`,
    `allowedRegions`). These fields apply only to the default realm.

    - **Custom SIP domains** — configured with the SIP Domains, SIP Users, and
    IP Access Lists endpoints. Calls to a custom domain are authenticated only
    against the domain's IP access lists and its SIP users; the voice
    application's SIP fields have no effect on them.


    ## Base URL


    `https://api.bandwidth.com/v2`
  version: 1.0.0
  termsOfService: https://www.bandwidth.com/legal/terms-of-use-bandwidthcom-web-sites/
  contact:
    name: Bandwidth Support
    email: support@bandwidth.com
    url: https://support.bandwidth.com
servers:
  - url: https://api.bandwidth.com/v2
    description: Production
paths:
  /accounts/{accountId}/voice-applications/{applicationId}:
    parameters:
      - $ref: '#/components/parameters/accountId'
      - $ref: '#/components/parameters/applicationId'
    get:
      summary: Retrieve a voice application
      operationId: getVoiceApplication
      description: >-
        Retrieves information about a voice application, including its
        default-realm SIP settings (`sip:{applicationId}@{auth_realm}`). These
        settings do not apply to custom SIP domains bound to the application.
      tags:
        - Voice Applications
      responses:
        '200':
          $ref: '#/components/responses/getVoiceApplicationResponse'
        '400':
          $ref: '#/components/responses/badRequestError'
        '401':
          $ref: '#/components/responses/unauthorizedError'
        '403':
          $ref: '#/components/responses/forbiddenError'
        '404':
          $ref: '#/components/responses/notFoundError'
        '405':
          $ref: '#/components/responses/notAllowedError'
        '429':
          $ref: '#/components/responses/tooManyRequestsError'
        default:
          $ref: '#/components/responses/defaultError'
    patch:
      summary: Update a voice application
      operationId: updateVoiceApplication
      description: >-
        Updates the default-realm SIP settings for a voice application. These
        govern only the default-realm SIP identity
        (`sip:{applicationId}@{auth_realm}`); they do not affect calls to custom
        SIP domains bound to the application, which are configured with the SIP
        Domains, SIP Users, and IP Access Lists endpoints. Both are supported
        side by side.


        Sending `inboundSipCallsEnabled: false` disables inbound SIP calls and
        clears the application's SIP settings; any other fields in the request
        are still validated but are not applied. If inbound SIP calls are not
        yet enabled, the request must include `inboundSipCallsEnabled: true`,
        otherwise a `400` is returned.


        Every request that includes `passwordAuthEnabled: true` generates a new
        SIP digest password, even if password auth was already enabled, and
        returns it once as `sipAuthPassword`. The previous password stops
        working immediately. Omit `passwordAuthEnabled` to keep the existing
        password.
      tags:
        - Voice Applications
      requestBody:
        $ref: '#/components/requestBodies/updateVoiceApplicationRequestBody'
      responses:
        '200':
          $ref: '#/components/responses/updateVoiceApplicationResponse'
        '400':
          $ref: '#/components/responses/badRequestError'
        '401':
          $ref: '#/components/responses/unauthorizedError'
        '403':
          $ref: '#/components/responses/forbiddenError'
        '404':
          $ref: '#/components/responses/notFoundError'
        '405':
          $ref: '#/components/responses/notAllowedError'
        '429':
          $ref: '#/components/responses/tooManyRequestsError'
        default:
          $ref: '#/components/responses/defaultError'
  /accounts/{accountId}/voice-applications/sip-domains:
    parameters:
      - $ref: '#/components/parameters/accountId'
    post:
      summary: Create a SIP domain
      operationId: createSipDomain
      description: >-
        Registers a new account-scoped SIP domain. Calls to a custom SIP domain
        are authenticated only against its attached IP access lists and its
        assigned SIP users; the bound voice application's default-realm SIP
        settings (`inboundSipCallsEnabled`, `passwordAuthEnabled`,
        `allowedSourceIps`, `allowedRegions`) do not apply.


        - Calls whose request URI includes a user (`<userId>@<fqdn>`) are
        challenged and authenticated with that SIP user's credentials. If IP
        access lists are attached, the source IP must also match one of them.

        - Calls with no user in the request URI are authenticated by source IP
        alone, and are rejected unless the domain has at least one attached IP
        access list.

        - Calls are only accepted in the domain's `regions`. A domain created
        without any `regions` rejects all inbound calls until at least one
        region is added via `PATCH`.


        The supplied `domain` is a label that Bandwidth combines with the
        account ID and its env-wide SIP host suffix to form the full SIP host(s)
        that will be reachable on inbound calls. The full hosts are returned as
        `fqdns` on the resource (a global entry, plus one per configured region)
        — those are the values to configure as the destination in your SBC or
        PBX.


        Domain labels are unique **within the account** (not globally) — a `409`
        is returned if you already have a domain registered under this label.
        Region codes (`us`, `eu`) and `null` are reserved and cannot be used as
        a domain label; a `400` is returned otherwise. Each account can register
        up to 500 SIP domains; a `400` is returned once the limit is reached.


        `applicationId` is optional — you can register a domain and bind it to
        an application later via `PATCH`. When supplied, it must reference an
        existing voice application on this account (`404` if it does not exist,
        `400` if it is not a voice application). A domain with no
        `applicationId` cannot accept inbound calls until bound.


        `ipAccessListIds` must reference existing IP access lists on this
        account (`404` otherwise). The attached lists may contain at most 50
        unique CIDRs in total; a `400` is returned otherwise.


        The domain is provisioned asynchronously; it is created with `status:
        "PENDING"` and transitions to `"ACTIVE"` once DNS provisioning
        completes, or `"FAILED"` if provisioning could not complete.
      tags:
        - SIP Domains
      requestBody:
        $ref: '#/components/requestBodies/createSipDomainRequestBody'
      responses:
        '201':
          $ref: '#/components/responses/createSipDomainResponse'
        default:
          $ref: '#/components/responses/defaultError'
    get:
      summary: List SIP domains
      operationId: listSipDomains
      description: >-
        Lists the SIP domains registered on this account. Results are paginated.
        A page may hold fewer than `pageSize` resources, or none, while a `next`
        link is still present; keep following the `next` link in `links` until
        it is absent to retrieve every resource. `links` always includes a
        `self` link to the current page.
      tags:
        - SIP Domains
      parameters:
        - $ref: '#/components/parameters/pageSize'
        - $ref: '#/components/parameters/afterCursor'
        - $ref: '#/components/parameters/sipDomainApplicationIdFilter'
        - $ref: '#/components/parameters/sipDomainStatusFilter'
      responses:
        '200':
          $ref: '#/components/responses/listSipDomainsResponse'
        default:
          $ref: '#/components/responses/defaultError'
  /accounts/{accountId}/voice-applications/sip-domains/{domain}:
    parameters:
      - $ref: '#/components/parameters/accountId'
      - $ref: '#/components/parameters/domain'
    get:
      summary: Retrieve a SIP domain
      operationId: getSipDomain
      description: Retrieves the SIP domain registered under this label on the account.
      tags:
        - SIP Domains
      responses:
        '200':
          $ref: '#/components/responses/getSipDomainResponse'
        default:
          $ref: '#/components/responses/defaultError'
    patch:
      summary: Update a SIP domain
      operationId: updateSipDomain
      description: >-
        Updates `name`, `applicationId`, `regions`, and/or `ipAccessListIds` on
        the SIP domain. At least one field must be supplied. `domain` (the
        label) is immutable; to change it, delete this domain and create a new
        one.


        Supplying `applicationId` binds (or rebinds) the domain to a voice
        application on this account; supply an empty string (`""`) to unbind.
        Supplying `regions` replaces the domain's region set; if the set
        changes, the DNS records are reprovisioned and `status` returns to
        `"PENDING"`. Supplying `ipAccessListIds` replaces the domain's attached
        IP access lists (max 25, at most 50 unique CIDRs in total); unknown IDs
        return `404`.
      tags:
        - SIP Domains
      requestBody:
        $ref: '#/components/requestBodies/updateSipDomainRequestBody'
      responses:
        '200':
          $ref: '#/components/responses/updateSipDomainResponse'
        default:
          $ref: '#/components/responses/defaultError'
    delete:
      summary: Delete a SIP domain
      operationId: deleteSipDomain
      description: >-
        Deletes the SIP domain. SIP users that were assigned to this domain
        (`user.domain == this domain`) remain on the account but their `domain`
        is set to `null` (unassigned); they will not authenticate on any domain
        until reassigned via `PATCH /sip-users/{userId}` with a new `domain`.
        Attached IP access lists and the bound voice application are not
        affected.


        The domain's DNS records are removed asynchronously. The label is freed
        for reuse on this account immediately.
      tags:
        - SIP Domains
      responses:
        '204':
          description: No Content
        default:
          $ref: '#/components/responses/defaultError'
  /accounts/{accountId}/voice-applications/sip-users:
    parameters:
      - $ref: '#/components/parameters/accountId'
    post:
      summary: Create a SIP user
      operationId: createSipUser
      description: >-
        Creates a new SIP user on this account. `userId` is unique within the
        account and immutable after creation; to change it, delete the user and
        recreate.


        **Account-scoped resource** — SIP users belong to the account, not to a
        specific voice application, and authenticate calls to custom SIP domains
        only; they cannot be used with the default-realm SIP identity. Each user
        can be assigned to **at most one** SIP domain via the `domain` field —
        supply it on create to make the user immediately reachable on that
        domain, or omit it to create an unassigned user that you assign later
        via `PATCH`. The domain does not need to be `ACTIVE` to be assigned.


        `password` is **required and customer-supplied** — Bandwidth never
        generates a password on your behalf, and the plaintext is never stored
        or returned in any response.


        A user can only authenticate in the regions listed in `allowedRegions`;
        a user with no allowed regions cannot authenticate.


        Each account can have up to 5,000 SIP users; a `400` is returned once
        the limit is reached.
      tags:
        - SIP Users
      requestBody:
        $ref: '#/components/requestBodies/createSipUserRequestBody'
      responses:
        '201':
          $ref: '#/components/responses/createSipUserResponse'
        default:
          $ref: '#/components/responses/defaultError'
    get:
      summary: List SIP users
      operationId: listSipUsers
      description: >-
        Lists the SIP users on this account. Results are paginated. A page may
        hold fewer than `pageSize` resources, or none, while a `next` link is
        still present; keep following the `next` link in `links` until it is
        absent to retrieve every resource. `links` always includes a `self` link
        to the current page.
      tags:
        - SIP Users
      parameters:
        - $ref: '#/components/parameters/pageSize'
        - $ref: '#/components/parameters/afterCursor'
        - $ref: '#/components/parameters/sipUserDomainFilter'
      responses:
        '200':
          $ref: '#/components/responses/listSipUsersResponse'
        default:
          $ref: '#/components/responses/defaultError'
  /accounts/{accountId}/voice-applications/sip-users/{userId}:
    parameters:
      - $ref: '#/components/parameters/accountId'
      - $ref: '#/components/parameters/userId'
    get:
      summary: Retrieve a SIP user
      operationId: getSipUser
      description: >-
        Retrieves a SIP user on this account, including the `domain` the user is
        assigned to (or `null` if unassigned). The `password` field is **never**
        returned on this or any other endpoint — Bandwidth does not store the
        plaintext and cannot recover it.
      tags:
        - SIP Users
      responses:
        '200':
          $ref: '#/components/responses/getSipUserResponse'
        default:
          $ref: '#/components/responses/defaultError'
    patch:
      summary: Update a SIP user
      operationId: updateSipUser
      description: >-
        Updates `name`, `domain`, `password`, and/or `allowedRegions` on the SIP
        user. At least one field must be supplied. `userId` is immutable; to
        change it, delete the user and recreate.


        Supplying `domain` reassigns the user to a new SIP domain — a user can
        be on at most one domain at a time, so the prior assignment (if any) is
        overwritten atomically in a single write. Supply an empty string (`""`)
        to unassign the user from any domain. The supplied `domain` must
        reference an existing SIP domain on this account; unknown domains return
        `404`.


        Supplying `password` rotates the user's digest credential; the plaintext
        is never echoed back in the response. A password cannot be removed, so
        `password: null` returns `400`.
      tags:
        - SIP Users
      requestBody:
        $ref: '#/components/requestBodies/updateSipUserRequestBody'
      responses:
        '200':
          $ref: '#/components/responses/updateSipUserResponse'
        default:
          $ref: '#/components/responses/defaultError'
    delete:
      summary: Delete a SIP user
      operationId: deleteSipUser
      description: >-
        Deletes the SIP user along with the user's digest credential. The SIP
        domain the user was assigned to (if any) continues to exist; the user
        simply disappears from that domain's `userIds` list.
      tags:
        - SIP Users
      responses:
        '204':
          description: No Content
        default:
          $ref: '#/components/responses/defaultError'
  /accounts/{accountId}/voice-applications/ip-access-lists:
    parameters:
      - $ref: '#/components/parameters/accountId'
    post:
      summary: Create an IP access list
      operationId: createIpAccessList
      description: >-
        Creates a new account-scoped IP access list — a named, reusable set of
        CIDR blocks. Attach it to one or more SIP domains via
        `SipDomain.ipAccessListIds` (max 25 lists per domain) to gate inbound
        SIP traffic to those domains by source IP.


        **Account-scoped resource** — IP access lists belong to the account, not
        to a specific voice application or SIP domain, and are reusable across
        any number of the account's SIP domains. IP access lists apply to custom
        SIP domains only. The voice application's `allowedSourceIps` field is
        separate and applies only to the default-realm SIP identity.


        Names do not need to be unique. Each account can have up to 500 IP
        access lists; a `400` is returned once the limit is reached.
      tags:
        - IP Access Lists
      requestBody:
        $ref: '#/components/requestBodies/createIpAccessListRequestBody'
      responses:
        '201':
          $ref: '#/components/responses/createIpAccessListResponse'
        default:
          $ref: '#/components/responses/defaultError'
    get:
      summary: List IP access lists
      operationId: listIpAccessLists
      description: >-
        Lists the IP access lists registered on this account. Results are
        paginated. A page may hold fewer than `pageSize` resources, or none,
        while a `next` link is still present; keep following the `next` link in
        `links` until it is absent to retrieve every resource. `links` always
        includes a `self` link to the current page.
      tags:
        - IP Access Lists
      parameters:
        - $ref: '#/components/parameters/pageSize'
        - $ref: '#/components/parameters/afterCursor'
        - $ref: '#/components/parameters/ipAccessListNameFilter'
      responses:
        '200':
          $ref: '#/components/responses/listIpAccessListsResponse'
        default:
          $ref: '#/components/responses/defaultError'
  /accounts/{accountId}/voice-applications/ip-access-lists/{ipAccessListId}:
    parameters:
      - $ref: '#/components/parameters/accountId'
      - $ref: '#/components/parameters/ipAccessListId'
    get:
      summary: Retrieve an IP access list
      operationId: getIpAccessList
      description: Retrieves a single IP access list on the account.
      tags:
        - IP Access Lists
      responses:
        '200':
          $ref: '#/components/responses/getIpAccessListResponse'
        default:
          $ref: '#/components/responses/defaultError'
    patch:
      summary: Update an IP access list
      operationId: updateIpAccessList
      description: >-
        Updates the `name` and/or `cidrs` on an IP access list. At least one
        field must be supplied.


        A `cidrs` change takes effect on every SIP domain that references this
        list. A `400` is returned if the change would give any of those domains
        more than 50 unique CIDRs across its attached lists.
      tags:
        - IP Access Lists
      requestBody:
        $ref: '#/components/requestBodies/updateIpAccessListRequestBody'
      responses:
        '200':
          $ref: '#/components/responses/updateIpAccessListResponse'
        default:
          $ref: '#/components/responses/defaultError'
    delete:
      summary: Delete an IP access list
      operationId: deleteIpAccessList
      description: >-
        Deletes the IP access list. The list is removed from `ipAccessListIds`
        on every SIP domain that references it, and those domains stop allowing
        traffic from its CIDRs.
      tags:
        - IP Access Lists
      responses:
        '204':
          description: No Content
        default:
          $ref: '#/components/responses/defaultError'
components:
  parameters:
    accountId:
      in: path
      name: accountId
      required: true
      schema:
        type: string
      description: Your Bandwidth Account ID.
      example: '9900000'
    applicationId:
      name: applicationId
      in: path
      required: true
      schema:
        type: string
      description: The unique ID of the application.
      example: 15f99d57-f823-4718-80cc-5d95d5b83e59
    domain:
      name: domain
      in: path
      required: true
      description: The SIP domain label, as registered. Case-insensitive.
      schema:
        $ref: '#/components/schemas/sipDomainLabel'
      example: mycompany
    userId:
      name: userId
      in: path
      required: true
      description: The SIP user identifier, as registered on the account. Case-sensitive.
      schema:
        $ref: '#/components/schemas/sipUserId'
      example: alice
    ipAccessListId:
      name: ipAccessListId
      in: path
      required: true
      description: The unique ID of the IP access list. An unknown ID returns `404`.
      schema:
        type: string
      example: 6d8e9b22-4c2c-4a37-8f54-1be0eaf6b3e2
    pageSize:
      name: pageSize
      in: query
      required: false
      description: >-
        The maximum number of resources to return in a single page. Values
        outside 1-100 return `400`.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
      example: 25
    afterCursor:
      name: afterCursor
      in: query
      required: false
      description: >-
        Opaque cursor returned in the `next` link of a previous list response.
        Pass it back verbatim to fetch the next page. An invalid cursor, or one
        issued for a different account or resource type, returns `400`.
      schema:
        type: string
      example: eyJhY2NvdW50SWQiOiI5OTAwMDAwIn0=
    sipDomainApplicationIdFilter:
      name: applicationId
      in: query
      required: false
      description: Filter SIP domains by the voice application they are bound to.
      style: deepObject
      explode: true
      schema:
        $ref: '#/components/schemas/sipDomainApplicationIdFilterQueryParameter'
    sipDomainStatusFilter:
      name: status
      in: query
      required: false
      description: Filter SIP domains by provisioning `status`.
      style: deepObject
      explode: true
      schema:
        $ref: '#/components/schemas/sipDomainStatusFilterQueryParameter'
    sipUserDomainFilter:
      name: domain
      in: query
      required: false
      description: Filter SIP users by the SIP domain they are assigned to.
      style: deepObject
      explode: true
      schema:
        $ref: '#/components/schemas/sipUserDomainFilterQueryParameter'
    ipAccessListNameFilter:
      name: name
      in: query
      required: false
      description: Filter IP access lists by name.
      style: deepObject
      explode: true
      schema:
        $ref: '#/components/schemas/ipAccessListNameFilterQueryParameter'
  requestBodies:
    updateVoiceApplicationRequestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/updateVoiceApplicationRequest'
          examples:
            enableWithPasswordAuth:
              $ref: '#/components/examples/updateRequestEnableWithPasswordAuth'
            enableWithPasswordAuthAndIpAcl:
              $ref: >-
                #/components/examples/updateRequestEnableWithPasswordAuthAndIpAcl
            enableWithIpAclOnly:
              $ref: '#/components/examples/updateRequestEnableWithIpAclOnly'
            disableInboundSipCalls:
              $ref: '#/components/examples/updateRequestDisableInboundSipCalls'
            updateRegionsOnly:
              $ref: '#/components/examples/updateRequestUpdateRegionsOnly'
    createSipDomainRequestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/createSipDomainRequest'
          examples:
            createSipDomainUnbound:
              $ref: '#/components/examples/createSipDomainUnboundRequestExample'
            createSipDomainBound:
              $ref: '#/components/examples/createSipDomainBoundRequestExample'
    updateSipDomainRequestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/updateSipDomainRequest'
          examples:
            bindApplication:
              $ref: >-
                #/components/examples/updateSipDomainBindApplicationRequestExample
            updateIpAccessLists:
              $ref: '#/components/examples/updateSipDomainIpAccessListsRequestExample'
            updateRegions:
              $ref: '#/components/examples/updateSipDomainRegionsRequestExample'
    createSipUserRequestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/createSipUserRequest'
          examples:
            createSipUserAssigned:
              $ref: '#/components/examples/createSipUserAssignedRequestExample'
            createSipUserUnassigned:
              $ref: '#/components/examples/createSipUserUnassignedRequestExample'
    updateSipUserRequestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/updateSipUserRequest'
          examples:
            reassignDomain:
              $ref: '#/components/examples/updateSipUserReassignDomainRequestExample'
            unassignDomain:
              $ref: '#/components/examples/updateSipUserUnassignDomainRequestExample'
            rotatePassword:
              $ref: '#/components/examples/updateSipUserRotatePasswordRequestExample'
            updateRegions:
              $ref: '#/components/examples/updateSipUserUpdateRegionsRequestExample'
    createIpAccessListRequestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/createIpAccessListRequest'
          examples:
            createIpAccessList:
              $ref: '#/components/examples/createIpAccessListRequestExample'
            createOpenIpAccessList:
              $ref: '#/components/examples/createOpenIpAccessListRequestExample'
    updateIpAccessListRequestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/updateIpAccessListRequest'
          examples:
            renameIpAccessList:
              $ref: '#/components/examples/updateIpAccessListRequestExample'
  responses:
    getVoiceApplicationResponse:
      description: OK
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/getVoiceApplicationResponse'
          examples:
            passwordAuthEnabled:
              $ref: '#/components/examples/getResponsePasswordAuthEnabled'
            ipAclOnly:
              $ref: '#/components/examples/getResponseIpAclOnly'
            inboundSipDisabled:
              $ref: '#/components/examples/getResponseInboundSipDisabled'
    updateVoiceApplicationResponse:
      description: OK
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/updateVoiceApplicationResponse'
          examples:
            enableWithPasswordAuth:
              $ref: '#/components/examples/updateResponseEnableWithPasswordAuth'
            enableWithPasswordAuthAndIpAcl:
              $ref: >-
                #/components/examples/updateResponseEnableWithPasswordAuthAndIpAcl
            enableWithIpAclOnly:
              $ref: '#/components/examples/updateResponseEnableWithIpAclOnly'
            disableInboundSipCalls:
              $ref: '#/components/examples/updateResponseDisableInboundSipCalls'
            updateRegionsOnly:
              $ref: '#/components/examples/updateResponseUpdateRegionsOnly'
    badRequestError:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/genericError'
          examples:
            badRequestErrorExample:
              $ref: '#/components/examples/badRequestErrorExample'
            applicationIsNotAVoiceApplicationErrorExample:
              $ref: >-
                #/components/examples/applicationIsNotAVoiceApplicationErrorExample
    unauthorizedError:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/genericError'
          examples:
            unauthorizedErrorExample:
              $ref: '#/components/examples/unauthorizedErrorExample'
    forbiddenError:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/genericError'
          examples:
            forbiddenErrorExample:
              $ref: '#/components/examples/forbiddenErrorExample'
    notFoundError:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/genericError'
          examples:
            notFoundErrorExample:
              $ref: '#/components/examples/notFoundErrorExample'
            applicationDoesNotExistErrorExample:
              $ref: '#/components/examples/applicationDoesNotExistErrorExample'
    notAllowedError:
      description: Method Not Allowed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/genericError'
          examples:
            notAllowedErrorExample:
              $ref: '#/components/examples/notAllowedErrorExample'
    tooManyRequestsError:
      description: Too Many Requests
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/genericError'
          examples:
            tooManyRequestsErrorExample:
              $ref: '#/components/examples/tooManyRequestsErrorExample'
    defaultError:
      description: >-
        Error response. The shape is the standard `links/data/errors` envelope
        with `data: null`. The HTTP status code on the wire indicates the class
        of failure (400 validation, 401 auth, 403 permission, 404 not-found, 405
        method not allowed, 409 conflict, 429 rate-limited by the API gateway,
        500 server error, 503 authentication temporarily unavailable). Request
        validation errors identify the offending body field in `source.field`,
        or the query parameter in `source.parameter`. The examples below
        illustrate the most common scenarios for the SIP-domains, SIP-users, and
        IP-access-list endpoints.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/genericError'
          examples:
            badRequest:
              $ref: '#/components/examples/badRequestErrorExample'
            reservedRegionLabel:
              $ref: '#/components/examples/reservedRegionLabelErrorExample'
            invalidSipPassword:
              $ref: '#/components/examples/invalidSipPasswordErrorExample'
            domainCidrLimit:
              $ref: '#/components/examples/domainCidrLimitErrorExample'
            invalidCursor:
              $ref: '#/components/examples/invalidCursorErrorExample'
            unauthorized:
              $ref: '#/components/examples/unauthorizedErrorExample'
            forbidden:
              $ref: '#/components/examples/forbiddenErrorExample'
            notFound:
              $ref: '#/components/examples/notFoundErrorExample'
            tooManyRequests:
              $ref: '#/components/examples/tooManyRequestsErrorExample'
            duplicateSipDomain:
              $ref: '#/components/examples/duplicateSipDomainErrorExample'
            duplicateSipUserId:
              $ref: '#/components/examples/duplicateSipUserIdErrorExample'
    createSipDomainResponse:
      description: Created
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/sipDomainResponseEnvelope'
          examples:
            sipDomain:
              $ref: '#/components/examples/createSipDomainResponseExample'
    getSipDomainResponse:
      description: OK
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/sipDomainResponseEnvelope'
          examples:
            sipDomain:
              $ref: '#/components/examples/sipDomainResponseExample'
    updateSipDomainResponse:
      description: OK
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/sipDomainResponseEnvelope'
          examples:
            sipDomain:
              $ref: '#/components/examples/sipDomainResponseExample'
    listSipDomainsResponse:
      description: OK
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/listSipDomainsResponseEnvelope'
          examples:
            listSipDomains:
              $ref: '#/components/examples/listSipDomainsExample'
    createSipUserResponse:
      description: Created
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/sipUserResponseEnvelope'
          examples:
            createSipUserAssigned:
              $ref: '#/components/examples/createSipUserAssignedResponseExample'
            createSipUserUnassigned:
              $ref: '#/components/examples/createSipUserUnassignedResponseExample'
    getSipUserResponse:
      description: OK
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/sipUserResponseEnvelope'
          examples:
            sipUser:
              $ref: '#/components/examples/getSipUserResponseExample'
    listSipUsersResponse:
      description: OK
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/listSipUsersResponseEnvelope'
          examples:
            listSipUsers:
              $ref: '#/components/examples/listSipUsersExample'
    updateSipUserResponse:
      description: OK
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/sipUserResponseEnvelope'
          examples:
            reassignDomain:
              $ref: '#/components/examples/updateSipUserReassignDomainResponseExample'
            rotatePassword:
              $ref: '#/components/examples/updateSipUserRotatePasswordResponseExample'
            updateRegions:
              $ref: '#/components/examples/updateSipUserUpdateRegionsResponseExample'
    createIpAccessListResponse:
      description: Created
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ipAccessListResponseEnvelope'
          examples:
            ipAccessList:
