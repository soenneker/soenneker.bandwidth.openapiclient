    ipv4Cidr:
      title: IPv4 CIDR
      type: string
      description: >-
        An IPv4 CIDR block in canonical `<network>/<prefix>` form (host bits
        must be zero, e.g. `192.168.1.0/24`, not `192.168.1.5/24`). A bare IP
        address is accepted and stored as `/32`. Any block that overlaps a
        private or reserved range is rejected (so a supernet such as
        `172.0.0.0/8` is rejected too): `0.0.0.0/8`, `10.0.0.0/8`,
        `100.64.0.0/10`, `127.0.0.0/8`, `169.254.0.0/16`, `172.16.0.0/12`,
        `192.0.0.0/24`, `192.168.0.0/16`, `224.0.0.0/4`, and `240.0.0.0/4`.
        `0.0.0.0/0` is allowed and permits all source IPs.
      pattern: ^(\d{1,3}\.){3}\d{1,3}(/\d{1,2})?$
      example: 203.0.113.0/24
    ipAccessListCidrs:
      title: IP Access List CIDRs
      type: array
      description: >-
        The IPv4 CIDR blocks in this access list. Entries must be unique after
        normalization.
      items:
        $ref: '#/components/schemas/ipv4Cidr'
      minItems: 1
      maxItems: 25
      uniqueItems: true
      example:
        - 203.0.113.0/24
        - 198.51.100.7/32
    ipAccessListName:
      title: IP Access List Name
      type: string
      description: Human-readable label for the IP access list. Does not need to be unique.
      minLength: 1
      maxLength: 255
      example: Office NAT
    ipAccessList:
      title: IP Access List
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: The unique ID of the IP access list, generated by Bandwidth.
          example: 6d8e9b22-4c2c-4a37-8f54-1be0eaf6b3e2
        name:
          $ref: '#/components/schemas/ipAccessListName'
        cidrs:
          $ref: '#/components/schemas/ipAccessListCidrs'
        createdAt:
          $ref: '#/components/schemas/createdAt'
      required:
        - id
        - name
        - cidrs
        - createdAt
    createIpAccessListRequest:
      title: Create IP Access List Request
      type: object
      description: '`name` and `cidrs` are required.'
      properties:
        name:
          $ref: '#/components/schemas/ipAccessListName'
        cidrs:
          $ref: '#/components/schemas/ipAccessListCidrs'
      required:
        - name
        - cidrs
    updateIpAccessListRequest:
      title: Update IP Access List Request
      type: object
      description: >-
        Updates `name` and/or `cidrs`. At least one field must be supplied. A
        `null` value is treated the same as omitting the field. `cidrs`, when
        supplied, replaces the full list (not a merge).
      properties:
        name:
          type: string
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ipAccessListName'
          description: >-
            Replaces the friendly label for this IP access list. Omit to leave
            unchanged.
        cidrs:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/ipv4Cidr'
          allOf:
            - $ref: '#/components/schemas/ipAccessListCidrs'
          description: >-
            Replaces the full CIDR list for this IP access list. Omit to leave
            unchanged.
    ipAccessListResponseEnvelope:
      title: IP Access List Response
      type: object
      properties:
        links:
          type: array
          items:
            $ref: '#/components/schemas/link'
          nullable: true
        data:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ipAccessList'
        errors:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/error'
      required:
        - links
        - data
        - errors
    listIpAccessListsResponseEnvelope:
      title: List IP Access Lists Response
      type: object
      properties:
        links:
          type: array
          items:
            $ref: '#/components/schemas/link'
          nullable: true
        data:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/ipAccessList'
        errors:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/error'
        page:
          $ref: '#/components/schemas/pageMeta'
      required:
        - links
        - data
        - errors
        - page
