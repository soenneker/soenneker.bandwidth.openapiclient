tags:
  - name: Voice Applications
    description: >-
      Default-realm SIP settings (`sip:{applicationId}@{auth_realm}`) for a
      voice application. These do not apply to custom SIP domains.
  - name: SIP Domains
    description: >-
      Account-scoped custom SIP domains. Not affected by a voice application's
      default-realm SIP settings.
  - name: SIP Users
    description: >-
      Per-user digest credentials for custom SIP domains. Not used by the
      default-realm SIP identity.
  - name: IP Access Lists
    description: >-
      Reusable CIDR allowlists for custom SIP domains. Not used by the
      default-realm SIP identity.
