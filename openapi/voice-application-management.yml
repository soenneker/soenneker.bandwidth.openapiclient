              $ref: '#/components/examples/openIpAccessListResponseExample'
    getIpAccessListResponse:
      description: OK
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ipAccessListResponseEnvelope'
          examples:
            ipAccessList:
              $ref: '#/components/examples/ipAccessListResponseExample'
    listIpAccessListsResponse:
      description: OK
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/listIpAccessListsResponseEnvelope'
          examples:
            listIpAccessLists:
              $ref: '#/components/examples/listIpAccessListsExample'
    updateIpAccessListResponse:
      description: OK
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ipAccessListResponseEnvelope'
          examples:
            ipAccessList:
              $ref: '#/components/examples/ipAccessListResponseExample'
  schemas:
    link:
      title: Link
      type: object
      properties:
        href:
          type: string
          description: URI of the link.
          example: https://api.bandwidth.com/absolute/uri
        rel:
          type: string
          description: Specifies the relationship between this link and the resource.
          example: aRelatedResource
        method:
          type: string
          description: HTTP method to be used.
          example: GET
    errorSource:
      title: Error Source
      type: object
      properties:
        parameter:
          type: string
          description: A string indicating which URI query parameter caused the error.
          example: someParameter
        field:
          type: string
          description: A string indicating which request body field caused the error.
          example: someField
        header:
          type: string
          description: A string indicating which header field caused the error.
          example: someHeader
        reference:
          type: string
          description: >-
            A string that references a resource ID or path to the resource (or
            non-existent resource) causing the error.
          example: /some/reference
    errorMeta:
      title: Error Meta
      type: object
      properties:
        message:
          type: string
          example: An optional metadata field
    error:
      title: Error
      type: object
      properties:
        id:
          type: string
          description: A unique identifier for this particular instance of this problem.
          example: optional-error-id
        type:
          type: string
          description: >-
            A short, human-readable summary of the problem that SHOULD NOT
            change from occurrence to occurrence of the problem.
          example: REQUEST_ERROR
        description:
          type: string
          description: >-
            A human-readable explanation that SHOULD be specific to this
            occurrence of the problem.
          example: There was an issue with a field in your request body
        code:
          type: integer
          format: int32
          description: >-
            An application-specific error code for services with extensive error
            scenarios to supplement `description`.
          minimum: 4
          example: 51130
        source:
          $ref: '#/components/schemas/errorSource'
        meta:
          $ref: '#/components/schemas/errorMeta'
      required:
        - type
        - description
    genericError:
      title: Generic Error
      type: object
      properties:
        links:
          type: array
          items:
            $ref: '#/components/schemas/link'
          example: []
        data:
          type: object
          nullable: true
          example: null
        errors:
          type: array
          items:
            $ref: '#/components/schemas/error'
      required:
        - links
        - data
        - errors
    sipUri:
      title: SIP URI
      type: string
      nullable: true
      description: >-
        The application's default-realm SIP URI
        (`sip:{applicationId}@{auth_realm}`). `null` when inbound SIP calls are
        disabled. Custom SIP domain hosts are listed in each SIP domain's
        `fqdns`.
      example: >-
        sip:479fbd44-3362-45f3-bb80-284f21111be4@sip.programmable-voice.bandwidth.com
    inboundSipCallsEnabled:
      title: Inbound SIP Calls Enabled
      type: boolean
      description: >-
        Whether the application accepts inbound SIP calls on its default-realm
        SIP identity (`sip:{applicationId}@{auth_realm}`). Does not affect calls
        to custom SIP domains bound to the application.
      example: true
    passwordAuthEnabled:
      title: Password Auth Enabled
      type: boolean
      description: >-
        Whether SIP digest authentication (407 challenge) is required for
        inbound SIP calls on the application's default-realm SIP identity.
        Custom SIP domains authenticate with per-user credentials from SIP Users
        instead.
      example: true
    allowedSourceIps:
      title: Allowed Source IPs
      type: array
      description: >-
        IPv4 CIDR blocks allowed to send SIP traffic to the application's
        default-realm SIP identity. An empty array means no IP restriction is
        applied. Maximum 25 entries. Custom SIP domains use IP access lists
        instead.
      items:
        $ref: '#/components/schemas/ipv4Cidr'
      maxItems: 25
      default: []
      example:
        - 203.0.113.0/24
        - 198.51.100.0/32
    region:
      title: Region
      type: string
      description: A supported region for SIP authentication.
      enum:
        - US
        - EU
      example: US
    allowedRegions:
      title: Allowed Regions
      type: array
      nullable: true
      description: >-
        The regions where calls to the application's default-realm SIP identity
        are permitted to authenticate. An application with no allowed regions
        cannot authenticate. Custom SIP domains use each SIP user's
        `allowedRegions` instead.
      items:
        $ref: '#/components/schemas/region'
      example:
        - US
        - EU
    callbackCreds:
      title: Callback Credentials
      type: object
      nullable: true
      properties:
        userId:
          type: string
          description: The user ID for callback authentication.
          example: myApiUser
    voiceApplicationData:
      title: Voice Application Data
      type: object
      properties:
        applicationId:
          type: string
          nullable: true
          description: The unique ID of the application.
          example: 15f99d57-f823-4718-80cc-5d95d5b83e59
        serviceType:
          type: string
          nullable: true
          description: The service type of the application.
          example: Voice-V2
        applicationName:
          type: string
          nullable: true
          description: The name of the application.
          example: My Voice App
        callInitiatedCallbackUrl:
          type: string
          nullable: true
          description: The URL to receive call initiated callbacks.
          example: https://example.com/callbacks/inbound
        callInitiatedMethod:
          type: string
          nullable: true
          description: The HTTP method used for call initiated callbacks.
          example: POST
        callStatusCallbackUrl:
          type: string
          nullable: true
          description: The URL to receive call status callbacks.
          example: https://example.com/callbacks/status
        callStatusMethod:
          type: string
          nullable: true
          description: The HTTP method used for call status callbacks.
          example: POST
        callbackCreds:
          $ref: '#/components/schemas/callbackCreds'
        callInitiatedFallbackUrl:
          type: string
          nullable: true
          description: The fallback URL to receive call initiated callbacks.
          example: https://fallback.example.com/callbacks/inbound
        callInitiatedFallbackMethod:
          type: string
          nullable: true
          description: The HTTP method used for the call initiated fallback callback.
          example: POST
        callInitiatedFallbackCreds:
          $ref: '#/components/schemas/callbackCreds'
        callbackTimeout:
          type: integer
          nullable: true
          description: The timeout in seconds for callbacks.
          example: 30
        sipUri:
          $ref: '#/components/schemas/sipUri'
        inboundSipCallsEnabled:
          $ref: '#/components/schemas/inboundSipCallsEnabled'
        passwordAuthEnabled:
          $ref: '#/components/schemas/passwordAuthEnabled'
        allowedSourceIps:
          $ref: '#/components/schemas/allowedSourceIps'
        allowedRegions:
          $ref: '#/components/schemas/allowedRegions'
      nullable: true
    updateVoiceApplicationRequest:
      title: Update Voice Application Request
      description: >-
        At least one field must be provided. When `inboundSipCallsEnabled` is
        `true`, at least one auth mechanism must be active:
        `passwordAuthEnabled: true` OR a non-empty `allowedSourceIps` array.


        A `null` value is treated the same as omitting the field; it does not
        clear the setting. To clear `allowedSourceIps` or `allowedRegions`, send
        an empty array.
      type: object
      properties:
        inboundSipCallsEnabled:
          $ref: '#/components/schemas/inboundSipCallsEnabled'
        passwordAuthEnabled:
          $ref: '#/components/schemas/passwordAuthEnabled'
        allowedSourceIps:
          $ref: '#/components/schemas/allowedSourceIps'
        allowedRegions:
          $ref: '#/components/schemas/allowedRegions'
    getVoiceApplicationResponse:
      title: Get Voice Application Response
      type: object
      properties:
        links:
          type: array
          items:
            $ref: '#/components/schemas/link'
        data:
          $ref: '#/components/schemas/voiceApplicationData'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/error'
      required:
        - links
        - data
        - errors
    updateVoiceApplicationResponse:
      title: Update Voice Application Response
      type: object
      properties:
        links:
          type: array
          items:
            $ref: '#/components/schemas/link'
        data:
          allOf:
            - $ref: '#/components/schemas/voiceApplicationData'
            - type: object
              properties:
                sipAuthPassword:
                  type: string
                  nullable: true
                  description: >-
                    The newly generated password to be used for SIP digest
                    authentication. Only present when the request included
                    `passwordAuthEnabled: true`; it is not returned again.
                  example: super_secure_password
        errors:
          type: array
          items:
            $ref: '#/components/schemas/error'
          nullable: true
      required:
        - links
        - data
        - errors
    sipDomainLabel:
      title: SIP Domain Label
      type: string
      description: >-
        The customer-chosen DNS label that identifies the SIP domain on this
        account. 1-63 alphanumeric or hyphen characters, no leading or trailing
        hyphen. Case-insensitive; stored and returned in lowercase.


        Region codes (`us`, `eu`) are reserved and rejected as a domain label,
        since they are used as the region prefix in `fqdns`. `null` is also
        reserved, since it is the list filters' value for an unassigned domain.
      pattern: ^[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?$
      minLength: 1
      maxLength: 63
      example: mycompany
    sipDomainName:
      title: SIP Domain Name
      type: string
      description: A customer-chosen friendly name for the SIP domain.
      minLength: 1
      maxLength: 255
      example: Acme Support Domain
    sipDomainStatus:
      title: SIP Domain Status
      type: string
      description: >-
        The provisioning status of the SIP domain's DNS records. `PENDING`
        immediately after create, or after a `regions` update that changes the
        region set, while provisioning runs asynchronously; `ACTIVE` once
        provisioning completes; `FAILED` if provisioning could not complete (see
        `failureReason`). A domain still `PENDING` after 10 minutes is reported
        as `FAILED`. Inbound calls are only accepted on an `ACTIVE` domain.
      enum:
        - PENDING
        - ACTIVE
        - FAILED
      example: ACTIVE
    ipAccessListIds:
      title: IP Access List IDs
      type: array
      description: >-
        IDs of account-scoped IP access lists attached to the domain (max 25).
        Inbound SIP traffic to the domain is allowed from the union of the
        lists' CIDRs, which may contain at most 50 unique CIDRs. Unknown IDs
        return `404`.
      items:
        type: string
        format: uuid
      maxItems: 25
      default: []
      example:
        - 6d8e9b22-4c2c-4a37-8f54-1be0eaf6b3e2
    sipDomainRegions:
      title: SIP Domain Regions
      type: array
      description: >-
        The regions this domain provisions DNS records for and accepts calls in.
        Drives the region-pinned entries in `fqdns`.


        **At least one region is required for the domain to accept calls.** If
        `regions` is omitted or empty, every inbound call to the domain is
        rejected, even though the domain is created and becomes `ACTIVE`.


        A call to `<userId>@<fqdn>` must also be in one of that SIP user's
        `allowedRegions`.
      items:
        $ref: '#/components/schemas/region'
      default: []
      example:
        - US
        - EU
    sipUserId:
      title: SIP User ID
      type: string
      description: >-
        The customer-chosen SIP user identifier. 1-64 letters, numbers, `.`,
        `_`, or `-`. Case-sensitive. Immutable after creation.
      pattern: ^[A-Za-z0-9._-]{1,64}$
      minLength: 1
      maxLength: 64
      example: alice
    sipUserName:
      title: SIP User Friendly Name
      type: string
      description: >-
        A customer-chosen friendly name for the SIP user, distinct from the
        immutable `userId`.
      minLength: 1
      maxLength: 255
      example: Alice Support Line
    sipPassword:
      title: SIP Digest Password
      type: string
      writeOnly: true
      description: >-
        The customer-supplied plaintext digest password. Must be 8-128 printable
        ASCII characters and include at least one uppercase letter, one
        lowercase letter, one number, and one special character. Required on
        create; supply again on `PATCH` to rotate it. Bandwidth never stores or
        returns the plaintext — it is not recoverable, and this field never
        appears in a response.
      pattern: ^(?=.*[A-Z])(?=.*[a-z])(?=.*[0-9])(?=.*[!-/:-@\[-`{-~])[ -~]{8,128}$
      minLength: 8
      maxLength: 128
      example: s0meRand0mP4ssw0rd!
    sipUserAllowedRegions:
      title: SIP User Allowed Regions
      type: array
      description: >-
        The list of regions where this user is permitted to authenticate. A user
        with no allowed regions cannot authenticate.
      items:
        $ref: '#/components/schemas/region'
      default: []
      example:
        - US
    createdAt:
      title: Created At
      type: string
      format: date-time
      description: >-
        RFC 3339 timestamp (UTC) of when the resource was created. Preserved
        across updates.
      example: '2026-04-29T12:34:56.789012+00:00'
    sipDomain:
      title: SIP Domain
      type: object
      properties:
        domain:
          $ref: '#/components/schemas/sipDomainLabel'
        name:
          $ref: '#/components/schemas/sipDomainName'
        applicationId:
          type: string
          nullable: true
          description: >-
            The unique ID of the voice application this domain is bound to, or
            `null` if unbound. A domain with no `applicationId` cannot accept
            inbound calls until bound; you may set this later via `PATCH`.
          example: 15f99d57-f823-4718-80cc-5d95d5b83e59
        regions:
          $ref: '#/components/schemas/sipDomainRegions'
        ipAccessListIds:
          $ref: '#/components/schemas/ipAccessListIds'
        fqdns:
          type: array
          readOnly: true
          description: >-
            **Read-only / derived.** The full SIP host(s) that inbound calls to
            this domain are reachable on — one global entry
            (`{domain}.{accountId}.{suffix}`), plus one region-pinned entry
            (`{region}.{domain}.{accountId}.{suffix}`) for each region in
            `regions`. These are the values to configure as the destination in
            your SBC or PBX. Customers with data-residency requirements should
            use the region-pinned host rather than the global one, since the
            global host may route to any of the domain's configured regions.
          items:
            type: string
          example:
            - mycompany.9900000.sip-uri.voice-api.bandwidth.com
            - us.mycompany.9900000.sip-uri.voice-api.bandwidth.com
            - eu.mycompany.9900000.sip-uri.voice-api.bandwidth.com
        status:
          allOf:
            - $ref: '#/components/schemas/sipDomainStatus'
          readOnly: true
        failureReason:
          type: string
          nullable: true
          readOnly: true
          description: >-
            Why provisioning failed when `status` is `FAILED` (`Domain
            provisioning failed` or `Provisioning timed out`); `null` otherwise.
          example: Provisioning timed out
        userIds:
          type: array
          readOnly: true
          description: >-
            **Read-only / derived.** The SIP user IDs currently assigned to this
            domain (i.e. the users whose `domain` field equals this domain).
            Inbound SIP calls to `<userId>@<fqdn>` authenticate against the
            named user's credentials. Always empty in the response to the create
            request. To assign or unassign a user, `PATCH /sip-users/{userId}`
            with the new `domain` value (or an empty string, `""`, to unassign).
          items:
            $ref: '#/components/schemas/sipUserId'
          maxItems: 5000
          example:
            - alice
            - support
        createdAt:
          $ref: '#/components/schemas/createdAt'
      required:
        - domain
        - name
        - applicationId
        - regions
        - ipAccessListIds
        - fqdns
        - status
        - failureReason
        - userIds
        - createdAt
    sipUser:
      title: SIP User
      type: object
      properties:
        userId:
          $ref: '#/components/schemas/sipUserId'
        name:
          $ref: '#/components/schemas/sipUserName'
        domain:
          type: string
          nullable: true
          description: >-
            The label of the SIP domain this user is currently assigned to, or
            `null` if unassigned. A SIP user can be assigned to **at most one**
            SIP domain at a time. Inbound SIP calls to `<userId>@<this domain's
            fqdn>` authenticate against this user's credentials; calls to the
            user on any other domain are rejected.
          example: mycompany
        allowedRegions:
          $ref: '#/components/schemas/sipUserAllowedRegions'
        createdAt:
          $ref: '#/components/schemas/createdAt'
      required:
        - userId
        - name
        - domain
        - allowedRegions
        - createdAt
    createSipDomainRequest:
      title: Create SIP Domain Request
      type: object
      description: >-
        `domain` and `name` are required. The domain is created with no users
        assigned; assign users by `PATCH /sip-users/{userId}` with this domain's
        label.
      properties:
        domain:
          $ref: '#/components/schemas/sipDomainLabel'
        name:
          $ref: '#/components/schemas/sipDomainName'
        applicationId:
          type: string
          nullable: true
          description: >-
            Optional voice application to bind this domain to at creation time.
            Omit or send `null` to create the domain unbound; bind it later via
            `PATCH`.
          example: 15f99d57-f823-4718-80cc-5d95d5b83e59
        regions:
          $ref: '#/components/schemas/sipDomainRegions'
        ipAccessListIds:
          $ref: '#/components/schemas/ipAccessListIds'
      required:
        - domain
        - name
    updateSipDomainRequest:
      title: Update SIP Domain Request
      type: object
      description: >-
        At least one field must be supplied. `domain` (the label) is immutable
        and ignored if supplied; to change it, delete this domain and create a
        new one.


        A `null` value for any field is treated the same as omitting it; it
        never clears a setting. To unbind `applicationId`, send an empty string.
        To clear `regions` or `ipAccessListIds`, send an empty array.
      properties:
        name:
          type: string
          nullable: true
          allOf:
            - $ref: '#/components/schemas/sipDomainName'
          description: Replaces the friendly name for this domain.
        applicationId:
          type: string
          nullable: true
          description: >-
            Binds or rebinds the domain to the named voice application, or an
            empty string (`""`) to unbind. `null` leaves the binding unchanged.
          example: 15f99d57-f823-4718-80cc-5d95d5b83e59
        regions:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/region'
          description: >-
            Replaces the domain's region set; send an empty array to clear it.
            `null` leaves it unchanged. If the set changes, DNS records are
            reprovisioned and `status` returns to `PENDING`.
        ipAccessListIds:
          type: array
          nullable: true
          items:
            type: string
            format: uuid
          maxItems: 25
          description: >-
            Replaces the domain's attached IP access lists; send an empty array
            to detach all. `null` leaves them unchanged. Unknown IDs return
            `404`.
    createSipUserRequest:
      title: Create SIP User Request
      type: object
      description: >-
        `userId`, `name`, and `password` are required. Optionally supply
        `domain` to assign the user to a SIP domain at creation time; omit (or
        send `null`) to leave the user unassigned. The user can be reassigned
        later via `PATCH /sip-users/{userId}`.
      properties:
        userId:
          $ref: '#/components/schemas/sipUserId'
        name:
          $ref: '#/components/schemas/sipUserName'
        password:
          $ref: '#/components/schemas/sipPassword'
        domain:
          type: string
          nullable: true
          description: >-
            Optional SIP domain label to assign this user to at creation time.
            Must reference an existing SIP domain on this account; unknown
            domains return `404`. Omit or send `null` to create the user without
            a domain assignment.
          example: mycompany
        allowedRegions:
          $ref: '#/components/schemas/sipUserAllowedRegions'
      required:
        - userId
        - name
        - password
    updateSipUserRequest:
      title: Update SIP User Request
      type: object
      description: >-
        At least one field must be supplied. `userId` is immutable and ignored
        if supplied; to change it, delete the user and recreate.


        Supplying `domain` reassigns the user to the named SIP domain,
        overwriting any prior assignment. Supply an empty string (`""`) to
        unassign the user from any domain. Supplying `password` rotates the
        digest credential; the plaintext is never echoed back.


        A `null` value for any field is treated the same as omitting it; it
        never clears a setting. To clear `allowedRegions`, send an empty array.
      properties:
        name:
          type: string
          nullable: true
          allOf:
            - $ref: '#/components/schemas/sipUserName'
          description: Replaces the friendly name for this user.
        domain:
          type: string
          nullable: true
          description: >-
            Reassign this user to the named SIP domain (must exist on this
            account), or an empty string (`""`) to unassign. `null` leaves the
            assignment unchanged. A user can be assigned to at most one domain
            at a time; the prior assignment is overwritten atomically.
          example: mycompany
        password:
          type: string
          nullable: true
          allOf:
            - $ref: '#/components/schemas/sipPassword'
          description: Rotates the user's digest password. `null` leaves it unchanged.
        allowedRegions:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/region'
          description: >-
            Replaces the user's `allowedRegions`; send an empty array to clear
            it. `null` leaves it unchanged.
    pageMeta:
      title: Page Metadata
      type: object
      description: Pagination metadata for a list response.
      properties:
        pageSize:
          type: integer
          description: The number of resources on the current page.
          example: 2
      required:
        - pageSize
    sipDomainApplicationIdFilterQueryParameter:
      title: SIP Domain Application ID Filter Query Parameter
      type: object
      properties:
        eq:
          type: string
          description: >-
            Returns only SIP domains bound to one of these voice application IDs
            (exact, case-sensitive match). Supply a comma-separated list to
            match any of the values (OR); entries are trimmed, empty entries and
            duplicates are ignored, and at most 100 values are allowed. An empty
            value or more than 100 values returns `400`. Include the literal
            lowercase `null` to also match unbound domains.
          example: 15f99d57-f823-4718-80cc-5d95d5b83e59,null
      example:
        eq: 15f99d57-f823-4718-80cc-5d95d5b83e59
    sipDomainStatusFilterQueryParameter:
      title: SIP Domain Status Filter Query Parameter
      type: object
      properties:
        eq:
          type: string
          description: >-
            Returns only SIP domains with one of these `status` values:
            `PENDING`, `ACTIVE`, or `FAILED` (uppercase). Supply a
            comma-separated list to match any of the values (OR); entries are
            trimmed, empty entries and duplicates are ignored, and at most 100
            values are allowed. An empty value or more than 100 values returns
            `400`. Any other value in the list returns `400`.
          example: PENDING,FAILED
      example:
        eq: PENDING,FAILED
    sipUserDomainFilterQueryParameter:
      title: SIP User Domain Filter Query Parameter
      type: object
      properties:
        eq:
          type: string
          description: >-
            Returns only SIP users assigned to one of these SIP domain labels
            (case-insensitive). Supply a comma-separated list to match any of
            the values (OR); entries are trimmed, empty entries and duplicates
            are ignored, and at most 100 values are allowed. An empty value or
            more than 100 values returns `400`. Include the literal lowercase
            `null` to also match unassigned users.
          example: mycompany,sales
      example:
        eq: mycompany
    ipAccessListNameFilterQueryParameter:
      title: IP Access List Name Filter Query Parameter
      type: object
      properties:
        eq:
          type: string
          description: >-
            Returns only IP access lists with exactly this name
            (case-sensitive). Only a single value is supported, since names may
            contain commas.
          example: Office NAT
      example:
        eq: Office NAT
    sipDomainResponseEnvelope:
      title: SIP Domain Response
      type: object
      properties:
        links:
          type: array
          items:
