          description: The current processing status of the port-out order.
          enum:
            - NEW
            - SUPP
            - MODIFY
            - FOC
            - SOA_PENDING
            - SOA_CONFLICT
            - VALIDATION_FAILED_NEW
            - VALIDATION_FAILED_SUPP
            - VALIDATION_FAILED_MODIFY
            - EXCEPTION
            - COMPLETE
            - CANCELLED
          example: NEW
        requestedFocDate:
          type: string
          format: date-time
          description: >-
            The FOC (Firm Order Commitment) Date requested for the port-out
            order.
          example: '2014-08-02T12:34:37.000Z'
        errorCode:
          type: integer
          description: Code describing the processing result or error.
          example: 201
        errorMessage:
          type: string
          description: Message describing the processing result or error.
          example: >-
            Order request received. Please use the order id to check the status
            of your order later.
        phoneNumber:
          type: string
          description: The full telephone number being ported out in E.164 format.
          example: '+442079315000'
        vendorId:
          type: string
          description: The vendor ID associated with the port-out order.
          example: 512E
        vendorName:
          type: string
          description: The vendor name associated with the port-out order.
          example: Vendor Name
        pon:
          type: string
          description: >-
            A PON (Port Order Number) is a system-generated order number
            assigned to port orders.
          example: 979E02421101708A
        countryCodeA3:
          type: string
          description: The country to which the telephone number belongs.
          example: GBR
