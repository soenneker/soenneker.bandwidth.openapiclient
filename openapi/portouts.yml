openapi: 3.0.1
info:
  title: Port-Outs
  description: >-
    Bandwidth's Port-Outs API


    This API provides endpoints to manage port-out orders, including retrieving
    port-out orders by order ID and by date range for a given account, and
    creating, retrieving, and updating LSR (Local Service Request) orders for
    telephone numbers being ported out of the Bandwidth network.
  contact:
    name: Bandwidth
    url: https://dev.bandwidth.com/apis/numbers-apis/porting/portouts/
    email: support@bandwidth.com
  version: 2.0.0
  termsOfService: https://www.bandwidth.com/legal/terms-of-service/
servers:
  - url: https://api.bandwidth.com/api/v2
    description: Production
tags:
  - name: Port-Outs
    description: Endpoints for managing port-out orders.
  - name: LSR Orders
    description: Manage Local Service Request (LSR) orders for port-out actions.
security:
  - Basic: []
  - Bearer: []
paths:
  /accounts/{accountId}/portouts:
    get:
      description: >-
        Retrieves a list of port-out requests for the given account ID. A
        maximum of 1,000 orders can be retrieved per request. If no date range
        or specific query parameter (marked by <b class="required">*</b> below)
        is provided, the order results will be limited to the last two years.
      operationId: listPortOuts
      parameters:
        - $ref: '#/components/parameters/accountIdPathParam'
        - $ref: '#/components/parameters/listPortOutsPageQueryParam'
        - $ref: '#/components/parameters/listPortOutsSizeQueryParam'
        - $ref: '#/components/parameters/statusQueryParam'
        - $ref: '#/components/parameters/dateQueryParam'
        - $ref: '#/components/parameters/startdateQueryParam'
        - $ref: '#/components/parameters/enddateQueryParam'
        - $ref: '#/components/parameters/countryCodeA3QueryParam'
      responses:
        '200':
          $ref: '#/components/responses/listPortOutsResponse200'
        '400':
          $ref: '#/components/responses/listPortOutsResponse400'
        '401':
          $ref: '#/components/responses/listPortOutsResponse401'
        '403':
          $ref: '#/components/responses/listPortOutsResponse403'
        '404':
          $ref: '#/components/responses/listPortOutsResponse404'
        '429':
          $ref: '#/components/responses/listPortOutsResponse429'
        '500':
          $ref: '#/components/responses/listPortOutsResponse500'
      summary: List port-out requests
      tags:
        - Port-Outs
  /accounts/{accountId}/portouts/status:
    get:
      tags:
        - Port-Outs
      summary: Get Port Out Range
      description: >-
        List port-out orders which were last modified in the specified date
        range.
      operationId: getAllPortOutsByAccountIdAndRange
      parameters:
        - $ref: '#/components/parameters/accountIdPathParam'
        - $ref: '#/components/parameters/startdateQueryParam'
        - $ref: '#/components/parameters/enddateQueryParam'
        - $ref: '#/components/parameters/pageQueryParam'
        - $ref: '#/components/parameters/sizeQueryParam'
      responses:
        '200':
          $ref: '#/components/responses/portoutsStatusResponse200'
        '400':
          $ref: '#/components/responses/errorResponse400'
        '401':
          $ref: '#/components/responses/errorResponse401'
        '403':
          $ref: '#/components/responses/errorResponse403'
        '404':
          $ref: '#/components/responses/errorResponse404'
        '405':
          $ref: '#/components/responses/errorResponse405'
        '429':
          $ref: '#/components/responses/errorResponse429'
        5XX:
          $ref: '#/components/responses/errorResponse500'
  /accounts/{accountId}/portouts/{orderId}:
    get:
      tags:
        - Port-Outs
      operationId: getPortOut
      summary: Fetching port-out order status
      description: >-
        Retrieves the information associated with the specified port-out order
        ID.
      parameters:
        - $ref: '#/components/parameters/accountIdPathParam'
        - $ref: '#/components/parameters/orderIdPathParam'
      responses:
        '200':
          $ref: '#/components/responses/portOutGetResponse200'
        '400':
          $ref: '#/components/responses/errorResponse400'
        '401':
          $ref: '#/components/responses/errorResponse401'
        '403':
          $ref: '#/components/responses/errorResponse403'
        '404':
          $ref: '#/components/responses/errorResponse404'
        '429':
          $ref: '#/components/responses/errorResponse429'
        '500':
          $ref: '#/components/responses/errorResponse500'
  /accounts/{accountId}/lsrorders:
    post:
      tags:
        - LSR Orders
      operationId: createLsrOrder
      summary: Create LSR order
      description: >-
        Creates an LSR order to initiate a port-out of telephone numbers from
        the Bandwidth network.
      parameters:
        - $ref: '#/components/parameters/accountIdPathParam'
      requestBody:
        $ref: '#/components/requestBodies/createLsrOrderRequest'
      responses:
        '201':
          $ref: '#/components/responses/lsrOrderCreatedResponse'
        '400':
          $ref: '#/components/responses/lsrOrderBadRequestResponse'
        '401':
          $ref: '#/components/responses/errorResponse401'
        '403':
          $ref: '#/components/responses/errorResponse403'
        '404':
          $ref: '#/components/responses/lsrOrderNotFoundResponse'
        '429':
          $ref: '#/components/responses/errorResponse429'
        5XX:
          $ref: '#/components/responses/errorResponse500'
  /accounts/{accountId}/lsrorders/{orderId}:
    get:
      tags:
        - LSR Orders
      operationId: getLsrOrder
      summary: Retrieve LSR order
      description: Retrieves the information associated with the specified LSR order.
      parameters:
        - $ref: '#/components/parameters/accountIdPathParam'
        - $ref: '#/components/parameters/lsrOrderIdPathParam'
      responses:
        '200':
          $ref: '#/components/responses/lsrOrderResponse200'
        '400':
          $ref: '#/components/responses/lsrOrderBadRequestResponse'
        '401':
          $ref: '#/components/responses/errorResponse401'
        '403':
          $ref: '#/components/responses/errorResponse403'
        '404':
          $ref: '#/components/responses/lsrOrderNotFoundResponse'
        '429':
          $ref: '#/components/responses/errorResponse429'
        5XX:
          $ref: '#/components/responses/errorResponse500'
    put:
      tags:
        - LSR Orders
      operationId: updateLsrOrder
      summary: Update LSR order
      description: >-
        Updates the information associated with the specified LSR order. To
        cancel an order, set `orderStatus` to `CANCELLED`.
      parameters:
        - $ref: '#/components/parameters/accountIdPathParam'
        - $ref: '#/components/parameters/lsrOrderIdPathParam'
      requestBody:
        $ref: '#/components/requestBodies/updateLsrOrderRequest'
      responses:
        '200':
          $ref: '#/components/responses/lsrOrderUpdateResponse200'
        '400':
          $ref: '#/components/responses/lsrOrderBadRequestResponse'
        '401':
          $ref: '#/components/responses/errorResponse401'
        '403':
          $ref: '#/components/responses/errorResponse403'
        '404':
          $ref: '#/components/responses/lsrOrderNotFoundResponse'
        '429':
          $ref: '#/components/responses/errorResponse429'
        5XX:
          $ref: '#/components/responses/errorResponse500'
