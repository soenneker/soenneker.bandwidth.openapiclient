    lsrOrderRequestJson:
      type: object
      description: LSR order request payload.
      properties:
        pon:
          type: string
          description: >-
            Customer-specified order identifier. Alphanumeric values and
            "#","-","_" allowed. Required for POST.
          maxLength: 25
        customerOrderId:
          type: string
          description: >-
            Optional customer-defined reference ID. Only alphanumeric values,
            dashes and spaces are allowed. Not unique.
          maxLength: 255
        spid:
          type: string
          description: >-
            The NPAC SPID corresponding to the carrier that the phone numbers
            are porting to. Required if account value is 'mult'.
          maxLength: 4
        billingPhoneNumber:
          type: string
          description: >-
            The billing telephone number associated with the phone numbers being
            ported. Non-toll-free.
        requestedFocDate:
          type: string
          description: >-
            The FOC date requested when creating the LSR order. Format
            yyyy-MM-dd.
        authorizingPerson:
          type: string
          description: Authorizing person. Required.
          maxLength: 100
        orderStatus:
          type: string
          description: >-
            Order status. Only CANCELLED can be set on PUT to cancel an order;
            all other fields should be left unchanged when cancelling.
        partialPort:
          type: boolean
          description: >-
            Must be set to true if not all telephone numbers associated with the
            billingPhoneNumber are being ported.
        subscriber:
          type: object
          properties:
            subscriberType:
              $ref: '#/components/schemas/lsrSubscriberType'
            businessName:
              type: string
              description: >-
                Subscriber business name for BUSINESS subscriberType. Required
                if BUSINESS.
              maxLength: 25
            firstName:
              type: string
              description: Subscriber first name for RESIDENTIAL subscriberType.
              maxLength: 25
            middleInitial:
              type: string
              description: Subscriber middle initial for RESIDENTIAL subscriberType.
              maxLength: 1
            lastName:
              type: string
              description: >-
                Subscriber last name for RESIDENTIAL subscriberType. Required if
                RESIDENTIAL.
              maxLength: 25
            accountNumber:
              type: string
              description: Account number.
              maxLength: 32
            pinNumber:
              type: string
              description: Pin number.
              maxLength: 10
            serviceAddress:
              type: object
              properties:
                housePrefix:
                  type: string
                  maxLength: 6
                houseNumber:
                  type: string
                  description: >-
                    Street address number. Mandatory when serviceAddress is
                    required.
                  maxLength: 45
                houseSuffix:
                  type: string
                  maxLength: 45
                preDirectional:
                  type: string
                  maxLength: 2
                streetName:
                  type: string
                  description: Street name. Mandatory when serviceAddress is required.
                  maxLength: 200
                streetSuffix:
                  type: string
                  maxLength: 45
                postDirectional:
                  type: string
                  maxLength: 2
                addressLine2:
                  type: string
                  maxLength: 200
                city:
                  type: string
                  description: City. Mandatory when serviceAddress is required.
                  maxLength: 100
                stateCode:
                  type: string
                  description: >-
                    2-letter state abbreviation. Mandatory when serviceAddress
                    is required.
                  maxLength: 2
                zip:
                  type: string
                  description: Zip code. Mandatory when serviceAddress is required.
                plusFour:
                  type: string
                county:
                  type: string
                  maxLength: 45
                country:
                  type: string
              required:
                - houseNumber
                - streetName
                - city
                - stateCode
                - zip
        phoneNumbers:
          type: array
          description: >-
            List of telephone numbers to port. Toll-free numbers are not
            allowed.
          items:
            type: string
      required:
        - pon
        - spid
        - subscriber
        - phoneNumbers
        - authorizingPerson
