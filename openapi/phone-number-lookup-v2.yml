    lookupAcceptedExample:
      summary: Numbers Lookup Accepted
      value:
        links:
          - href: >-
              /accounts/9912345/phoneNumberLookup/bulk/004223a0-8b17-41b1-bf81-20732adf5590
            rel: createdRequest
