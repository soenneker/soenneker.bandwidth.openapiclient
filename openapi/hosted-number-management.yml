              value:
                processingStatus: APPROVED
    postExternalTnOrderRequest:
      content:
        application/xml:
          schema:
            type: object
            xml:
              name: ExternalTnsOrder
            properties:
              CustomerOrderId:
                type: string
              SiteId:
                type: string
                description: |
                  The sub-account (site) ID. (JSON: `subAccountId`)
              SipPeerId:
                type: string
                description: |
                  The location (SIP peer) ID. (JSON: `locationId`)
              Action:
                $ref: '#/components/schemas/externalTnAction'
              LoaType:
                $ref: '#/components/schemas/loaType'
              TelephoneNumbers:
                type: object
                properties:
                  TelephoneNumber:
                    type: array
                    items:
                      type: string
          examples:
            example:
              value: |-
                <?xml version="1.0" encoding="UTF-8" standalone="yes"?>
                <ExternalTnsOrder>
                  <CustomerOrderId>ICPA123ABC</CustomerOrderId>
                  <SiteId>743</SiteId>
                  <SipPeerId>303716</SipPeerId>
                  <Action>IMPORT</Action>
                  <LoaType>CARRIER</LoaType>
                  <TelephoneNumbers>
                    <TelephoneNumber>9199918388</TelephoneNumber>
                    <TelephoneNumber>4158714245</TelephoneNumber>
                    <TelephoneNumber>4352154439</TelephoneNumber>
                    <TelephoneNumber>4352154466</TelephoneNumber>
                  </TelephoneNumbers>
                </ExternalTnsOrder>
        application/json:
          schema:
            $ref: '#/components/schemas/externalTnOrderRequest'
          examples:
            example:
              value:
                customerOrderId: ICPA123ABC
                subAccountId: '743'
                locationId: '303716'
                action: IMPORT
                loaType: CARRIER
                phoneNumbers:
                  - '+19199918388'
                  - '+14158714245'
                  - '+14352154439'
                  - '+14352154466'
