          type: string
          description: Customer-assigned reference ID for the order.
          example: ICPA123ABC
        accountId:
          type: string
          description: The account ID.
          example: '9900012'
        createdByUser:
          type: string
          description: The user who created the order.
          example: sjm
        orderCreateDate:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the order was created.
          example: '2018-01-09T02:58:04.615Z'
        lastModifiedDate:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the order was last modified.
          example: '2018-01-09T02:58:05.298Z'
        subAccountId:
          type: string
          description: The sub-account (site) ID.
          example: '65487'
        locationId:
          type: string
          description: The location (SIP peer) ID.
          example: '885544'
        action:
          description: Whether the order imports or removes telephone numbers.
          allOf:
            - $ref: '#/components/schemas/externalTnAction'
          example: IMPORT
        loaType:
          description: The type of Letter of Authorization for NANP numbers.
          allOf:
            - $ref: '#/components/schemas/loaType'
          example: SUBSCRIBER
        processingStatus:
          description: The processing status of the order.
          allOf:
            - $ref: '#/components/schemas/orderStatus'
          example: PARTIAL
        phoneNumbers:
          type: array
          items:
            type: string
          description: Phone numbers associated with the order.
          example:
            - '+12106078250'
            - '+12109678273'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/externalTnOrderError'
          description: Errors encountered during order processing.
    externalTnOrdersListResponse:
      type: object
      properties:
        totalCount:
          type: integer
          description: Total number of orders matching the query.
          example: 2
        orders:
          type: array
          items:
            $ref: '#/components/schemas/externalTnOrderItem'
    externalTnOrderRequest:
      type: object
      required:
        - subAccountId
        - action
        - phoneNumbers
      properties:
        customerOrderId:
          type: string
          description: Customer-assigned reference ID for the order.
          example: ICPA123ABC
        subAccountId:
          type: string
          description: The sub-account (site) ID.
          example: '743'
        locationId:
          type: string
          description: >-
            The location (SIP peer) ID. If not specified, the default location
            for the sub-account is used.
          example: '303716'
        action:
          description: Whether to import or remove the telephone numbers.
          allOf:
            - $ref: '#/components/schemas/externalTnAction'
          example: IMPORT
        loaType:
          description: The type of Letter of Authorization for NANP numbers.
          allOf:
            - $ref: '#/components/schemas/loaType'
          example: CARRIER
        phoneNumbers:
          type: array
          items:
            type: string
          description: The phone numbers to import or remove, in E.164 format.
          example:
            - '+19199918388'
            - '+14158714245'
            - '+14352154439'
            - '+14352154466'
    externalTnOrder400ErrorResponse:
      type: object
      properties:
        code:
          type: string
          description: Error code.
          example: '5081'
        description:
          type: string
          description: Error description.
          example: Action is absent or invalid. Possible values IMPORT, REMOVE
    externalTnOrder404ErrorResponse:
      type: object
      properties:
        code:
          type: string
          description: Error code.
          example: '404'
        description:
          type: string
          description: Error description.
          example: The resource does not exist
  parameters:
    accountIdPathParam:
      description: User's account ID.
      example: '1234567'
      in: path
      name: accountId
      required: true
      schema:
        type: string
    createdDateFromQueryParam:
      name: createdDateFrom
      description: >-
        Checks the order's creation date against this value. Orders that have a
        creation date after this date will be included. Format is yyyy-MM-dd
      in: query
      schema:
        type: string
        format: date
      example: '2013-10-22'
    createdDateToQueryParam:
      name: createdDateTo
      description: >-
        Checks the order's creation date against this value. Orders that have a
        creation date before this date will be included. Format is yyyy-MM-dd
      in: query
      schema:
        type: string
        format: date
      example: '2013-10-25'
    customerOrderIdQueryParam:
      name: customerOrderId
      description: >
        Filter orders by a customer-assigned reference ID. Because
        `customerOrderId` is not unique — Bandwidth applies no uniqueness
        constraint — this query may return multiple orders if the same value was
        used across multiple orders. Each result will have a distinct
        Bandwidth-assigned `orderId`. To retrieve a single specific order, use
        its `orderId` instead.
      in: query
      schema:
        type: string
      example: ABCCorp12345
    documentTypeQueryParam:
      name: documentType
      description: |-
        This query parameter allows you to include the document type metadata
        at the same time you upload the file.
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/documentType'
      example: LOA
    loaTypeQueryParam:
      name: loaType
      description: Indentify the LoaType on phone numbers.
      in: query
      required: false
      schema:
        type: string
        enum:
          - SUBSCRIBER
          - CARRIER
          - ALL
        default: ALL
      example: SUBSCRIBER
    metaDataQueryParam:
      name: metadata
      description: >-
        If true, the response will contain document name and type. If false, the
        response will only list the file names.
      in: query
      required: false
      schema:
        type: boolean
      example: true
    modifiedDateFromQueryParam:
      name: modifiedDateFrom
      description: >-
        For Date-based searches, the starting date of a date range (inclusive)
        that will be used to find Import Phone Number Orders that were modified
        within the date range. It is in the form yyyy-MM-dd.
      in: query
      schema:
        type: string
        format: date
      example: '2013-10-22'
    removeImportedModifiedDateFromQueryParam:
      name: modifiedDateFrom
      description: >-
        For Date-based searches, the starting date of a date range (inclusive)
        that will be used to find Remove Imported Phone Number Orders that were
        modified within the date range. It is in the form yyyy-MM-dd.
      in: query
      schema:
        type: string
        format: date
      example: '2013-10-22'
    modifiedDateToQueryParam:
      name: modifiedDateTo
      description: >-
        For Date-based searches, the ending date of a date range (inclusive)
        that will be used to find Import Phone Number Orders that were modified
        within the date range. It is in the form yyyy-MM-dd.
      in: query
      schema:
        type: string
        format: date
      example: '2013-10-25'
    orderIdPathParam:
      name: orderId
      description: ID of order to retrieve
      in: path
      required: true
      schema:
        type: string
      example: bf1305b8-8998-1111-2222-51ba3ce52d4e
    removeImportedModifiedDateToQueryParam:
      name: modifiedDateTo
      description: >-
        For Date-based searches, the ending date of a date range (inclusive)
        that will be used to find Remove Imported Phone Number Orders that were
        modified within the date range. It is in the form yyyy-MM-dd.
      in: query
      schema:
        type: string
        format: date
      example: '2013-10-25'
    phoneNumberQueryParam:
      name: phoneNumber
      description: A phone number that is referenced in the order
      in: query
      schema:
        type: string
      example: '+19199918388'
    statusQueryParam:
      name: status
      description: The status of the order being searched for.
      in: query
      required: false
      schema:
        type: array
        items:
          type: string
          enum:
            - PROCESSING
            - COMPLETE
            - PARTIAL
            - FAILED
    tnQueryParam:
      name: tn
      description: A Telephone Number (TN) that is referenced in the order
      in: query
      schema:
        type: string
      example: '+19199918388'
    accountIdQueryParam:
      name: accountID
      description: >
        This is the account that the searched-for order will be contributing to.
        Specifying this parameter will restrict the search to imported voice
        orders within the specified account.
      in: query
      schema:
        type: integer
      example: 5000125
    customReferenceQueryParamEqStartsWith:
      in: query
      name: customReference
      required: false
      style: deepObject
      explode: true
      schema:
        $ref: '#/components/schemas/queryParamStringEqStartsWith'
      examples:
        eq:
          value:
            eq: home_office
        startsWith:
          value:
            startsWith: home
      description: Customer reference. It cannot be combined with any other query filter.
    documentIdPathParam:
      in: path
      name: documentId
      required: true
      schema:
        type: string
        example: ArAnD0m1d
      description: Document Id.
    operatorCountryCodeA3QueryParam:
      in: query
      name: countryCodeA3
      required: false
      schema:
        type: object
        properties:
          eq:
            type: string
            example: FRA
      description: Country code of the address in ISO 3166-1 alpha-3 format.
    operatorSizeQueryParam:
      name: size
      description: The quantity of results displayed for each page.
      in: query
      required: false
      schema:
        type: integer
        default: 10
      example: 10
    operatorId:
      in: path
      name: operatorId
      required: true
      schema:
        type: integer
      description: Your Bandwidth Operator ID.
      example: 99006700
    orderIdFragmentQueryParam:
      name: orderIdFragment
      description: >-
        The first few characters of a Bandwidth-assigned order ID. Used to
        search for orders by partial ID.
      in: query
      required: false
      schema:
        type: string
      example: ed1c0bed-e2
    actionQueryParam:
      name: action
      description: Filter orders by action type.
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/externalTnAction'
      example: REMOVE
  requestBodies:
    postImportMessagingPhoneNumberOrdersLoasRequest:
      content:
        '*/*':
          schema:
            format: binary
            type: string
    postImportMessagingPhoneNumberOrdersRequest:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/importPhoneNumberOrdersRequest'
          examples:
            example:
              value:
                customerOrderId: ICPA123ABC
                subAccountId: 743
                locationId: 303716
                subscriber:
                  - name: ABC Inc.
                    serviceAddress:
                      - houseNumber: 11235
                        streetName: Back
                        city: Denver
                        stateCode: CO
                        zip: 27541
                        county: Canyon
                loaAuthorizingPerson: The Authguy
                loaType: CARRIER
                phoneNumbers:
                  - '+19199918388'
                  - '+14158714245'
                  - '+14352154439'
                  - '+14352154466'
        application/xml:
          schema:
            $ref: '#/components/schemas/importTnOrdersRequest'
          examples:
            example:
              value: |
                <?xml version="1.0" encoding="UTF-8" standalone="yes"?>
                <ImportTnOrder>
                  <CustomerOrderId>ICPA123ABC</CustomerOrderId>
                  <SiteId>743</SiteId>
                  <SipPeerId>303716</SipPeerId>
                  <Subscriber>
                    <Name>ABC Inc.</Name>
                    <ServiceAddress>
                      <HouseNumber>11235</HouseNumber>
                      <StreetName>Back</StreetName>
                      <City>Denver</City>
                      <StateCode>CO</StateCode>
                      <Zip>27541</Zip>
                      <County>Canyon</County>
                    </ServiceAddress>
                  </Subscriber>
                  <LoaAuthorizingPerson>The Authguy</LoaAuthorizingPerson>
                  <LoaType>CARRIER</LoaType>
                  <TelephoneNumbers>
                    <TelephoneNumber>+19199918388</TelephoneNumber>
                    <TelephoneNumber>+14158714245</TelephoneNumber>
                    <TelephoneNumber>+14352154439</TelephoneNumber>
                    <TelephoneNumber>+14352154466</TelephoneNumber>
                  </TelephoneNumbers>
                </ImportTnOrder>
    postRemoveImportedPhoneNumberOrderRequest:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/removeImportedPhoneNumberOrderRequest'
          examples:
            example:
              value:
                customerOrderId: ICPA123ABC
                phoneNumbers:
                  - '+19199918388'
                  - '+14158714245'
                  - '+14352154439'
                  - '+14352154466'
        application/xml:
          schema:
            $ref: '#/components/schemas/removeImportedTnOrderRequest'
          examples:
            example:
              value: |-
                <?xml version="1.0" encoding="UTF-8" standalone="yes"?>
                <RemoveImportedTnOrder>
                   <CustomerOrderId>ICPA123ABC</CustomerOrderId>
                   <TelephoneNumbers>
                      <TelephoneNumber>+19199918388</TelephoneNumber>
                      <TelephoneNumber>+14158714245</TelephoneNumber>
                      <TelephoneNumber>+14352154439</TelephoneNumber>
                      <TelephoneNumber>+14352154466</TelephoneNumber>
                   </TelephoneNumbers>
                </RemoveImportedTnOrder>
