components:
  securitySchemes:
    Basic:
      type: http
      scheme: basic
      description: >-
        Basic authentication is a simple authentication scheme built into the
        HTTP protocol. To use it, send your HTTP requests with an Authorization
        header that contains the word Basic followed by a space and a
        base64-encoded string `username:password`.

        Example: `Authorization: Basic dXNlcm5hbWU6cGFzc3dvcmQ=`
    Bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Bearer authentication (also called token authentication) is an HTTP
        authentication scheme that involves security 

        tokens called bearer tokens. The name “Bearer authentication” can be
        understood as “give access to the bearer

        of this token.” The client must send this token in the `Authorization`
        header when making requests to

        protected resources.


        - Example: `Authorization: Bearer <token>`


        Where `<token>` should be replaced with the token string without angle
        brackets.


        For more information, see the following guide:
        [Credentials](https://dev.bandwidth.com/docs/account/credentials/management)
  schemas:
    orderStatus:
      type: string
      description: The status of an order.
      enum:
        - RECEIVED
        - PROCESSING
        - COMPLETE
        - PARTIAL
        - FAILED
      example: COMPLETE
    importVoiceProcessingStatus:
      type: string
      description: The processing status of an import voice TN order.
      enum:
        - RECEIVED
        - PROCESSING
        - COMPLETE
        - PARTIAL
        - FAILED
        - MISSING_REQUIREMENTS
      example: PROCESSING
    importVoicePatchStatus:
      type: string
      description: The processing status to set on an import voice TN order.
      enum:
        - APPROVED
        - MISSING_REQUIREMENTS
        - SUBMITTED
      example: APPROVED
    hostedVoiceRequirement:
      type: string
      description: A missing requirement type for a hosted voice order.
      enum:
        - HOSTED_VOICE_DOCUMENTS
      example: HOSTED_VOICE_DOCUMENTS
    hostedVoiceDocumentStatus:
      type: string
      description: The status of a hosted voice document.
      enum:
        - DRAFT
        - SUBMITTED
        - PROCESSING
        - VERIFIED
        - VERIFICATION_FAILED
      example: SUBMITTED
    loaType:
      type: string
      description: The type of LOA authorization.
      enum:
        - CARRIER
        - SUBSCRIBER
      example: CARRIER
    externalTnAction:
      type: string
      description: Whether the order imports or removes telephone numbers.
      enum:
        - IMPORT
        - REMOVE
      example: IMPORT
    documentType:
      type: string
      description: The type of document.
      enum:
        - LOA
        - INVOICE
        - CSR
        - OTHER
      example: LOA
