openapi: 3.0.1
info:
  title: Hosted Number Management
  description: >-
    Bandwidth's Hosted Number Management APIs


    This API provides endpoints to manage hosted telephone numbers, either for
    voice and messaging. 


    Note that specs are still being moved over from the [Numbers
    section](https://dev.bandwidth.com/apis/numbers-apis/numbers)
  contact:
    name: Bandwidth
    url: https://support.bandwidth.com
    email: support@bandwidth.com
  version: 1.0.0
  termsOfService: https://www.bandwidth.com/legal/terms-of-use-bandwidthcom-web-sites/
servers:
  - url: https://api.bandwidth.com/api/v2
    description: Production
security:
  - Basic: []
  - Bearer: []
tags:
  - name: Hosted Messaging
  - name: Import TN Checker
  - name: Operator Information
  - name: Hosted Voice
  - name: External TN Orders
paths:
  /accounts/{accountId}/importPhoneNumberOrders/messaging:
    get:
      tags:
        - Hosted Messaging
      description: >
        Retrieves the importPhoneNumberOrders requests for the given account ID.
        A maximum of 1,000 orders can be retrieved per request. If no date range
        or required query parameter is provided, the order results will be
        limited to the last two years.


        In this table are presented capabilities that are not universally
        available. The following request query parameters are only allowed for
        numbers from specific region/country:

        | Number Region | Request Query Parameter |

        |:--------------|:------------------------|

        |NANP|loaType|
      summary: List Hosted Messaging Orders
      operationId: readImportMessagingPhoneNumberOrders
      parameters:
        - $ref: '#/components/parameters/accountIdPathParam'
        - $ref: '#/components/parameters/statusQueryParam'
        - $ref: '#/components/parameters/phoneNumberQueryParam'
        - $ref: '#/components/parameters/customerOrderIdQueryParam'
        - $ref: '#/components/parameters/createdDateFromQueryParam'
        - $ref: '#/components/parameters/createdDateToQueryParam'
        - $ref: '#/components/parameters/modifiedDateFromQueryParam'
        - $ref: '#/components/parameters/modifiedDateToQueryParam'
        - $ref: '#/components/parameters/loaTypeQueryParam'
      responses:
        '200':
          $ref: '#/components/responses/getImportMessagingPhoneNumberOrdersResponse'
        '400':
          $ref: >-
            #/components/responses/getImportMessagingPhoneNumberOrders400ErrorResponse
    post:
      tags:
        - Hosted Messaging
      description: >-
        Creates an importPhoneNumberOrder request to add numbers under the given
        sub account ID and location ID as specified in the body.

        A successfully submitted order will have a status of "RECEIVED". A
        successfully completed order will have a status of "COMPLETE" if all of
        the telephone numbers were successfully imported and  "PARTIAL" if some
        of the telephone numbers were imported. A failed order with will have a
        staus of "FAILED" and no telephone numbers would have been imported.


        The following request parameters are only required for numbers from
        specific region/country:

        | Number Region | Request Parameter |

        |:--------------|:------------------------|

        |NANP|LoaAuthorizingPerson|

        |NANP|LoaType|

        |NANP|Subscriber|
      summary: Create Hosted Messaging Order
      operationId: createImportMessagingPhoneNumberOrder
      parameters:
        - $ref: '#/components/parameters/accountIdPathParam'
      requestBody:
        $ref: '#/components/requestBodies/postImportMessagingPhoneNumberOrdersRequest'
      responses:
        '201':
          $ref: '#/components/responses/postImportMessagingPhoneNumberOrdersResponse'
        '400':
          $ref: >-
            #/components/responses/postImportMessagingPhoneNumberOrders400ErrorResponse
  /accounts/{accountId}/importPhoneNumberOrders/messaging/{orderId}:
    get:
      tags:
        - Hosted Messaging
      description: >-
        Retrieve an order to import hosted messaging to a phone number by order
        ID
      summary: Get Hosted Messaging Order
      operationId: retrieveImportMessagingPhoneNumberOrder
      parameters:
        - $ref: '#/components/parameters/accountIdPathParam'
        - $ref: '#/components/parameters/orderIdPathParam'
      responses:
        '200':
          $ref: '#/components/responses/getImportMessagingPhoneNumberOrderResponse'
        '400':
          $ref: >-
            #/components/responses/getImportMessagingPhoneNumber400ErrorOrderResponse
  /accounts/{accountId}/importPhoneNumberOrders/messaging/{orderId}/history:
    get:
      tags:
        - Hosted Messaging
      description: Retrieves the history of the specified importPhoneNumberOrder.
      summary: Get Hosted Messaging Order History
      operationId: readImportMessagingPhoneNumberOrderHistory
      parameters:
        - $ref: '#/components/parameters/accountIdPathParam'
        - $ref: '#/components/parameters/orderIdPathParam'
      responses:
        '200':
          $ref: >-
            #/components/responses/getImportMessagingPhoneNumberOrdersHistoryResponse
  /accounts/{accountId}/importPhoneNumberOrders/messaging/{orderId}/loas:
    get:
      description: >-
        Retrieves the list of the LOA files associated with the order. Only for
        orders involving NANP numbers.
      operationId: listImportMessagingPhoneNumberOrderLoas
      parameters:
        - $ref: '#/components/parameters/accountIdPathParam'
        - $ref: '#/components/parameters/orderIdPathParam'
        - $ref: '#/components/parameters/metaDataQueryParam'
      responses:
        '200':
          $ref: >-
            #/components/responses/getImportMessagingPhoneNumberOrdersLoasResponse
        '400':
          $ref: >-
            #/components/responses/getImportMessagingPhoneNumberOrdersLoas400ErrorResponse
      summary: List Hosted Messaging Order LOA files
      tags:
        - Hosted Messaging
    post:
      description: >-
        POSTing to the /loas resource will enable the upload of the file.  The
        key attribute to the POST is ensuring that the headers are correctly set
        to support the file upload.<br>

        Query parameter or header documentType can be used to specify type of
        document on upload.

        <p>When uploading documents using the /loas resource, you must specify
        the MIME type of the document being upload using the Content-Type HTTP
        header.</p>

        <p>The LOA document must be uploaded using one of the following MIME
        types:</p>

        <ul>

        <li>application/pdf</li>

        <li>text/plain</li>

        <li>image/jpeg</li>

        <li>image/png</li>

        <li>image/tiff</li>

        <li>text/csv</li>

        <li>application/vnd.ms-excel</li>

        <li>application/vnd.openxmlformats-officedocument.spreadsheetml.sheet</li>

        <li>application/msword</li>

        <li>application/vnd.openxmlformats-officedocument.wordprocessingml.document</li>

        </ul>
      operationId: createImportMessagingPhoneNumberOrderLoas
      parameters:
        - $ref: '#/components/parameters/accountIdPathParam'
        - $ref: '#/components/parameters/orderIdPathParam'
        - $ref: '#/components/parameters/documentTypeQueryParam'
      requestBody:
        $ref: >-
          #/components/requestBodies/postImportMessagingPhoneNumberOrdersLoasRequest
      responses:
        '201':
          $ref: >-
            #/components/responses/postImportMessagingPhoneNumberOrdersLoasResponse
      summary: Upload LOA File for Import Phone Number Order [NANP]
      tags:
        - Hosted Messaging
  /accounts/{accountId}/removeImportedPhoneNumberOrders/messaging:
    get:
      tags:
        - Hosted Messaging
      description: >-
        Retrieves the Remove Imported Messaging Tn Orders requests for the given
        account ID.

        A maximum of 1,000 orders can be retrieved per request. If no date range
        or specific query parameter as required is provided, the order results
        will be limited to the last two years.
      summary: List Orders for Removing Hosted Messaging
      operationId: listRemoveImportedTnOrders
      parameters:
        - $ref: '#/components/parameters/accountIdPathParam'
        - $ref: '#/components/parameters/statusQueryParam'
        - $ref: '#/components/parameters/phoneNumberQueryParam'
        - $ref: '#/components/parameters/customerOrderIdQueryParam'
        - $ref: '#/components/parameters/createdDateFromQueryParam'
        - $ref: '#/components/parameters/createdDateToQueryParam'
        - $ref: '#/components/parameters/removeImportedModifiedDateFromQueryParam'
        - $ref: '#/components/parameters/removeImportedModifiedDateToQueryParam'
      responses:
        '200':
          $ref: >-
            #/components/responses/getRemoveImportedMessagingPhoneNumberOrdersResponse
    post:
      tags:
        - Hosted Messaging
      description: >
        Create an order to remove imported phone numbers for messaging from the
        given account ID. An optional customer ID can be provided in the request
        body to track the order. A successfully submitted order will have a
        status of "PROCESSING". A successfully completed order will have a
        status of "COMPLETE" if all of the phone numbers were successfully
        removed and  "PARTIAL" if some of the phone numbers were removed. A
        failed order will have a status of "FAILED" and no phone numbers would
        have been removed.
      summary: Create Order to Remove Hosted Messaging
      operationId: createRemoveImportedPhoneNumberOrder
      parameters:
        - $ref: '#/components/parameters/accountIdPathParam'
      requestBody:
        $ref: '#/components/requestBodies/postRemoveImportedPhoneNumberOrderRequest'
      responses:
        '201':
          $ref: '#/components/responses/postRemoveImportedMessagingTnOrdersResponse'
        '400':
          $ref: >-
            #/components/responses/postRemoveImportedMessagingTnOrders400ErrorResponse
  /accounts/{accountId}/removeImportedPhoneNumberOrders/messaging/{orderId}:
    get:
      tags:
        - Hosted Messaging
      description: Retrieve an order to remove hosted messaging from a phone number by ID
      summary: Get Order to Remove Hosted Messaging
      operationId: retrieveRemoveImportedPhoneNumberOrder
      parameters:
        - $ref: '#/components/parameters/accountIdPathParam'
        - $ref: '#/components/parameters/orderIdPathParam'
      responses:
        '200':
          $ref: >-
            #/components/responses/getRemoveImportedMessagingPhoneNumberOrderResponse
        '400':
          $ref: >-
            #/components/responses/getRemoveImportedMessagingPhoneNumberOrder400ErrorResponse
  /accounts/{accountId}/importTnChecker:
    post:
      tags:
        - Import TN Checker
      description: >-
        Request importability information on a set of TNs. SipPeerId is an
        optional value. If SipPeerId is not specified, the id of the default
        Sip-Peer for the provided SiteId will be used.
      operationId: createRequestImportTnChecker
      summary: Check Tns importability
      parameters:
        - $ref: '#/components/parameters/accountIdPathParam'
      requestBody:
        content:
          application/xml:
            examples:
              example:
                description: example
                value: |-
                  <?xml version="1.0" encoding="UTF-8" standalone="yes"?>
                  <ImportTnCheckerPayload>
                    <TelephoneNumbers>
                      <TelephoneNumber>+13032281000</TelephoneNumber>
                      <TelephoneNumber>+14109235436</TelephoneNumber>
                      <TelephoneNumber>+14104685864</TelephoneNumber>
                    </TelephoneNumbers>
                    <SiteId>486</SiteId>
                    <SipPeerId>500025</SipPeerId>
                  </ImportTnCheckerPayload>
            schema:
              $ref: '#/components/schemas/importTnCheckerPayload'
          application/json:
            schema:
              $ref: '#/components/schemas/importTnCheckerRequest'
            examples:
              example:
                value:
                  phoneNumbers:
                    - '+13032281000'
                    - '+14109235436'
                    - '+14104685864'
                  subAccountId: 486
                  locationId: 500025
      responses:
        '200':
          description: <p>A successful check has been performed.</p>
          content:
            application/xml:
              examples:
                example:
                  value: |-
                    <?xml version="1.0" encoding="UTF-8" standalone="yes"?>
                    <ImportTnCheckerResponse>
                      <ImportTnCheckerPayload>
                        <TelephoneNumbers>
                          <TelephoneNumber>+13032281000</TelephoneNumber>
                        </TelephoneNumbers>
                        <ImportTnErrors>
                          <ImportTnError>
                            <Code>19006</Code>
                            <Description>Bandwidth numbers cannot be imported by this account at this time.</Description>
                            <TelephoneNumbers>
                              <TelephoneNumber>+14109235436</TelephoneNumber>
                              <TelephoneNumber>+14104685864</TelephoneNumber>
                            </TelephoneNumbers>
                          </ImportTnError>
                        </ImportTnErrors>
                      </ImportTnCheckerPayload>
                    </ImportTnCheckerResponse>
              schema:
                $ref: '#/components/schemas/importTnCheckerResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/importTnCheckerJsonResponse'
              examples:
                example:
                  value:
                    phoneNumbers:
                      - '+13032281000'
                    errors:
                      - code: 19006
                        description: >-
                          Bandwidth numbers cannot be imported by this account
                          at this time.
                        phoneNumbers:
                          - '+14109235436'
                          - '+14104685864'
        '400':
          description: >-
            <p>Bad Response - there were errors in evaluating the body of the
            request.</p> <p>Potential errors include:</p><ul><li> List of TNs is
            empty.<li> List of TNs is more than 5000 TNs.<li> The account does
            not have the necessary (IMPORT_TNS) flag.<li> TNs are invalid (they
            are not actual TNs, and there are duplicates).</ul>
          content:
            application/xml:
              examples:
                example:
                  value: |-
                    <?xml version="1.0" encoding="UTF-8" standalone="yes"?>
                    <ImportTnCheckerResponse>
                    <Errors>
                      <Code>7201</Code>
                        <Description>+161746052083 is not a valid NANP telephone number.</Description>
                      </Errors>
                      <Errors>
                        <Code>7201</Code>
                        <Description>+161746052082 is not a valid NANP telephone number.</Description>
                      </Errors>
                    </ImportTnCheckerResponse>
              schema:
                $ref: '#/components/schemas/importTnCheckerErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/importTnCheckerErrorJsonResponse'
              examples:
                example:
                  value:
                    errors:
                      - code: 7201
                        description: +161746052083 is not a valid NANP telephone number.
                      - code: 7201
                        description: +161746052082 is not a valid NANP telephone number.
  /accounts/{accountId}/operators:
    post:
      tags:
        - Operator Information
      description: |
        <p>Store an  operator information</p>
      operationId: createOperators
      summary: Create Operator
      parameters:
        - $ref: '#/components/parameters/accountIdPathParam'
      requestBody:
        $ref: '#/components/requestBodies/operatorRequest'
      responses:
        '201':
          $ref: '#/components/responses/operatorSuccessfulResponse'
        '400':
          $ref: '#/components/responses/operatorBadRequestError'
        '401':
          $ref: '#/components/responses/operatorUnauthorizedError'
        '403':
          $ref: '#/components/responses/operatorForbiddenError'
        '404':
          $ref: '#/components/responses/operatorNotFoundError'
        '405':
          $ref: '#/components/responses/methodNotSupportedError'
        '415':
          $ref: '#/components/responses/operatorInvalidMediaTypeError'
        '429':
          $ref: '#/components/responses/operatorTooManyRequestsError'
        '500':
          $ref: '#/components/responses/operatorsInternalServerError'
    get:
      tags:
        - Operator Information
      description: |
        <p>Store an operator information</p>
      operationId: listOperators
      summary: List Operators
      parameters:
        - $ref: '#/components/parameters/accountIdPathParam'
        - $ref: '#/components/parameters/operatorCountryCodeA3QueryParam'
        - $ref: '#/components/parameters/operatorSizeQueryParam'
      responses:
        '200':
          $ref: '#/components/responses/listOperatorsResponse'
        '400':
          $ref: '#/components/responses/operatorBadRequestError'
        '401':
          $ref: '#/components/responses/operatorUnauthorizedError'
        '403':
          $ref: '#/components/responses/operatorForbiddenError'
        '404':
          $ref: '#/components/responses/operatorNotFoundError'
        '405':
          $ref: '#/components/responses/methodNotSupportedError'
        '415':
          $ref: '#/components/responses/operatorInvalidMediaTypeError'
        '429':
          $ref: '#/components/responses/operatorTooManyRequestsError'
        '500':
          $ref: '#/components/responses/operatorsInternalServerError'
  /accounts/{accountId}/operators/{operatorId}:
    patch:
      tags:
        - Operator Information
      description: |
        Update the name and/or routing prefixes for an operator by ID.
      operationId: updateOperator
      summary: Update Operator
      parameters:
        - $ref: '#/components/parameters/accountIdPathParam'
        - $ref: '#/components/parameters/operatorId'
      requestBody:
        $ref: '#/components/requestBodies/operatorPatchRequest'
      responses:
        '200':
          $ref: '#/components/responses/operatorSuccessfulResponse'
        '400':
          $ref: '#/components/responses/operatorBadRequestError'
        '401':
          $ref: '#/components/responses/operatorUnauthorizedError'
        '403':
          $ref: '#/components/responses/operatorForbiddenError'
        '404':
          $ref: '#/components/responses/operatorNotFoundError'
        '405':
          $ref: '#/components/responses/methodNotSupportedError'
        '415':
          $ref: '#/components/responses/operatorInvalidMediaTypeError'
        '429':
          $ref: '#/components/responses/operatorTooManyRequestsError'
        '500':
          $ref: '#/components/responses/operatorsInternalServerError'
    get:
      tags:
        - Operator Information
      description: |
        <p>Retrieve an operator information</p>
      operationId: getOperator
      summary: Get Operator
      parameters:
        - $ref: '#/components/parameters/accountIdPathParam'
        - $ref: '#/components/parameters/operatorId'
      responses:
        '200':
          $ref: '#/components/responses/operatorSuccessfulResponse'
        '400':
          $ref: '#/components/responses/operatorBadRequestError'
        '401':
          $ref: '#/components/responses/operatorUnauthorizedError'
        '403':
          $ref: '#/components/responses/operatorForbiddenError'
        '404':
          $ref: '#/components/responses/operatorNotFoundError'
        '405':
          $ref: '#/components/responses/methodNotSupportedError'
        '415':
          $ref: '#/components/responses/operatorInvalidMediaTypeError'
        '429':
          $ref: '#/components/responses/operatorTooManyRequestsError'
        '500':
          $ref: '#/components/responses/operatorsInternalServerError'
  /accounts/{accountId}/importTnOrders/voice:
    get:
      tags:
        - Hosted Voice
      description: >
        Retrieves the ImportVoiceTnOrder requests for the given account ID. A
        maximum of 1,000 orders can be retrieved per request. If no date range
        or specific query parameter (marked by <b class="required">*</b> below)
        is provided, the order results will be limited to the last two years.
      summary: List Import Voice Tn orders
      operationId: readImportVoiceTnOrders
      parameters:
        - $ref: '#/components/parameters/accountIdPathParam'
        - $ref: '#/components/parameters/statusQueryParam'
        - $ref: '#/components/parameters/tnQueryParam'
        - $ref: '#/components/parameters/customerOrderIdQueryParam'
        - $ref: '#/components/parameters/createdDateFromQueryParam'
        - $ref: '#/components/parameters/createdDateToQueryParam'
        - $ref: '#/components/parameters/modifiedDateFromQueryParam'
        - $ref: '#/components/parameters/modifiedDateToQueryParam'
      responses:
        '200':
          description: >-
            The descriptive payload for the importVoiceTnOrders query provides
            information about the orders found by the query, including the data
            associated with the order, the state of the order, and a list of the
            successfully imported Telephone Numbers, and descriptions of any
            encountered errors.
          content:
            application/xml:
              examples:
                example:
                  value: |
                    <?xml version="1.0" encoding="UTF-8" standalone="yes"?>
                    <ImportVoiceTnOrders>
                       <TotalCount>2</TotalCount>
                       <ImportVoiceTnOrderSummary>
                          <accountId>14</accountId>
                          <CountOfTNs>1</CountOfTNs>
                          <CustomerOrderId>CustomerOrderId</CustomerOrderId>
                          <userId>systemUser</userId>
                          <lastModifiedDate>2019-01-24T11:08:09.770Z</lastModifiedDate>
                          <OrderDate>2019-01-24T11:08:09.770Z</OrderDate>
                          <OrderType>import_voice_tn_orders</OrderType>
                          <OrderStatus>COMPLETE</OrderStatus>
                          <OrderId>211a103c-5f9c-4117-8833-c574bdc390fd</OrderId>
                       </ImportVoiceTnOrderSummary>
                       <ImportVoiceTnOrderSummary>
                          <accountId>14</accountId>
                          <CountOfTNs>2</CountOfTNs>
                          <CustomerOrderId>CustomerOrderId</CustomerOrderId>
                          <userId>systemUser</userId>
                          <lastModifiedDate>2019-01-24T10:43:16.934Z</lastModifiedDate>
                          <OrderDate>2019-01-24T10:43:16.934Z</OrderDate>
                          <OrderType>import_voice_tn_orders</OrderType>
                          <OrderStatus>PARTIAL</OrderStatus>
                          <OrderId>8dc32f09-2329-4c73-b702-526f46b02712</OrderId>
                       </ImportVoiceTnOrderSummary>
                    </ImportVoiceTnOrders>
              schema:
                $ref: '#/components/schemas/importVoiceTnOrdersResponseList'
            application/json:
              schema:
                $ref: '#/components/schemas/importVoiceTnOrdersJsonResponseList'
              examples:
                example:
                  value:
                    totalCount: 2
                    orders:
                      - accountId: 14
                        phoneNumberCount: 1
                        customerOrderId: CustomerOrderId
                        userId: systemUser
                        lastModifiedDate: '2019-01-24T11:08:09.770Z'
                        orderDate: '2019-01-24T11:08:09.770Z'
                        orderType: import_voice_tn_orders
                        orderStatus: COMPLETE
                        orderId: 211a103c-5f9c-4117-8833-c574bdc390fd
                      - accountId: 14
                        phoneNumberCount: 2
                        customerOrderId: CustomerOrderId
                        userId: systemUser
                        lastModifiedDate: '2019-01-24T10:43:16.934Z'
                        orderDate: '2019-01-24T10:43:16.934Z'
                        orderType: import_voice_tn_orders
                        orderStatus: PARTIAL
                        orderId: 8dc32f09-2329-4c73-b702-526f46b02712
    post:
      tags:
        - Hosted Voice
      description: >-
        Creates an ImportVoiceTnOrders request to add numbers under the given
        site ID and sipPeer ID as specified in the body.

        We can either provide the list of telephone numbers or the range(s) of
        telephone numbers in the request.

        A successfully submitted order will have a status of "RECEIVED". A
        successfully completed order will have a status of "COMPLETE" if all of
        the telephone numbers were successfully imported and  "PARTIAL" if some
        of the telephone numbers were imported. A failed order with will have a
        staus of "FAILED" and no telephone numbers would have been imported.
      summary: Import Voice Tn order
      operationId: createImportVoiceTnOrder
      parameters:
        - $ref: '#/components/parameters/accountIdPathParam'
      requestBody:
        content:
          application/xml:
            schema:
              $ref: '#/components/schemas/importVoiceTnOrderRequest'
            examples:
              With telephone numbers list:
                value: |
                  <?xml version="1.0" encoding="UTF-8" standalone="yes"?>
                  <ImportVoiceTnOrder>
                     <CustomerOrderId>ICPA123ABC</CustomerOrderId>
                     <SiteId>743</SiteId>
                     <SipPeerId>303716</SipPeerId>
                     <VoiceConfigurationPackageId>8826e9fe-1f0a-4cb0-be37-85cad742686c</VoiceConfigurationPackageId>
                     <OperatorId>1</OperatorId>
                     <TelephoneNumbers>
                        <TelephoneNumber>+19199918388</TelephoneNumber>
                        <TelephoneNumber>+14158714245</TelephoneNumber>
                        <TelephoneNumber>+14352154439</TelephoneNumber>
                        <TelephoneNumber>+14352154466</TelephoneNumber>
                     </TelephoneNumbers>
                  </ImportVoiceTnOrder>
              With telephone numbers range:
                value: |
                  <?xml version="1.0" encoding="UTF-8" standalone="yes"?>
                  <ImportVoiceTnOrder>
                     <CustomerOrderId>ICPA123ABC</CustomerOrderId>
                     <SiteId>743</SiteId>
                     <SipPeerId>303716</SipPeerId>
                     <VoiceConfigurationPackageId>8826e9fe-1f0a-4cb0-be37-85cad742686c</VoiceConfigurationPackageId>
                     <OperatorId>1</OperatorId>
                     <TelephoneNumbersRanges>
                        <TelephoneNumbersRange>
                          <From>+19199918388</From>
                          <To>+19199918400</To>
                        </TelephoneNumbersRange>
                        <TelephoneNumbersRange>
                          <From>+14158714245</From>
                          <To>+14158714252</To>
                        </TelephoneNumbersRange>
                     </TelephoneNumbersRanges>
                  </ImportVoiceTnOrder>
          application/json:
            schema:
              $ref: '#/components/schemas/importVoiceTnOrderJsonRequest'
            examples:
              With telephone numbers list:
                value:
                  customerOrderId: ICPA123ABC
                  subAccountId: 743
                  locationId: 303716
                  voiceConfigurationPackageId: 8826e9fe-1f0a-4cb0-be37-85cad742686c
                  operatorId: 1
                  phoneNumbers:
                    - '+19199918388'
                    - '+14158714245'
                    - '+14352154439'
                    - '+14352154466'
              With telephone numbers range:
                value:
                  customerOrderId: ICPA123ABC
                  subAccountId: 743
                  locationId: 303716
                  voiceConfigurationPackageId: 8826e9fe-1f0a-4cb0-be37-85cad742686c
                  operatorId: 1
                  phoneNumberRanges:
                    - from: '+19199918388'
                      to: '+19199918400'
                    - from: '+14158714245'
                      to: '+14158714252'
      responses:
        '201':
          description: >-
            The order has been created and an order ID will be specified in the
            payload and in the header.
          content:
            application/xml:
              examples:
                With telephone numbers list:
                  value: |
                    <?xml version="1.0" encoding="UTF-8" standalone="yes"?>
                      <ImportVoiceTnOrderResponse>
                         <ImportVoiceTnOrder>
