      summary: Retrieve port-in order
      tags:
        - Porting
    put:
      description: >
        <p>It is possible to change ("SUPP" in LNP terms) an existing LNP order.
        This is done via a PUT on the existing order-id.  If a field is present
        in the PUT /portins/{orderId} payload, the value of the field will be
        updated for the order, subject to existing rules about the field. If a
        field is NOT present in the PUT /portins/{orderId} payload, behavior
        varies as to whether the missing field is removed from the port-in, set
        to a default value, or left unchanged. Therefore, the LnpOrderSupp
        request payload must include all the fields specified in the schema. We
        strongly recommend performing a GET request on the order first and
        copying the values for all elements that you do not intend to change.
        Please note that some fields returned in the GET response are not part
        of the schema and cannot be included in the request
        payload.</p><p><b>Note:</b> <ul><li> If the order ProcessingStatus is
        DRAFT, the rules about what can be changed are much more relaxed. Most
        of the validation is performed when the ProcessingStatus is changed from
        DRAFT to SUBMITTED.  If SUPP is performed on a draft portin, no
        validations are applied except validation of the ListOfPhoneNumbers, if
        at least 1 PhoneNumber is provided.</li> <li>Submitting the parent bulk
        port-in will trigger the submission of child port-in orders.</li></ul>
        </p>Please visit <a
        href='/docs/numbers/porting/port-ins/stand-alone-port-ins'>How to Manage
        Port in</a> guide. Also you can find more information about port types
        on <a
        href='/docs/numbers/porting/port-ins/stand-alone-portins/lnpChecker'>Port
        Types section of this </a> guide
      operationId: UpdatePortin
      parameters:
        - $ref: '#/components/parameters/AccountIdPathParam'
        - $ref: '#/components/parameters/OrderIdPathParam'
      requestBody:
        content:
          application/json:
            examples:
              Automated Toll-Free Request:
                value:
                  customerOrderId: SJM00002
                  loaAuthorizingPerson: TestName TestLastName
                  locationId: 28845
                  phoneNumbers:
                    - '+12019721004'
                    - '+12019721005'
                  requestedFocDate: '2022-12-04T11:30:00-04:00'
                  subAccountId: 743
                  tags:
                    - tagName: customerId
                      tagValue: 11111111-1111-1111-1111-111111111111
                  acknowledgeAndOverrideAllWarnings: true
                  targetRespOrgId: JYT01
              Hosted Number Request:
                value:
                  operatorCode: OPR1
                  requestedFocDate: '2023-09-01'
                  subscriber:
                    addressId: ba4bb1f3-4358-4a46-883f-6376539ff94e
                    businessName: Acme, Inc.
                    subscriberType: BUSINESS
                    vatNumber: IE1234567T
                  tags:
                    - tagName: customerId
                      tagValue: 11111111-1111-1111-1111-111111111111
              Manual Global Request:
                value:
                  customerOrderId: port-001
                  locationId: 553906
                  losingCarrierName: British Telecom
                  phoneNumbers:
                    - '+441171261486'
                    - '+441171261487'
                    - '+441171261488'
                  requestedFocDate: '2023-09-01'
                  subAccountId: 13078
                  subscriber:
                    addressId: ba4bb1f3-4358-4a46-883f-6376539ff94e
                    businessName: Acme, Inc.
                    subscriberType: BUSINESS
                    vatNumber: IE1234567T
                  tags:
                    - tagName: customerId
                      tagValue: 11111111-1111-1111-1111-111111111111
              Multi-group Request:
                $ref: '#/components/examples/updatePortinMultiGroupRequestJson'
              Regular Request:
                value:
                  alternateSpid: Foo
                  billingTelephoneNumber: '+18045030092'
                  comments:
                    internal: true
                    value: PRI Circuit ID 1234
                  customerOrderId: SJM00002
                  immediately:
                    internal: true
                    value: false
                  loaAuthorizingPerson: TestName TestLastName
                  losingResellerName: My Current Provider Name
                  newBillingTelephoneNumber: '+19175131245'
                  overrideValidation:
                    internal: true
                    value: false
                  partialPort: 'true'
                  phoneNumberAttributes:
                    - Protected
                  phoneNumbers:
                    - '+12019721004'
                    - '+12019721005'
                  requestedFocDate: '2014-12-04T13:00:00.000Z'
                  subAccountId: 743
                  subscriber:
                    firstName: TestName
                    lastName: TestLastName
                    serviceAddress:
                      city: Cary
                      houseNumber: 115
                      resetAddressFields: true
                      stateCode: NC
                      streetName: Monarch Way
                      zip: 27518
                    subscriberType: RESIDENTIAL
                  tags:
                    - tagName: customerId
                      tagValue: 11111111-1111-1111-1111-111111111111
                  wirelessInfo:
                    accountNumber: '23453245'
                    pinNumber: '1111'
            schema:
              oneOf:
                - $ref: '#/components/schemas/lnpOrderSuppAutomatedOffNetJson'
                - $ref: '#/components/schemas/lnpOrderSuppManualTollFreeJson'
                - $ref: '#/components/schemas/lnpOrderSuppAutomatedTollFreeJson'
