          type: array
      type: object
    lnpOrderPutResponseJson:
      properties:
        lnpOrderResponse:
          properties:
            billingTelephoneNumber:
              description: >-
                The BillingTelephoneNumber is the primary telephone number
                associated with the invoice that the subscriber gets from the
                losing carrier.
              type: string
            losingResellerName:
              description: >-
                Name of the company serving the telephone numbers prior to the
                port. Some Canada ports may be rejected unless this information
                is supplied.
              example: losingReseller
              type: string
            newBillingTelephoneNumber:
              description: >-
                This field is used to specify a new billing telephone number on
                the losing carrier account.
              type: string
            orderId:
              description: Unique orderId that is used to manage the order.
              example: 556f2688-6cb1-46ce-8016-6bbf0741a519
              format: uuid
              type: string
            phoneNumberGroups:
              description: >-
                The phone number groups associated with this port-in order, when
                the order was created using the multi-group phone number
                assignment.
              items:
                $ref: '#/components/schemas/portinPhoneNumberGroupJson'
              type: array
            processingStatus:
              description: The processing status of the order after it has been updated.
              enum:
                - REQUESTED_SUPP
              type: string
            requestedFocDate:
              description: >-
                This is the FOC (Firm Order Commitment) Date requested by the
                person (or machine) creating the Port-in Order.
              type: string
            status:
              properties:
                code:
                  type: integer
                description:
                  type: string
              type: object
            tags:
              $ref: '#/components/schemas/phoneNumberTags'
            targetRespOrgId:
              description: >-
                This is the RespOrg ID that you want the toll-free numbers
                ported to. Normally it will specify a Bandwidth RespOrg ID like
                JYT01, but it could be something else for RespOrg Exception
                customers.
              type: string
            triggered:
              description: >-
                The Triggered field must be set to true if you want an
                activation time other than the 11:30 AM ET default. The desired
                activation time can then be specified in the time portion of the
                RequestedFocDate. Triggered activation is not yet supported for
                toll-free port-in orders.
              type: string
          type: object
      type: object
    lnpOrderResponse:
      properties:
        lnpOrderResponse:
          properties:
            billingTelephoneNumber:
              description: >-
                The BillingTelephoneNumber is the primary telephone number
                associated with the invoice that the subscriber gets from the
                losing carrier.
              type: string
              xml:
                name: BillingTelephoneNumber
            errors:
              properties:
                code:
                  description: Numeric designation of corresponding error.
                  type: integer
                  xml:
                    name: Code
                description:
                  description: Detailed explanation about the error.
                  type: string
                  xml:
                    name: Description
              type: object
              xml:
                name: Errors
            listOfPhoneNumbers:
              description: >-
                ListOfPhoneNumbers is an array of PhoneNumber. At least one
                PhoneNumber must be provided for all port-types.
              items:
                $ref: '#/components/schemas/phoneNumber'
              type: array
            loaAuthorizingPerson:
              description: >-
                The LoaAuthorizingPerson is mandatory for all port-types. This
                is the first and last names of the person that has authorized
                the port. The LoaAuthorizingPerson value may be up to 15
                characters in length.
              type: string
              xml:
                name: LoaAuthorizingPerson
            losingResellerName:
              description: >-
                Name of the company serving the telephone numbers prior to the
                port. Some Canada ports may be rejected unless this information
                is supplied.
              example: losingReseller
              type: string
              xml:
                name: LosingResellerName
            newBillingTelephoneNumber:
              description: >-
                This field is used to specify a new billing telephone number on
                the losing carrier account.
              type: string
              xml:
                name: NewBillingTelephoneNumber
            orderId:
              description: Unique orderId that is used to manage the order.
              example: 556f2688-6cb1-46ce-8016-6bbf0741a519
              format: uuid
              type: string
              xml:
                name: OrderId
            peerId:
              description: >-
                The numeric designation for the Location or SIP PEER ID that
                applied to the Port-in Order. The SIP Peer ID is used to provide
                a home within the location for the TN(s) that were ported in by
                the Port-in Order.
              type: string
              xml:
                name: PeerId
            phoneNumberGroups:
              description: >-
                The phone number groups associated with this port-in order, when
                the order was created using the multi-group phone number
                assignment.
              items:
                $ref: '#/components/schemas/portinPhoneNumberGroup'
              type: array
              xml:
                name: PhoneNumberGroups
                wrapped: true
            processingStatus:
              description: >-
                The processing status of this order. Values may be: PROCESSING,
                COMPLETED, FAILED. PROCESSING means that the system is still
                processing the order. COMPLETED means that the order has been
                successfully completed. FAILED means that errors occurred while
                processing the order, and that the order did not make any
                changes to the system.
              enum:
                - PENDING_DOCUMENTS
              type: string
              xml:
                name: ProcessingStatus
            siteId:
              description: >-
                The numeric designation for the Site ID that applied to the
                Port-in Order. The SiteId is used to provide a home within the
                account for the TN(s) that were ported in by the Port-in Order.
              type: string
              xml:
                name: SiteId
            status:
              properties:
                code:
                  type: integer
                  xml:
                    name: Code
                description:
                  type: string
                  xml:
                    name: Description
              type: object
              xml:
                name: Status
            subscriber:
              $ref: '#/components/schemas/subscriber'
            tags:
              allOf:
                - $ref: '#/components/schemas/phoneNumberTagsXml'
              xml:
                name: Tags
            tnAttributes:
              items:
                $ref: '#/components/schemas/tnAttribute'
              type: array
              xml:
                name: TnAttributes
            triggered:
              description: >-
                The Triggered field must be set to true if you want an
                activation time other than the 11:30 AM ET default. The desired
                activation time can then be specified in the time portion of the
                RequestedFocDate. Triggered activation is not yet supported for
                toll-free port-in orders.
              type: string
              xml:
                name: Triggered
            wirelessInfo:
              $ref: '#/components/schemas/wirelessInfo'
          type: object
          xml:
            name: LnpOrderResponse
      title: LNP Order Response
      type: object
