                    omitted or false, and the `phoneNumbers` does not include
                    all of the telephone numbers associated with the
                    `BillingTelephoneNumber`, the port-in will be
                    rejected.<br/><br/>PartialPort is applicable only to on-net
                    port-types.
                  type: string
                phoneNumberAttributes:
                  description: >-
