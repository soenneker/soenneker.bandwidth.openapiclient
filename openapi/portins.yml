openapi: 3.0.1
info:
  title: Porting
  description: >-
    Bandwidth's Porting API


    This API provides endpoints to manage port-in orders, including retrieving
    and updating activation status for telephone numbers being ported into the
    Bandwidth network.
  contact:
    name: Bandwidth
    url: https://dev.bandwidth.com/apis/numbers-apis/porting/portins/
    email: support@bandwidth.com
  version: 2.0.0
  termsOfService: https://www.bandwidth.com/legal/terms-of-service/
servers:
  - url: https://api.bandwidth.com/api/v2
    description: Production
security:
  - Basic: []
  - Bearer: []
paths:
  /accounts/{accountId}/csrs:
    get:
      tags:
        - Porting
      description: >-
        Retrieves the CSR orders for the given account ID.

        Please visit <a href='/docs/numbers/porting/port-ins/csrs'>Guides and
        Tutorials</a>
      summary: List CSR orders
      operationId: readCsrOrders
      parameters:
        - $ref: '#/components/parameters/AccountIdPathParam'
        - $ref: '#/components/parameters/modifiedDateFromQueryParam'
        - $ref: '#/components/parameters/modifiedDateToQueryParam'
        - $ref: '#/components/parameters/pageQueryParam'
        - $ref: '#/components/parameters/sizeQueryParam'
        - $ref: '#/components/parameters/statusQueryParam'
      responses:
        '200':
          $ref: '#/components/responses/csrListResponse200'
        '400':
          $ref: '#/components/responses/csrBadRequestError'
        '401':
          $ref: '#/components/responses/errorResponse401'
        '403':
          $ref: '#/components/responses/errorResponse403'
        '404':
          $ref: '#/components/responses/errorResponse404'
        '405':
          $ref: '#/components/responses/errorResponse405'
        '429':
          $ref: '#/components/responses/errorResponse429'
        5XX:
          $ref: '#/components/responses/errorResponse500'
    post:
      tags:
        - Porting
      description: Creates the CSR order
      summary: Create CSR order
      operationId: createCsrOrder
      parameters:
        - $ref: '#/components/parameters/AccountIdPathParam'
      requestBody:
        $ref: '#/components/requestBodies/csrCreateRequestBody'
      responses:
        '201':
          $ref: '#/components/responses/csrCreateResponse201'
        '400':
          $ref: '#/components/responses/csrBadRequestError'
        '401':
          $ref: '#/components/responses/errorResponse401'
        '403':
          $ref: '#/components/responses/errorResponse403'
        '404':
          $ref: '#/components/responses/errorResponse404'
        '405':
          $ref: '#/components/responses/errorResponse405'
        '429':
          $ref: '#/components/responses/errorResponse429'
        5XX:
          $ref: '#/components/responses/errorResponse500'
  /accounts/{accountId}/csrs/{orderId}:
    get:
      tags:
        - Porting
      description: Retrieves the CSR order for the given account ID by order ID.
      summary: Get CSR order
      operationId: readCsrOrder
      parameters:
        - $ref: '#/components/parameters/AccountIdPathParam'
        - $ref: '#/components/parameters/OrderIdPathParam'
      responses:
        '200':
          $ref: '#/components/responses/csrGetResponse200'
        '400':
          $ref: '#/components/responses/csrBadRequestError'
        '401':
          $ref: '#/components/responses/errorResponse401'
        '403':
          $ref: '#/components/responses/errorResponse403'
        '404':
          $ref: '#/components/responses/errorResponse404'
        '405':
          $ref: '#/components/responses/errorResponse405'
        '429':
          $ref: '#/components/responses/errorResponse429'
        5XX:
          $ref: '#/components/responses/errorResponse500'
    put:
      tags:
        - Porting
      description: Update CSR order
      summary: Update CSR order
      operationId: updateCsrOrder
      parameters:
        - $ref: '#/components/parameters/AccountIdPathParam'
        - $ref: '#/components/parameters/OrderIdPathParam'
      requestBody:
        $ref: '#/components/requestBodies/csrUpdateRequestBody'
      responses:
        '200':
          $ref: '#/components/responses/csrUpdateResponse200'
        '400':
          $ref: '#/components/responses/csrBadRequestError'
        '401':
          $ref: '#/components/responses/errorResponse401'
        '403':
          $ref: '#/components/responses/errorResponse403'
        '404':
          $ref: '#/components/responses/errorResponse404'
        '405':
          $ref: '#/components/responses/errorResponse405'
        '429':
          $ref: '#/components/responses/errorResponse429'
        5XX:
          $ref: '#/components/responses/errorResponse500'
  /accounts/{accountId}/portins:
    get:
      description: >-
        Retrieves the port-in requests for the given account ID. <p>A maximum of
        1,000 orders can be retrieved per request. If no date range or specific
        query parameter (marked by <b class="required">*</b> below) is provided,
        the order results will be limited to the last two years.</p>
      operationId: ListPortins
      parameters:
        - $ref: '#/components/parameters/AccountIdPathParam'
        - description: >-
            The port-in ID of the first order of the page. Value "1" is used as
            a convention for the first port-in in the account ID (Use it to get
            a first page of orders list).
          example: ca8065d1-ec1a-43da-af40-1dcee43becb5
          in: query
          name: page
          required: true
          schema:
            default: '1'
            type: string
        - description: The number of port-ins retrieved.
          example: 30
          in: query
          name: size
          required: true
          schema:
            default: 300
            type: integer
        - $ref: '#/components/parameters/portinStatusV3Param'
        - description: >
            <p>The earliest date that the order was last modified. <strong>NOTE:
            </strong> startdate and enddate must be simultaneously declared.</p>
          example: '2014-08-05'
          in: query
          name: startdate
          required: false
          schema:
            format: date
            type: string
        - description: >
            <p>The latest date that the order was last modified. <strong>NOTE:
            </strong> startdate and enddate must be simultaneously declared.</p>
          example: '2014-08-05'
          in: query
          name: enddate
          required: false
          schema:
            format: date
            type: string
        - description: >
            <p><b class="required">*</b> The billing telephone number associated
            with the port-in(s).  Note that tn cannot be combined with any of
            the date-based query parameters (date, startdate, or enddate).</p>
          example: 19191234567
          in: query
          name: tn
          required: false
          schema:
            type: integer
        - description: >
            <p><b class="required">*</b> A telephone number included in the
            ListOfPhoneNumbers in a port-in order.  Note that order tn cannot be
            combined with any of the date-based query parameters (date,
            startdate, or enddate).</p>
          example: 19143982871
          in: query
          name: orderTn
          required: false
          schema:
            type: integer
        - $ref: '#/components/parameters/countryCodeA3QueryParam'
        - $ref: '#/components/parameters/phoneNumberTypeQueryParam'
        - $ref: '#/components/parameters/portinCustomerOrderIdV3Param'
        - $ref: '#/components/parameters/portinPonV3Param'
        - description: >-
            The date when orders were modified.  Note that this differs from the
            last modified date of an order.

            For example, if an order reached FOC on 2020-01-15, and completed on
            2020-01-16, searching by

            date 2020-01-15 will return an entry for the order in FOC state with
            last modified date of 1/15.

            Searching by date 2020-01-16 will return an entry for the SAME order
            in COMPLETE state with the

            last modified date of 1/16.  BUT, if you search by date range with
            startdate=2020-01-15 and

            enddate=2020-01-16, you will only see the latest of the entries for
            the same order.
          example: '2020-01-15'
          in: query
          name: date
          required: false
          schema:
            format: date
            type: string
        - description: |
            <p>Search only for hosted TN port-in orders.</p>
          example: true
          in: query
          name: hostedTN
          required: false
          schema:
            type: boolean
        - $ref: '#/components/parameters/portinOrderIdV3Param'
        - $ref: '#/components/parameters/portinOrderDateV3Param'
        - $ref: '#/components/parameters/portinLastUpdatedV3Param'
        - $ref: '#/components/parameters/portinBtnV3Param'
      responses:
        '200':
          content:
