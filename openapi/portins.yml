    manualGlobalBetaLnpOrderRequest:
      properties:
        LnpOrder:
          allOf:
            - properties:
                CustomerOrderId:
                  description: >-
                    Optional customer-defined reference ID for this order. Only
                    alphanumeric values, dashes and spaces are allowed. Not
                    unique — Bandwidth applies no uniqueness constraint, so
                    multiple orders may share the same value. Each order
                    receives its own unique Bandwidth-assigned `orderId`.
                  maxLength: 255
                  type: string
                ListOfPhoneNumbers:
                  description: >-
                    `ListOfPhoneNumbers` is an array of `PhoneNumber`. At least
                    one `PhoneNumber` must be provided.
                  items:
                    properties:
                      PhoneNumber:
                        description: >-
                          One or more phone numbers is required. <br/>Use a
                          `<PhoneNumber>` tag for each phone number in the
                          `<ListOfPhoneNumbers>` list.
                        format: E164 phone number with no dots or dashes
                        type: string
                    type: object
                  type: array
                LosingCarrierName:
                  description: >-
                    `LosingCarrierName` specifies the name of the losing
                    carrier 
                  type: string
                PeerId:
                  description: >-
                    `PeerId` specifies the numeric identifier of the SIP-peer
                    (Location) that the telephone numbers will be ported
                    into.<br/><br/>You can find the identifier for a SIP-peer
                    (location) by using `GET /accounts/id/sites/id/sippeers`, or
                    by clicking on 'Accounts' on the upper right of the
                    [Bandwidth App](Https://api.bandwidth.com), then clicking
                    'Locations' on the navigation bar. The SIP-peer (location)
                    identifiers are listed next to each location name. If
                    `PeerId` is omitted, the SIP-peer (location) designated as
                    the 'default location' for that site (sub-account) will be
                    used.
                  type: string
                RequestedFocDate:
                  description: >-
                    Format: ISO8601 encoding such as "2019-10-31".<br/><br/>For
                    global ports, if `RequestedFocDate` is specified the time
                    portions will be ignored and the date portion must be:<br/>
                    - in the future<br/> - not on a weekend.
                  type: string
                SiteId:
                  description: >-
                    `SiteId` specifies the identifier of the site (sub-account)
                    that the telephone numbers will be ported into.<br/><br/>You
                    can find the identifier for a site (sub-account) by using
                    `GET /accounts/id/sites`, or by clicking on 'Manage
                    sub-account' for the desired sub-account on the main page of
                    the Bandwidth App.
                  format: int32
                  type: integer
                Subscriber:
                  oneOf:
                    - $ref: '#/components/schemas/manualGlobalSubscriberResidential'
                    - $ref: '#/components/schemas/manualGlobalSubscriberBusiness'
                Tags:
                  $ref: '#/components/schemas/phoneNumberTagsXml'
              required:
                - SiteId
                - ListOfPhoneNumbers
                - LosingCarrierName
                - Subscriber
              type: object
