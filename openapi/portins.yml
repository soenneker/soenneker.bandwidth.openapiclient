  /accounts/{accountId}/portins/{orderId}:
    delete:
      description: >-
        If port-in order is in DRAFT state the order will be deleted.  Otherwise
        the call simply

        places the existing order in a requested_cancel state.  The order will
        transition to CANCELLED

        as soon as the cancellation is conveyed to our porting vendor.  For
        non-draft orders, DELETE

        does not actually remove the order, but cancels it.  DELETE has no
        effect on orders already

        in a terminal state (i.e. COMPLETE, CANCELLED).
      operationId: DeletePortin
      parameters:
        - $ref: '#/components/parameters/AccountIdPathParam'
        - description: ''
          in: path
          name: orderId
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              example:
                errors:
                  - code: 2811
                    description: >-
                      The porting of international phone numbers is not
                      supported by the current API version.
                orderId: fcd05cd2-d5f2-4ff8-8c9f-34b828fcc456
                processingStatus: REQUESTED_CANCEL
                status:
                  code: 200
                  description: >-
                    Cancellation request received. Please use the order id to
                    check the status of your order later.
              schema:
                $ref: '#/components/schemas/lnpOrderResponseCancelJson'
          description: |
            The port-in order has been successfully deleted/cancelled.
            For requests expecting XML, a 200 response will provide no content.
        '400':
          content:
            application/json:
              examples:
                example:
                  value:
                    billingTelephoneNumber: '+14352154438'
                    errors:
                      - code: 7331
                        description: Rate Center Not Present in Bandwidth App
                        phoneNumbers:
                          - '+17138391156'
                      - code: 7495
                        description: >-
                          Unable to change the TNs on this port. Please ensure
                          that the new TNs are from the same losing carrier as
                          the current TNs.
                        phoneNumbers:
                          - '+12024551000'
                          - '+12018391156'
                          - '+12018391157'
                    orderId: c58fed09-a3fc-49b8-b461-2286146b73c1
                    processingStatus: EXCEPTION
                    status:
                      code: 400
                      description: Validation Failed. Please check your input parameters.
              schema:
                $ref: '#/components/schemas/lnpOrderPutResponseJson'
            application/xml:
              examples:
                example:
                  description: example
                  value: |-
                    <?xml version="1.0" encoding="UTF-8" standalone="yes"?>
                    <LnpOrderResponse>
                        <OrderId>2ffd0af4-7c54-40dc-9bfe-40f08b57e63a</OrderId>
                        <Status>
                            <Code>400</Code>
                            <Description>Validation Failed. Please check your input parameters.</Description>
                        </Status>
                        <Errors>
                            <Code>7304</Code>
                            <Description>The order is already complete and cannot be modified or cancelled</Description>
                        </Errors>
                        <ProcessingStatus>EXCEPTION</ProcessingStatus>
                    </LnpOrderResponse>
              schema:
                $ref: '#/components/schemas/lnpOrderResponse'
          description: >-
            Order id is invalid, order does not exist or the port-in order is
            already processed, and therefore cannot be deleted.
