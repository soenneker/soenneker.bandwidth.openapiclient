            than the losing RespOrg's translation hold window (or the default 10
            business days if the RespOrg has no configured window). The losing
            RespOrg is determined after the toll-free numbers are validated, so
            the order is accepted and is not rejected with error 7910. When the
            requested FOC date is outside the hold window, Bandwidth records a
            note on the order with the hold-window warning. Applies to toll-free
            port-ins with Toll-Free Automation only.
          example: true
          nullable: true
          type: boolean
      required:
        - targetRespOrgId
      type: object
    lnpOrderBasic:
      properties:
        CustomerOrderId:
          description: >-
            Optional customer-defined reference ID for this order. Only
            alphanumeric values, dashes and spaces are allowed. Not unique —
            Bandwidth applies no uniqueness constraint, so multiple orders may
            share the same value. Each order receives its own unique
            Bandwidth-assigned `orderId`.
          maxLength: 255
          type: string
        ListOfPhoneNumbers:
          description: >-
            `ListOfPhoneNumbers` is an array of `PhoneNumber`. At least one
            `PhoneNumber` must be provided.
          items:
            properties:
              PhoneNumber:
                description: >-
                  One or more phone numbers is required. <br/>Use a
                  `<PhoneNumber>` tag for each phone number in the
                  `<ListOfPhoneNumbers>` list.
                format: Ten digit phone number with no dots or dashes
                type: string
            type: object
          type: array
        LoaAuthorizingPerson:
          description: >-
            This is the first and last names of the person that has authorized
            the port.
          maxLength: 15
          type: string
        PeerId:
          description: >-
            `PeerId` specifies the numeric identifier of the SIP-peer (Location)
            that the telephone numbers will be ported into.<br/><br/>You can
            find the identifier for a SIP-peer (location) by using `GET
            /accounts/id/sites/id/sippeers`, or by clicking on 'Accounts' on the
            upper right of the [Bandwidth App](Https://api.bandwidth.com), then
            clicking 'Locations' on the navigation bar. The SIP-peer (location)
            identifiers are listed next to each location name. If `PeerId` is
            omitted, the SIP-peer (location) designated as the 'default
            location' for that site (sub-account) will be used.
          type: string
        ProcessingStatus:
          description: >-
            Including `ProcessingStatus` with a value of DRAFT allows you to
            create a port-in request, but not process the request. This is
            useful if you wish to add items to the order over a period of time
            and submit once you have the order setup the way you want. Note,
            however, that draft orders that have not been updated in a couple of
            days are automatically deleted. Removal of stagnant draft orders is
            performed so that telephone numbers are not tied up in these orders,
            preventing them from being included in other orders.<br/><br/>Very
            little validation is performed while an order is in draft state.
            Omitting `ProcessingStatus` causes the port-in to be validated and,
            if correct, processed right away. The full validation is performed
            on the order when you change the ProcessingStatus to 'SUBMITTED' by
            performing a PUT request on the order. <br><br><p>All toll free
            telephone numbers provided will be validated (even in draft state)
            to ensure

            that they are portable, and to allow you to separate telephone
            numbers into separate port-ins

            based on the RespOrg that they are being ported from.</p>
          enum:
            - DRAFT
          type: string
        RequestedFocDate:
          description: >-
            Format: ISO8601 encoding such as “2013-05-10T15:14:22Z”, or
            "2019-10-31T17:15:00+04:00".<br/><br/>For all ports, if
            `RequestedFocDate` is specified, the date portion must be:<br/> - in
            the future<br/> - after the losing carrier's minimum number of days
            to port-out<br/> - not on a weekend or U.S. holiday<br/><br/>If
            `RequestedFocDate` is not specified, the next available FOC date
            meeting the criteria above will be used. If the Time portion of the
            `RequestedFocDate` is omitted the port-in order will be activated at
            the default activation time of 11:30 AM ET. If an activation time
            other than 11:30 AM ET is desired, that activation time should be
            included in the `RequestedFocDate`.
          type: string
        SiteId:
          description: >-
            `SiteId` specifies the identifier of the site (sub-account) that the
            telephone numbers will be ported into.<br/><br/>You can find the
            identifier for a site (sub-account) by using `GET
            /accounts/id/sites`, or by clicking on 'Manage sub-account' for the
            desired sub-account on the main page of the Bandwidth App.
          format: int32
          type: integer
        Tags:
          $ref: '#/components/schemas/phoneNumberTagsXml'
      required:
        - SiteId
        - ListOfPhoneNumbers
        - LoaAuthorizingPerson
      type: object
    lnpOrderBasicJson:
      oneOf:
        - required:
            - subAccountId
            - phoneNumbers
        - required:
            - phoneNumberGroups
      properties:
        customerOrderId:
          description: >-
            Optional customer-defined reference ID for this order. Only
            alphanumeric values, dashes and spaces are allowed. Not unique —
            Bandwidth applies no uniqueness constraint, so multiple orders may
            share the same value. Each order receives its own unique
            Bandwidth-assigned `orderId`.
          maxLength: 255
          type: string
        loaAuthorizingPerson:
          description: >-
            This is the first and last names of the person that has authorized
            the port.
          maxLength: 15
          type: string
        locationId:
          description: >-
            Specifies the numeric identifier of the SIP-peer (Location) that the
            telephone numbers will be ported into.<br/><br/>You can find the
            identifier for a SIP-peer (location) by using `GET
            /accounts/id/sites/id/sippeers`, or by clicking on 'Accounts' on the
            upper right of the [Bandwidth App](Https://api.bandwidth.com), then
            clicking 'Locations' on the navigation bar. The SIP-peer (location)
            identifiers are listed next to each location name. If `LocationId`
            is omitted, the SIP-peer (location) designated as the 'default
            location' for that site (sub-account) will be used.
          type: string
        phoneNumberGroups:
          description: >-
            An alternative to `phoneNumbers` + `subAccountId` + `locationId`
            that distributes TNs across multiple location/VCP groups in a single
            port-in order. Each group specifies its own `locationId`,
            `phoneNumbers`, and optionally `voiceConfigurationPackageId`. When
            present, top-level `subAccountId`, `locationId`, and
            `voiceConfigurationPackageId` are ignored. Mutually exclusive with
            top-level `phoneNumbers`.
          items:
            $ref: '#/components/schemas/portinPhoneNumberGroupJson'
          type: array
        phoneNumbers:
          $ref: '#/components/schemas/phoneNumbersJson'
        processingStatus:
          description: >-
            Including `ProcessingStatus` with a value of DRAFT allows you to
            create a port-in request, but not process the request. This is
            useful if you wish to add items to the order over a period of time
            and submit once you have the order setup the way you want. Note,
            however, that draft orders that have not been updated in a couple of
            days are automatically deleted. Removal of stagnant draft orders is
            performed so that telephone numbers are not tied up in these orders,
            preventing them from being included in other orders.<br/><br/>Very
            little validation is performed while an order is in draft state.
            Omitting `ProcessingStatus` causes the port-in to be validated and,
            if correct, processed right away. The full validation is performed
            on the order when you change the ProcessingStatus to 'SUBMITTED' by
            performing a PUT request on the order. <br><br><p>All toll free
            telephone numbers provided will be validated (even in draft state)
            to ensure

            that they are portable, and to allow you to separate telephone
            numbers into separate port-ins

            based on the RespOrg that they are being ported from.</p>
          enum:
            - DRAFT
          type: string
        requestedFocDate:
          description: >-
            Format: ISO8601 encoding such as “2013-05-10T15:14:22Z”.
            <br/><br/>For all ports, if `RequestedFocDate` is specified, the
            date portion must be:<br/> - in the future<br/> - after the losing
            carrier's minimum number of days to port-out<br/> - not on a weekend
            or U.S. holiday<br/><br/>If `RequestedFocDate` is not specified, the
            next available FOC date meeting the criteria above will be used.
          format: date-time
          type: string
        subAccountId:
          description: >-
            `SubAccountId` specifies the identifier of the site (sub-account)
            that the telephone numbers will be ported into.<br/><br/>You can
            find the identifier for a site (sub-account) by using `GET
            /accounts/id/sites`, or by clicking on 'Manage sub-account' for the
            desired sub-account on the main page of the Bandwidth App.
          format: int32
          type: integer
        tags:
          $ref: '#/components/schemas/phoneNumberTags'
      required:
        - loaAuthorizingPerson
      type: object
    lnpOrderBasicModifiableFields:
      properties:
        CustomerOrderId:
          description: >
