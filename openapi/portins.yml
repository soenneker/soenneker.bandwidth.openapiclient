    focDateWindow:
      title: FOC Date Window
      description: A single bookable FOC date window.
      type: object
      properties:
        start:
          type: string
          format: date-time
          description: Start of the bookable window for this FOC date.
        end:
          type: string
          format: date-time
          description: End of the bookable window for this FOC date.
      required:
        - start
        - end
    unavailableFocDateReason:
      title: Unavailable FOC Date Reason
      description: >-
        The reason a date is not bookable as a FOC date. Clients must tolerate
        new values being added in the future.
      type: string
      enum:
        - WEEKEND
        - HOLIDAY
    unavailableFocDate:
      title: Unavailable FOC Date
      description: >-
        A date within the available FOC date range that is not bookable, and
        why.
      type: object
      properties:
        date:
          type: string
          format: date
          description: The date that is not bookable.
          example: '2024-07-04'
        reason:
          $ref: '#/components/schemas/unavailableFocDateReason'
        description:
          type: string
          description: >-
            Holiday name from the holiday calendar. Present only when `reason`
            is `HOLIDAY`.
          example: Independence Day
      required:
        - date
        - reason
    availableFocDatesResponseJson:
      type: object
      description: Response containing the set of valid FOC dates for a port-in order.
      properties:
        data:
          type: object
          nullable: true
          properties:
            focDates:
              type: array
              items:
                $ref: '#/components/schemas/focDateWindow'
            unavailableFocDates:
              type: array
              description: >-
                Dates that fall strictly between the first and last `focDates`
                window but are not bookable,

                along with the reason. Always present on 200 responses; an empty
                array when there are no gaps.
              items:
                $ref: '#/components/schemas/unavailableFocDate'
          required:
            - focDates
            - unavailableFocDates
          example:
            focDates:
              - start: '2024-07-01T11:00:00Z'
                end: '2024-07-02T00:00:00Z'
              - start: '2024-07-02T11:00:00Z'
                end: '2024-07-03T00:00:00Z'
              - start: '2024-07-03T11:00:00Z'
                end: '2024-07-04T00:00:00Z'
              - start: '2024-07-05T11:00:00Z'
                end: '2024-07-06T00:00:00Z'
            unavailableFocDates:
              - date: '2024-07-04'
                reason: HOLIDAY
                description: Independence Day
        errors:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/error'
          example: []
        links:
          type: array
          items:
            $ref: '#/components/schemas/link'
          example:
            - href: >-
                https://api.bandwidth.com/api/v2/accounts/{accountId}/portins/{orderId}/availableFocDates
              rel: self
              method: GET
      required:
        - data
        - errors
        - links
