          description: >-
            The `Triggered` field must be set to `true` if you want an
            activation time other than the 11:30 AM ET default. The desired
            activation time can then be specified in the time portion of the
            `RequestedFocDate`. This field will be ignored if set for port-ins
            with the `MANUAL_TOLLFREE`, `MANUAL_ON_NET`, or `MANUALOFFNET` port
            types, as all manual port-ins are activated at 11:30 AM ET.
          type: boolean
        WirelessInfo:
          description: Most common for telephone numbers that were formerly wireless.
          properties:
            AccountNumber:
              description: >-
                The `AccountNumber` is sometimes required to authorize the
                port-out from the losing carrier. This is most common for
                telephone numbers that were formerly wireless.
              type: string
            PinNumber:
              description: >-
                The `PinNumber` is sometimes required to authorize the port-out
                from the losing carrier. This is most common for telephone
                numbers that were formerly wireless.
              type: string
          title: WirelessInfo
          type: object
        losingResellerName:
          description: >-
            Name of the company serving the telephone numbers prior to the port.
            Some Canada ports may be rejected unless this information is
            supplied.
          example: ResellerName
          maxLength: 60
          pattern: '[A-z0-9 -]+'
          type: string
          xml:
            name: LosingResellerName
      required:
        - BillingTelephoneNumber
        - Subscriber
      type: object
