  /accounts/{accountId}/portins/{orderId}/availableFocDates:
    get:
      tags:
        - Porting
      description: >-
        Retrieves the set of valid FOC (Firm Order Commitment) dates that would
        currently pass

        FOC date validation for this port-in order, expressed as bookable
        date/time windows.

        These are the dates that will be accepted if submitted as the order's
        requestedFocDate,

        rather than validating after the fact. Both bounds are driven by the
        order's port type:

        the lower bound is the earliest available FOC date, and the upper bound
        is the latest

        date that port type allows.


        The response also includes `unavailableFocDates`, which explains the
        gaps in `focDates` so

        clients building date pickers don't have to infer them. It only contains
        dates strictly between

        the first and last `focDates` window; days before the first window (lead
        time, same-day cutoff)

        are not listed. NANP ports cover today + 30 days, and Global ports cover
        the country/number-type

        lead time + 30 days, so the only possible gaps are weekends and
        holidays. Each entry has a

        `reason` of `WEEKEND` or `HOLIDAY`; `HOLIDAY` takes precedence when a
        date is both a weekend

        and a holiday, and `description` carries the holiday name.
      operationId: listPortinAvailableFocDates
      summary: Retrieve available FOC dates for a port-in order
      parameters:
        - $ref: '#/components/parameters/AccountIdPathParam'
        - $ref: '#/components/parameters/OrderIdPathParam'
      responses:
        '200':
          $ref: '#/components/responses/availableFocDatesResponse200'
        '400':
          $ref: '#/components/responses/availableFocDatesResponse400'
        '401':
          $ref: '#/components/responses/errorResponse401'
        '403':
          $ref: '#/components/responses/errorResponse403'
        '404':
          $ref: '#/components/responses/availableFocDatesResponse404'
        '405':
          $ref: '#/components/responses/errorResponse405'
        '409':
          $ref: '#/components/responses/availableFocDatesResponse409'
        '429':
          $ref: '#/components/responses/errorResponse429'
        5XX:
          $ref: '#/components/responses/errorResponse500'
