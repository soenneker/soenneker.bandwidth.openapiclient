            Applies to toll-free port-ins with Toll-Free Automation only.
          example: true
          nullable: true
          type: boolean
        loaAuthorizingPerson:
          type: string
        phoneNumbers:
          description: >-
            May be SUPPed only in draft states (i.e. DRAFT, VALIDATE_DRAFT_TFNS,
            VALID_DRAFT_TFNS, or INVALID_DRAFT_TFNS)
          items:
            description: Telephone Number in E.164 format.
