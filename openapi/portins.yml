              type: string
              xml:
                name: ProcessingStatus
            requestedFocDate:
              description: >-
                This is the FOC (Firm Order Commitment) Date requested by the
                person (or machine) creating the Port-in Order.
              type: string
              xml:
                name: RequestedFocDate
            status:
              properties:
                code:
                  type: integer
