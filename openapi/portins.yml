  securitySchemes:
    Basic:
      type: http
      scheme: basic
      description: >-
        Basic authentication is a simple authentication scheme built into the
        HTTP protocol. To use it, send your HTTP requests with an Authorization
        header that contains the word Basic followed by a space and a
        base64-encoded string `username:password`.

        Example: `Authorization: Basic dXNlcm5hbWU6cGFzc3dvcmQ=`
    Bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Bearer authentication (also called token authentication) is an HTTP
        authentication scheme that involves security 

        tokens called bearer tokens. The name "Bearer authentication" can be
        understood as "give access to the bearer

        of this token." The client must send this token in the `Authorization`
        header when making requests to

        protected resources.


        - Example: `Authorization: Bearer <token>`


        Where `<token>` should be replaced with the token string without angle
        brackets.


        For more information, see the following guide:
        [Credentials](https://dev.bandwidth.com/docs/account/credentials/management)
  parameters:
    tnPortoutPasscodesPageQueryParam:
      name: page
      description: >-
        An ID of the first element in a page. This value will indicate the first
        value, not the count, of the initial entry in the page being requested.
        Note in the example that the page is the TN that begins the page. The
        initial page is tagged with the ID `1`.
      in: query
      required: true
      schema:
        type: string
        default: '1'
      example: '1'
    tnPortoutPasscodesSizeQueryParam:
      name: size
      description: The number of items to include in a page.
      in: query
      required: true
      schema:
        type: integer
        default: 500
      example: 250
    AccountIdPathParam:
      name: accountId
      description: User's account ID.
      in: path
      required: true
      schema:
        type: string
      example: '1234567'
    loaOrderIdPathParam:
      name: orderId
      description: The port-in order ID.
      in: path
      required: true
      schema:
        type: string
      example: d28f4d00-4af1-4b03-b1d4-fc0a9e9ef6b3
    loaFileIdPathParam:
      name: fileid
      description: The LOA file ID.
      in: path
      required: true
      schema:
        type: string
      example: file123
    OrderIdPathParam:
      name: orderId
      description: The port-in order ID.
      in: path
      required: true
      schema:
        type: string
      example: d28f4d00-4af1-4b03-b1d4-fc0a9e9ef6b3
    modifiedDateFromQueryParam:
      name: modifiedDateFrom
      description: The earliest date that the order was last modified.
      in: query
      required: false
      schema:
        type: string
      example: '2014-08-05 00:00:00+00:00'
    modifiedDateToQueryParam:
      name: modifiedDateTo
      description: >-
        The latest date that the order was last modified. If no modifiedDateTo
        is specified when a modifiedDateFrom is specified then 'now' will be
        presumed to be the modifiedDateTo.
      in: query
      required: false
      schema:
        type: string
      example: '2014-08-05 00:00:00+00:00'
    pageQueryParam:
      name: page
      description: >-
        The CSR order id corresponding to the page that you want to start from.
        "1" is used as a convention for the first CSR order for the account.
        Defaults to 1, if not provided.
      in: query
      required: false
      schema:
        type: string
      example: ca8065d1-ec1a-43da-af40-1dcee43becb5
    sizeQueryParam:
      name: size
      description: The maximum number of results to retrieve.
      in: query
      required: false
      schema:
        type: integer
        default: 300
      example: 30
    statusQueryParam:
      name: status
      description: Displays the CSR orders with a given order status.
      in: query
      required: false
      schema:
        type: string
      example: complete
    siteIdPathParam:
      name: siteId
      description: The Site ID associated with the port-in orders.
      in: path
      required: true
      schema:
        type: string
      example: '407'
    sitePortinsPageQueryParam:
      name: page
      description: >-
        The port-in ID of the first order of the page. "1" is used as a
        convention for the first port-in in the Site ID.
      in: query
      required: true
      schema:
        type: string
        default: '1'
      example: ca8065d1-ec1a-43da-af40-1dcee43becb5
    sitePortinsSizeQueryParam:
      name: size
      description: The number of port-ins to retrieve per page.
      in: query
      required: true
      schema:
        type: integer
        default: 300
      example: 30
    sitePortinsStatusQueryParam:
      name: status
      description: Displays the port-ins with the given status.
      in: query
      required: false
      schema:
        type: string
      example: completed
    countryCodeA3QueryParam:
      description: Country code of the address in ISO 3166-1 alpha-3 format.
      in: query
      name: countryCodeA3
      required: false
      schema:
        example: GBR
        type: string
    phoneNumberTypeQueryParam:
      description: >-
        The type of phone number. The system defaults to return phone numbers of
        all types when the query parameter is not passed. The countryCodeA3 is a
        required parameter with phone number type.
      in: query
      name: phoneNumberType
      required: false
      schema:
        $ref: '#/components/schemas/phoneNumberType'
    portinOrderIdV3Param:
      name: orderId
      in: query
      description: V3 filter and sort parameter for Order ID.
      style: deepObject
      explode: true
      required: false
      schema:
        properties:
          eq:
            type: string
            description: Exact match on Order ID.
          startsWith:
            type: string
            description: Prefix match on Order ID.
          sort:
            $ref: '#/components/schemas/sort'
        example:
          eq: ca8065d1-ec1a-43da-af40-1dcee43becb5
          sort: ASC
    portinCustomerOrderIdV3Param:
      name: customerOrderId
      in: query
      description: >
        Filter and sort parameter for Customer Order ID.

        Legacy scalar form (`customerOrderId=PO-58472159`) is preserved for
        backward compatibility.

        V3 bracket form adds sort control: `customerOrderId[eq]`,
        `customerOrderId[startsWith]`, `customerOrderId[sort]`.
      style: deepObject
      explode: true
      required: false
      schema:
        properties:
          eq:
            type: string
            description: Exact match on Customer Order ID.
          startsWith:
            type: string
            description: Prefix match on Customer Order ID.
          sort:
            $ref: '#/components/schemas/sort'
        example:
          eq: PO-58472159
          sort: ASC
    portinStatusV3Param:
      name: status
      in: query
      description: >
        Filter and sort parameter for processing status.

        Legacy scalar form (`status=complete`) is preserved for backward
        compatibility.

        V3 bracket form adds sort control: `status[eq]=COMPLETE` (filter) and
        `status[sort]=ASC` (sort).

        Multiple values may be comma-separated for OR semantics (e.g.
        `status[eq]=PENDING,COMPLETE`).
      style: deepObject
      explode: true
      required: false
      schema:
        properties:
          eq:
            type: string
            description: Exact match on processing status.
          sort:
            $ref: '#/components/schemas/sort'
        example:
          eq: PENDING
          sort: ASC
    portinOrderDateV3Param:
      name: orderDate
      in: query
      description: >-
        V3 filter and sort parameter for order creation date (ISO 8601,
        YYYY-MM-DD).
      style: deepObject
      explode: true
      required: false
      schema:
        properties:
          gte:
            type: string
            format: date
            description: Include orders created on or after this date.
          lte:
            type: string
            format: date
            description: Include orders created on or before this date.
          sort:
            $ref: '#/components/schemas/sort'
        example:
          gte: '2026-01-01'
          lte: '2026-06-01'
          sort: DESC
    portinLastUpdatedV3Param:
      name: lastUpdated
      in: query
      description: >-
        V3 filter and sort parameter for last-modified date (ISO 8601,
        YYYY-MM-DD).
      style: deepObject
      explode: true
      required: false
      schema:
        properties:
          gte:
            type: string
            format: date
            description: Include orders last modified on or after this date.
          lte:
            type: string
            format: date
            description: Include orders last modified on or before this date.
          sort:
            $ref: '#/components/schemas/sort'
        example:
          gte: '2026-01-01'
          lte: '2026-06-01'
          sort: DESC
    portinPonV3Param:
      name: pon
      in: query
      description: >
        Filter and sort parameter for PON (Port Order Number).

        Legacy scalar form (`pon=979E019287CDF6A1`) is preserved for backward
        compatibility.

        V3 bracket form adds sort control: `pon[eq]`, `pon[startsWith]`,
        `pon[sort]`.
      style: deepObject
      explode: true
      required: false
      schema:
        properties:
          eq:
            type: string
            description: Exact match on PON.
          startsWith:
            type: string
            description: Prefix match on PON.
          sort:
            $ref: '#/components/schemas/sort'
        example:
          eq: 979E019287CDF6A1
          sort: ASC
    portinBtnV3Param:
      name: btn
      in: query
      description: V3 filter and sort parameter for BTN (Billing Telephone Number).
      style: deepObject
      explode: true
      required: false
      schema:
        properties:
          eq:
            type: string
            description: Exact match on BTN.
          sort:
            $ref: '#/components/schemas/sort'
        example:
          eq: '+19191234567'
          sort: ASC
