      description: >-
        The processing status of this order. Values may be: PROCESSING,
        COMPLETED, FAILED. PROCESSING means that the system is still processing
        the order. COMPLETED means that the order has been successfully
        completed. FAILED means that errors occurred while processing the order,
        and that the order did not make any changes to the system.
      enum:
        - DRAFT
        - PENDING_DOCUMENTS
        - MISSING_REQUIREMENTS
        - SUBMITTED
        - PENDING_CARRIER_APPROVAL
        - REQUESTED_SUPP
        - FOC
        - COMPLETE
        - EXCEPTION
        - SNAPBACK
        - REQUESTED_CANCEL
        - CANCELLED
        - VALIDATE_TFNS
        - VALIDATE_DRAFT_TFNS
        - VALID_DRAFT_TFNS
        - INVALID_TFNS
        - INVALID_DRAFT_TFNS
      type: string
    portinPhoneNumberGroup:
      description: >-
        A group of phone numbers to be ported into a specific location,
        optionally linked to a Voice Configuration Package.
      properties:
        ListOfPhoneNumbers:
          description: List of phone numbers to port into this group.
          items:
            properties:
              PhoneNumber:
                description: Ten digit phone number with no dots or dashes.
                type: string
                xml:
                  name: PhoneNumber
            type: object
          type: array
          xml:
            name: ListOfPhoneNumbers
            wrapped: true
        LocationId:
          description: >-
            The numeric identifier of the SIP-peer (location) that these phone
            numbers will be ported into.
          type: string
          xml:
            name: LocationId
        VoiceConfigurationPackageId:
          description: >-
            The UUID of the Voice Configuration Package to associate with these
            phone numbers. Required when the account has the VOICE_CONFIGS
            product feature enabled; omit or set to null otherwise.
          format: uuid
          type: string
          xml:
            name: VoiceConfigurationPackageId
      required:
        - ListOfPhoneNumbers
        - LocationId
      type: object
      xml:
        name: PhoneNumberGroup
    portinPhoneNumberGroupJson:
      description: >-
        A group of phone numbers to be ported into a specific location,
        optionally linked to a Voice Configuration Package.
      properties:
        locationId:
          description: >-
            The numeric identifier of the SIP-peer (location) that these phone
            numbers will be ported into.
          type: string
        phoneNumbers:
          $ref: '#/components/schemas/phoneNumbersJson'
        voiceConfigurationPackageId:
          description: >-
            The UUID of the Voice Configuration Package to associate with these
            phone numbers. Required when the account has the VOICE_CONFIGS
            product feature enabled; omit or set to null otherwise.
          format: uuid
          type: string
      required:
        - phoneNumbers
        - locationId
      type: object
    subscriber:
      properties:
        BusinessName:
          description: Subscriber business name.
          type: string
        FirstName:
          description: Subscriber first name.
          type: string
        LastName:
          description: Subscriber last name.
          type: string
        MiddleInitial:
          description: Subscriber middle initial.
          type: string
        ServiceAddress:
          $ref: '#/components/schemas/address'
        SubscriberType:
          description: If residential, order will be rejected if a BusinessName is entered.
          enum:
            - BUSINESS
            - RESIDENTIAL
            - GENERIC
          type: string
        type: object
      type: object
    tagName:
      type: string
      description: >-
        Name of a tag to associate with a phone number. Only alphanumeric
        values, dashes and underscores are allowed. Between 1 and 255
        characters. Is case sensitive.
      example: customerId
    tagValue:
      type: string
      description: >-
        Value of a tag to associate with a phone number. Only alphanumeric
        values, dashes and underscores are allowed. Between 1 and 255
        characters. Is case sensitive.
      example: 11111111-1111-1111-1111-111111111111
    tnAttribute:
      description: >-
        The TnAttributes field specifies line attributes that will apply to the
        ported in telephone numbers. If present, TnAttributes may have a value
        of PROTECTED. This element is not applicable for off-net and toll free
        port-types.
      properties:
        TnAttribute:
          type: string
      type: object
    wirelessInfo:
      properties:
        AccountNumber:
          description: >-
            The WirelessInfo.AccountNumber is sometimes required to authorize
            the port-out from the losing carrier. This is most common for
            telephone numbers that were formerly wireless. This element is not
            applicable for toll free port-ins.
          type: string
        PinNumber:
          description: >-
            The WirelessInfo.PinNumber is sometimes required to authorize the
            port-out from the losing carrier. This is most common for telephone
            numbers that were formerly wireless. This element is not applicable
            for toll free port-ins.
          type: string
      type: object
