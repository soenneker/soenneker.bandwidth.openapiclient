              type: string
              xml:
                name: PortType
            processingStatus:
              description: >-
                The processing status of this order. PROCESSING means that the
                system is still processing the order. COMPLETE means that the
                order has been successfully completed. EXCEPTION means that
                errors occurred while processing the order, and that the order
                did not make any changes to the system.
