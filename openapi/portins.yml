              maxLength: 100
              type: string
            operatorCode:
              $ref: '#/components/schemas/operatorCodeJson'
            phoneNumbers:
              $ref: '#/components/schemas/phoneNumbersJson'
            requestedFocDate:
              description: >
                The date format should be ISO 8601, such as
                "2019-10-31".<br/><br/>

                For global ports, if `RequestedFocDate` is specified, the time
                portions will be ignored, and the date portion must be:

