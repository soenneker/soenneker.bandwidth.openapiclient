    lnpOrderAutomatedTollFreeFields:
      properties:
        TargetRespOrgId:
          description: >-
            This is the RespOrg ID that you want the toll free numbers ported
            to. Normally it will specify a Bandwidth RespOrg ID like JYT01, but
            it could be something else for RespOrg Exception customers. This
            field is mandatory for non-draft toll free port-in orders.
          maxLength: 5
          minLength: 5
          type: string
        AcknowledgeAndOverrideAllWarnings:
          description: >-
            Set to `true` to acknowledge and override request warnings.
            Currently this applies to the FOC hold window warning (error 7910):
            set it to `true` to acknowledge that the `RequestedFocDate` is later
            than the losing RespOrg's translation hold window (or the default 10
            business days if the RespOrg has no configured window). The losing
            RespOrg is determined after the toll-free numbers are validated, so
            the order is accepted and is not rejected with error 7910. When the
            requested FOC date is outside the hold window, Bandwidth records a
            note on the order with the hold-window warning. Applies to toll-free
            port-ins with Toll-Free Automation only.
          example: true
          nullable: true
          type: boolean
      required:
        - TargetRespOrgId
      type: object
    lnpOrderAutomatedTollFreeFieldsJson:
      properties:
        targetRespOrgId:
          description: >-
            This is the RespOrg ID that you want the toll free numbers ported
            to. Normally it will specify a Bandwidth RespOrg ID like JYT01, but
            it could be something else for RespOrg Exception customers. This
            field is mandatory for non-draft toll free port-in orders.
          maxLength: 5
          minLength: 5
          type: string
        acknowledgeAndOverrideAllWarnings:
          description: >-
