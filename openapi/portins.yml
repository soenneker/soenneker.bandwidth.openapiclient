                    unique — Bandwidth applies no uniqueness constraint, so
                    multiple orders may share the same value. Each order
                    receives its own unique Bandwidth-assigned `orderId`.
                  maxLength: 255
                  type: string
                locationId:
                  description: >-
                    `LocationId` specifies the numeric identifier of the
                    SIP-peer (Location) that the telephone numbers will be
                    ported into.<br/><br/>You can find the identifier for a
                    SIP-peer (location) by using `GET
                    /accounts/id/sites/id/sippeers`, or by clicking on
                    'Accounts' on the upper right of the [Bandwidth
                    App](Https://api.bandwidth.com), then clicking 'Locations'
                    on the navigation bar. The SIP-peer (location) identifiers
                    are listed next to each location name. If `LocationId` is
                    omitted, the SIP-peer (location) designated as the 'default
                    location' for that site (sub-account) will be used.
                  type: string
                losingCarrierName:
                  description: >-
                    `LosingCarrierName` specifies the name of the losing
                    carrier 
                  type: string
                phoneNumbers:
                  $ref: '#/components/schemas/phoneNumbersJson'
                processingStatus:
                  description: >-
                    Including `ProcessingStatus` with a value of DRAFT allows
                    you to create a port-in request, but not process the
                    request. This is useful if you wish to add items to the
                    order over a period of time and submit once you have the
                    order setup the way you want. Note, however, that draft
                    orders that have not been updated in a couple of days are
                    automatically deleted. Removal of stagnant draft orders is
                    performed so that telephone numbers are not tied up in these
                    orders, preventing them from being included in other
                    orders.<br/><br/>Very little validation is performed while
                    an order is in draft state. Omitting `ProcessingStatus`
                    causes the port-in to be validated and, if correct,
                    processed right away. The full validation is performed on
                    the order when you change the ProcessingStatus to
                    'SUBMITTED' by performing a PUT request on the order.
                    <br><br><p>All toll free telephone numbers provided will be
                    validated (even in draft state) to ensure

                    that they are portable, and to allow you to separate
                    telephone numbers into separate port-ins

                    based on the RespOrg that they are being ported from.</p>
                  enum:
                    - DRAFT
                  type: string
                requestedFocDate:
                  description: >-
                    Format: ISO8601 encoding such as "2019-10-31".<br/><br/>For
                    global ports, if `RequestedFocDate` is specified the time
                    portions will be ignored and the date portion must be:<br/>
                    - in the future<br/> - not on a weekend.
                  type: string
                subAccountId:
                  description: >-
                    `SubAccountId` specifies the identifier of the site
                    (sub-account) that the telephone numbers will be ported
                    into.<br/><br/>You can find the identifier for a site
                    (sub-account) by using `GET /accounts/id/sites`, or by
                    clicking on 'Manage sub-account' for the desired sub-account
                    on the main page of the Bandwidth Dashboard.
                  format: int32
                  type: integer
                subscriber:
                  oneOf:
                    - $ref: >-
                        #/components/schemas/manualGlobalSubscriberResidentialJson
                    - $ref: '#/components/schemas/manualGlobalSubscriberBusinessJson'
                tags:
                  $ref: '#/components/schemas/phoneNumberTags'
              required:
                - phoneNumbers
              type: object
      title: Manual Global Draft LNP Order Request
      type: object
