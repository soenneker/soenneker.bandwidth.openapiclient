            <br/><br/>For all ports, if `RequestedFocDate` is specified, the
            date portion must be:<br/> - in the future<br/> - after the losing
            carrier's minimum number of days to port-out<br/> - not on a weekend
            or U.S. holiday<br/><br/>If `RequestedFocDate` is not specified, the
            next available FOC date meeting the criteria above will be used.
