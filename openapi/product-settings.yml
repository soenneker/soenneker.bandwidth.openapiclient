openapi: 3.0.1
info:
  description: >-
    Bandwidth's Product Settings API manages account-level product settings for
    Edge Management, Toll-Free, and UC Trunking.

    It also covers the SIP trunking and voice provisioning resources that
    support those products, including hosts, realms, SIP credentials, and
    location (SIP peer) level origination and termination settings.
  title: Product Settings API
  version: 1.0.0
  contact:
    name: Bandwidth Support
    email: support@bandwidth.com
    url: https://support.bandwidth.com
  termsOfService: https://www.bandwidth.com/legal/terms-of-use-bandwidthcom-web-sites/
servers:
  - url: https://api.bandwidth.com/api/v2
    description: Production
paths:
  /accounts/{accountId}/hosts:
    get:
      description: >-
        Retrieve information about the hosts of account, as guided by optional
        search parameters.
      operationId: listHosts
      summary: List hosts on account
      tags:
        - Account
      parameters:
        - $ref: '#/components/parameters/accountIdPathParam'
        - $ref: '#/components/parameters/hostQueryParam'
        - $ref: '#/components/parameters/hostTypeQueryParam'
      responses:
        '200':
          $ref: '#/components/responses/hostsResponse'
        '400':
          $ref: '#/components/responses/errorResponse400'
        '401':
          $ref: '#/components/responses/errorResponse401'
        '403':
          $ref: '#/components/responses/errorResponse403'
        '404':
          $ref: '#/components/responses/errorResponse404'
        '429':
          $ref: '#/components/responses/errorResponse429'
        '500':
          $ref: '#/components/responses/errorResponse500'
  /accounts/{accountId}/products/edgemanagement/settings:
    get:
      description: >-
        Retrieve settings that are provided as part of the Edge Management
        product: The SBC settings that are associated with the account and
        ProductSpecificAccessRestrictions.
      operationId: getAccountEdgemanagementProductSettings
      summary: Retrieve edgemanagement product settings
      tags:
        - Account
      parameters:
        - $ref: '#/components/parameters/accountIdPathParam'
      responses:
        '200':
          $ref: '#/components/responses/getEdgeManagementSettingsResponse'
        '400':
          $ref: '#/components/responses/errorResponse400'
        '401':
          $ref: '#/components/responses/errorResponse401'
        '403':
          $ref: '#/components/responses/errorResponse403'
        '404':
          $ref: '#/components/responses/errorResponse404'
        '429':
          $ref: '#/components/responses/errorResponse429'
        '500':
          $ref: '#/components/responses/errorResponse500'
  /accounts/{accountId}/products/tollfree/settings:
    get:
      description: Retrieve existing tollfree settings on account.
      operationId: getAccountTollfreeProductSettings
      summary: Retrieve tollfree product settings
      tags:
        - Account
      parameters:
        - $ref: '#/components/parameters/accountIdPathParam'
      responses:
        '200':
          $ref: '#/components/responses/getTollFreeSettingsResponse'
        '400':
          $ref: '#/components/responses/errorResponse400'
        '401':
          $ref: '#/components/responses/errorResponse401'
        '403':
          $ref: '#/components/responses/errorResponse403'
        '404':
          $ref: '#/components/responses/errorResponse404'
        '429':
          $ref: '#/components/responses/errorResponse429'
        '500':
          $ref: '#/components/responses/errorResponse500'
  /accounts/{accountId}/products/uctrunking/features/hosted/settings:
    get:
      description: Retrieve existing uctrunking hosted settings on account.
      operationId: getAccountUcTrunkingHostedFeatureSettings
      summary: Retrieve uctrunking product hosted feature settings
      tags:
        - Account
      parameters:
        - $ref: '#/components/parameters/accountIdPathParam'
      responses:
        '200':
          $ref: '#/components/responses/ucTrunkingHostedSettingsResponse'
        '400':
          $ref: '#/components/responses/errorResponse400'
        '401':
          $ref: '#/components/responses/errorResponse401'
        '403':
          $ref: '#/components/responses/errorResponse403'
        '404':
          $ref: '#/components/responses/ucTrunkingHostedSettingsNotFoundErrorResponse'
        '429':
          $ref: '#/components/responses/errorResponse429'
        '500':
          $ref: '#/components/responses/errorResponse500'
    post:
      description: Creates a UC Trunking hosted (cloud) configuration.
      operationId: createAccountUcTrunkingHostedSettings
      summary: Add uctrunking product hosted feature settings
      tags:
        - Account
      parameters:
        - $ref: '#/components/parameters/accountIdPathParam'
      requestBody:
        $ref: '#/components/requestBodies/ucTrunkingHostedSettingsRequest'
      responses:
        '200':
          $ref: '#/components/responses/ucTrunkingHostedSettingsResponse'
        '400':
          $ref: >-
            #/components/responses/ucTrunkingHostedSettingsBadRequestErrorResponse
        '401':
          $ref: '#/components/responses/errorResponse401'
        '403':
          $ref: '#/components/responses/errorResponse403'
        '404':
          $ref: '#/components/responses/ucTrunkingHostedSettingsNotFoundErrorResponse'
        '429':
          $ref: '#/components/responses/errorResponse429'
        '500':
          $ref: '#/components/responses/errorResponse500'
    put:
      description: Updates uctrunking hosted feature settings on account.
      operationId: updateAccountUcTrunkingHostedSettings
      summary: Update uctrunking product hosted feature settings
      tags:
        - Account
      parameters:
        - $ref: '#/components/parameters/accountIdPathParam'
      requestBody:
        $ref: '#/components/requestBodies/ucTrunkingHostedSettingsRequest'
      responses:
        '200':
          $ref: '#/components/responses/ucTrunkingHostedSettingsResponse'
        '400':
          $ref: >-
            #/components/responses/ucTrunkingHostedSettingsBadRequestErrorResponse
        '401':
          $ref: '#/components/responses/errorResponse401'
        '403':
          $ref: '#/components/responses/errorResponse403'
        '404':
          $ref: '#/components/responses/ucTrunkingHostedSettingsNotFoundErrorResponse'
        '429':
          $ref: '#/components/responses/errorResponse429'
        '500':
          $ref: '#/components/responses/errorResponse500'
  /accounts/{accountId}/products/uctrunking/settings:
    get:
      description: Retrieve existing uctrunking settings on account.
      operationId: getAccountUcTrunkingProductSettings
      summary: Retrieve uctrunking product settings
      tags:
        - Account
      parameters:
        - $ref: '#/components/parameters/accountIdPathParam'
      responses:
        '200':
          $ref: '#/components/responses/getUcTrunkingSettingsResponse'
        '400':
          $ref: '#/components/responses/errorResponse400'
        '401':
          $ref: '#/components/responses/errorResponse401'
        '403':
          $ref: '#/components/responses/errorResponse403'
        '404':
          $ref: '#/components/responses/errorResponse404'
        '429':
          $ref: '#/components/responses/errorResponse429'
        '500':
          $ref: '#/components/responses/errorResponse500'
  /accounts/{accountId}/realms:
    get:
      description: Retrieve all Realms for the account
      operationId: listRealms
      summary: List Realms
      tags:
        - SIP Registrar
      parameters:
        - $ref: '#/components/parameters/accountIdPathParam'
        - $ref: '#/components/parameters/realmFragmentQueryParam'
      responses:
        '200':
          $ref: '#/components/responses/listRealmsResponse'
        '400':
          $ref: '#/components/responses/listRealmsBadRequestErrorResponse'
        '401':
          $ref: '#/components/responses/errorResponse401'
        '403':
          $ref: '#/components/responses/errorResponse403'
        '404':
          $ref: '#/components/responses/listRealmsNotFoundErrorResponse'
        '429':
          $ref: '#/components/responses/errorResponse429'
        '500':
          $ref: '#/components/responses/errorResponse500'
    post:
      description: Create a Realm
      operationId: createRealm
      summary: Create Realm
      tags:
        - SIP Registrar
      parameters:
        - $ref: '#/components/parameters/accountIdPathParam'
      requestBody:
        $ref: '#/components/requestBodies/createRealmRequest'
      responses:
        '201':
          $ref: '#/components/responses/createRealm201Response'
        '400':
          $ref: '#/components/responses/createRealmBadRequestErrorResponse'
        '401':
          $ref: '#/components/responses/errorResponse401'
        '403':
          $ref: '#/components/responses/errorResponse403'
        '404':
          $ref: '#/components/responses/errorResponse404'
        '429':
          $ref: '#/components/responses/errorResponse429'
        '500':
          $ref: '#/components/responses/errorResponse500'
        '503':
          $ref: '#/components/responses/createRealmServiceUnavailableErrorResponse'
  /accounts/{accountId}/realms/{realm}:
    parameters:
      - $ref: '#/components/parameters/accountIdPathParam'
      - $ref: '#/components/parameters/realmPathParam'
    get:
      description: Retrieve a Realm associated with the account
      operationId: getRealm
      summary: Retrieve Realm
      tags:
        - SIP Registrar
      responses:
        '200':
          $ref: '#/components/responses/retrieveRealmResponse'
        '400':
          $ref: '#/components/responses/errorResponse400'
        '401':
          $ref: '#/components/responses/errorResponse401'
        '403':
          $ref: '#/components/responses/errorResponse403'
        '404':
          $ref: '#/components/responses/retrieveRealmNotFoundErrorResponse'
        '429':
          $ref: '#/components/responses/errorResponse429'
        '500':
          $ref: '#/components/responses/errorResponse500'
        '503':
          $ref: '#/components/responses/retrieveRealmServiceUnavailableErrorResponse'
    put:
      description: Update a Realm
      operationId: replaceRealm
      summary: Update Realm
      tags:
        - SIP Registrar
      requestBody:
        $ref: '#/components/requestBodies/updateRealmRequest'
      responses:
        '200':
          $ref: '#/components/responses/updateRealmResponse'
        '400':
          $ref: '#/components/responses/updateRealmBadRequestErrorResponse'
        '401':
          $ref: '#/components/responses/errorResponse401'
        '403':
          $ref: '#/components/responses/errorResponse403'
        '404':
          $ref: '#/components/responses/errorResponse404'
        '429':
          $ref: '#/components/responses/errorResponse429'
        '500':
          $ref: '#/components/responses/errorResponse500'
        '503':
          $ref: '#/components/responses/updateRealmServiceUnavailableErrorResponse'
    delete:
      description: Delete a Realm
      operationId: deleteRealm
      summary: Delete Realm
      tags:
        - SIP Registrar
      responses:
        '202':
          $ref: '#/components/responses/deleteRealmAcceptedResponse'
        '400':
          $ref: '#/components/responses/deleteRealmBadRequestErrorResponse'
        '401':
          $ref: '#/components/responses/errorResponse401'
        '403':
          $ref: '#/components/responses/errorResponse403'
        '404':
          $ref: '#/components/responses/deleteRealmNotFoundErrorResponse'
        '429':
          $ref: '#/components/responses/errorResponse429'
        '500':
          $ref: '#/components/responses/errorResponse500'
        '503':
          $ref: '#/components/responses/deleteRealmServiceUnavailableErrorResponse'
  /accounts/{accountId}/sipcredentials:
    get:
      tags:
        - SIP Registrar
      description: Retrieve all SIP credentials for the account
      summary: Retrieve SIP Credentials
      operationId: listSipCredentials
      parameters:
        - $ref: '#/components/parameters/accountIdPathParam'
        - $ref: '#/components/parameters/sipCredentialsPageQueryParam'
        - $ref: '#/components/parameters/sipCredentialsSizeQueryParam'
        - $ref: '#/components/parameters/userNameFragmentQueryParam'
        - $ref: '#/components/parameters/domainFragmentQueryParam'
        - $ref: '#/components/parameters/applicationNameFragmentQueryParam'
        - $ref: '#/components/parameters/realmFragmentQueryParam'
      responses:
        '200':
          $ref: '#/components/responses/listSipCredentialsResponse'
        '400':
          $ref: '#/components/responses/errorResponse400'
        '401':
          $ref: '#/components/responses/errorResponse401'
        '403':
          $ref: '#/components/responses/errorResponse403'
        '404':
          $ref: '#/components/responses/listSipCredentialsNotFoundResponse'
        '429':
          $ref: '#/components/responses/errorResponse429'
        '500':
          $ref: '#/components/responses/errorResponse500'
    post:
      tags:
        - SIP Registrar
      description: Create SIP credentials and associate them with the account
      summary: Create SIP Credentials
      operationId: createSipCredentials
      parameters:
        - $ref: '#/components/parameters/accountIdPathParam'
      requestBody:
        $ref: '#/components/requestBodies/createSipCredentialsRequest'
      responses:
        '201':
          $ref: '#/components/responses/createSipCredentials201Response'
        '400':
          $ref: '#/components/responses/createSipCredentialsBadRequestResponse'
        '401':
          $ref: '#/components/responses/errorResponse401'
        '403':
          $ref: '#/components/responses/errorResponse403'
        '404':
          $ref: '#/components/responses/errorResponse404'
        '429':
          $ref: '#/components/responses/errorResponse429'
        '500':
          $ref: '#/components/responses/errorResponse500'
        '503':
          $ref: >-
            #/components/responses/createSipCredentialsServiceUnavailableResponse
  /accounts/{accountId}/realms/{realmId}/sipcredentials:
    get:
      tags:
        - SIP Registrar
      description: Retrieve all SIP credentials for the account ID and realm ID specified
      operationId: listSipCredentialsOnRealm
      summary: List SIP Credentials On Realm
      parameters:
        - $ref: '#/components/parameters/accountIdPathParam'
        - $ref: '#/components/parameters/realmIdPathParam'
        - $ref: '#/components/parameters/afterCursorQueryParam'
        - $ref: '#/components/parameters/limitQueryParam'
        - $ref: '#/components/parameters/userNameFragmentQueryParam'
        - $ref: '#/components/parameters/applicationNameFragmentQueryParam'
        - $ref: '#/components/parameters/realmFragmentQueryParam'
      responses:
        '200':
          $ref: '#/components/responses/listSipCredentialsOnRealmResponse'
        '400':
          $ref: '#/components/responses/errorResponse400'
        '401':
          $ref: '#/components/responses/errorResponse401'
        '403':
          $ref: '#/components/responses/errorResponse403'
        '404':
          $ref: '#/components/responses/listSipCredentialsOnRealmNotFoundResponse'
        '429':
          $ref: '#/components/responses/errorResponse429'
        '500':
          $ref: '#/components/responses/errorResponse500'
    post:
      tags:
        - SIP Registrar
      description: Create SIP credentials on the Realm
      operationId: createSipCredentialsOnRealm
      summary: Create SIP Credentials On Realm
      parameters:
        - $ref: '#/components/parameters/accountIdPathParam'
        - $ref: '#/components/parameters/realmIdPathParam'
      requestBody:
        $ref: '#/components/requestBodies/createSipCredentialsOnRealmRequest'
      responses:
        '201':
          $ref: '#/components/responses/createSipCredentialsOnRealm201Response'
        '400':
          $ref: '#/components/responses/createSipCredentialsOnRealmBadRequestResponse'
        '401':
          $ref: '#/components/responses/errorResponse401'
        '403':
          $ref: '#/components/responses/errorResponse403'
        '404':
          $ref: '#/components/responses/errorResponse404'
        '429':
          $ref: '#/components/responses/errorResponse429'
        '500':
          $ref: '#/components/responses/errorResponse500'
        '503':
          $ref: >-
            #/components/responses/createSipCredentialsOnRealmServiceUnavailableResponse
  /accounts/{accountId}/realms/{realmId}/sipcredentials/{credentialId}:
    parameters:
      - $ref: '#/components/parameters/accountIdPathParam'
      - name: realmId
        description: Realm's ID of SIP Credential
        in: path
        required: true
        schema:
          type: string
        example: '22'
      - name: credentialId
        description: ID of SIP Credential
        in: path
        required: true
        schema:
          type: string
        example: '11'
    get:
      tags:
        - SIP Registrar
      description: >-
        Retrieve a SIP credential for the account and realm specified by its
        assigned ID
      operationId: getSipCredentialOnRealm
      summary: Retrieve SIP Credential On Realm
      responses:
        '200':
          $ref: '#/components/responses/retrieveSipCredentialOnRealmResponse'
        '400':
          $ref: '#/components/responses/errorResponse400'
        '401':
          $ref: '#/components/responses/errorResponse401'
        '403':
          $ref: '#/components/responses/errorResponse403'
        '404':
          $ref: '#/components/responses/retrieveSipCredentialOnRealmNotFoundResponse'
        '429':
          $ref: '#/components/responses/errorResponse429'
        '500':
          $ref: '#/components/responses/errorResponse500'
    put:
      tags:
        - SIP Registrar
      description: Update single SIP credential on the Realm
      operationId: updateSipCredentialOnRealm
      summary: Update SIP Credential On Realm
      requestBody:
        $ref: '#/components/requestBodies/updateSipCredentialOnRealmRequest'
      responses:
        '200':
          $ref: '#/components/responses/retrieveSipCredentialOnRealmResponse'
        '400':
          $ref: '#/components/responses/updateSipCredentialOnRealmBadRequestResponse'
        '401':
          $ref: '#/components/responses/errorResponse401'
        '403':
          $ref: '#/components/responses/errorResponse403'
        '404':
          $ref: '#/components/responses/retrieveSipCredentialOnRealmNotFoundResponse'
        '429':
          $ref: '#/components/responses/errorResponse429'
        '500':
          $ref: '#/components/responses/errorResponse500'
        '503':
          $ref: >-
            #/components/responses/sipCredentialOnRealmServiceUnavailableResponse
    delete:
      tags:
        - SIP Registrar
      description: Delete SIP credential on the Realm
      operationId: deleteSipCredentialOnRealm
      summary: Delete SIP Credential On Realm
      responses:
        '200':
          description: OK
        '400':
          $ref: '#/components/responses/errorResponse400'
        '401':
          $ref: '#/components/responses/errorResponse401'
        '403':
          $ref: '#/components/responses/errorResponse403'
        '404':
          $ref: '#/components/responses/retrieveSipCredentialOnRealmNotFoundResponse'
        '429':
          $ref: '#/components/responses/errorResponse429'
        '500':
          $ref: '#/components/responses/errorResponse500'
        '503':
          $ref: >-
            #/components/responses/sipCredentialOnRealmServiceUnavailableResponse
  /accounts/{accountId}/sipcredentials/{compositeUserName}:
    parameters:
      - $ref: '#/components/parameters/accountIdPathParam'
      - name: compositeUserName
        description: >-
          Is comprised of the `UserName`, and, if there is a `Domain` part, an @
          followed by the `Domain`
        in: path
        required: true
        schema:
          type: string
        example: '`user` or `user@domain`'
    get:
      tags:
        - SIP Registrar
      description: >-
        Retrieve a SIP credential for the account by unique combination of user
        name and domain
      operationId: getSipCredential
      summary: Retrieve SIP Credential
      responses:
        '200':
          $ref: '#/components/responses/retrieveSipCredentialResponse'
        '400':
          $ref: '#/components/responses/errorResponse400'
        '401':
          $ref: '#/components/responses/errorResponse401'
        '403':
          $ref: '#/components/responses/errorResponse403'
        '404':
          $ref: '#/components/responses/retrieveSipCredentialNotFoundResponse'
        '429':
          $ref: '#/components/responses/errorResponse429'
        '500':
          $ref: '#/components/responses/errorResponse500'
    put:
      tags:
        - SIP Registrar
      description: >-
        Update single SIP credential.

        It is not possible to change the UserName or the Domain associated with
        the Hash Values. To do so requires deletion of one set of credentials
        and addition of a new set of credentials
      operationId: updateSipCredential
      summary: Update SIP Credential
      requestBody:
        $ref: '#/components/requestBodies/updateSipCredentialRequest'
      responses:
        '200':
          $ref: '#/components/responses/retrieveSipCredentialResponse'
        '400':
          $ref: '#/components/responses/updateSipCredentialBadRequestResponse'
        '401':
          $ref: '#/components/responses/errorResponse401'
        '403':
          $ref: '#/components/responses/errorResponse403'
        '404':
          $ref: '#/components/responses/retrieveSipCredentialNotFoundResponse'
        '429':
          $ref: '#/components/responses/errorResponse429'
        '500':
          $ref: '#/components/responses/errorResponse500'
        '503':
          $ref: '#/components/responses/sipCredentialServiceUnavailableResponse'
    delete:
      tags:
        - SIP Registrar
      description: Delete SIP credential
      operationId: deleteSipCredential
      summary: Delete SIP Credential
      responses:
        '200':
          description: OK
        '400':
          $ref: '#/components/responses/errorResponse400'
        '401':
          $ref: '#/components/responses/errorResponse401'
        '403':
          $ref: '#/components/responses/errorResponse403'
        '404':
          $ref: '#/components/responses/retrieveSipCredentialNotFoundResponse'
        '429':
          $ref: '#/components/responses/errorResponse429'
        '500':
          $ref: '#/components/responses/errorResponse500'
        '503':
          $ref: '#/components/responses/sipCredentialServiceUnavailableResponse'
  /accounts/{accountId}/sites/{siteId}/sippeers/{sipPeerId}/products/origination/settings:
    get:
      tags:
        - Locations (SIP Peers)
      description: Retrieve Sip Peer Origination settings
      summary: Retrieve Origination Settings for a Location
      operationId: getLocationOriginationSettings
      parameters:
        - $ref: '#/components/parameters/accountIdPathParam'
        - $ref: '#/components/parameters/subAccountIdPathParam'
        - $ref: '#/components/parameters/locationIdPathParam'
      responses:
        '200':
          $ref: '#/components/responses/retrieveOriginationSettingsResponse'
        '400':
          $ref: '#/components/responses/errorResponse400'
        '401':
          $ref: '#/components/responses/errorResponse401'
        '403':
          $ref: '#/components/responses/errorResponse403'
        '404':
          $ref: '#/components/responses/errorResponse404'
        '429':
          $ref: '#/components/responses/errorResponse429'
        '500':
          $ref: '#/components/responses/errorResponse500'
    post:
      tags:
        - Locations (SIP Peers)
      description: Create Sip Peer Origination settings
      summary: Create Origination Settings for a Location
      operationId: createLocationOriginationSettings
      parameters:
        - $ref: '#/components/parameters/accountIdPathParam'
        - $ref: '#/components/parameters/subAccountIdPathParam'
        - $ref: '#/components/parameters/locationIdPathParam'
      requestBody:
        $ref: '#/components/requestBodies/createOrUpdateOriginationSettingsRequest'
      responses:
        '201':
          $ref: '#/components/responses/createOriginationSettingsResponse'
        '400':
          $ref: '#/components/responses/originationSettingsBadRequestResponse'
        '401':
          $ref: '#/components/responses/errorResponse401'
        '403':
          $ref: '#/components/responses/errorResponse403'
        '404':
          $ref: '#/components/responses/errorResponse404'
        '429':
          $ref: '#/components/responses/errorResponse429'
        '500':
          $ref: '#/components/responses/errorResponse500'
    put:
      tags:
        - Locations (SIP Peers)
      description: >-
        Update Sip Peer Origination settings<p>Note: Changing the Voice Protocol
        from SIP to HTTP will remove Voice Hosts or Voice Host Groups and
        Termination Hosts, which are configured using API
        /accounts/{accountId}/sites/{siteId}/sippeers/{sippeerId}.</p>
      summary: Update Origination Settings for a Location
      operationId: updateLocationOriginationSettings
      parameters:
        - $ref: '#/components/parameters/accountIdPathParam'
        - $ref: '#/components/parameters/subAccountIdPathParam'
        - $ref: '#/components/parameters/locationIdPathParam'
      requestBody:
        $ref: '#/components/requestBodies/createOrUpdateOriginationSettingsRequest'
      responses:
        '200':
          $ref: '#/components/responses/retrieveOriginationSettingsResponse'
        '400':
          $ref: '#/components/responses/errorResponse400'
        '401':
          $ref: '#/components/responses/errorResponse401'
        '403':
          $ref: '#/components/responses/errorResponse403'
        '404':
          $ref: '#/components/responses/errorResponse404'
        '429':
          $ref: '#/components/responses/errorResponse429'
        '500':
          $ref: '#/components/responses/errorResponse500'
  /accounts/{accountId}/sites/{siteId}/sippeers/{sipPeerId}/products/termination:
    get:
      tags:
        - Locations (SIP Peers)
      description: >-
        Retrieve SIP peer termination products including termination settings
        and termination hosts
      summary: Retrieve Termination Products for a Location
