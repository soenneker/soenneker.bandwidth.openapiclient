components:
  parameters:
    accountIdPathParam:
      description: User's account ID.
      example: '1234567'
      in: path
      name: accountId
      required: true
      schema:
        type: string
    subAccountIdPathParam:
      name: siteId
      description: Sub-Account ID
      in: path
      required: true
      schema:
        type: integer
      example: 407
    locationIdPathParam:
      name: sipPeerId
      description: ID of the location
      in: path
      required: true
      schema:
        type: integer
      example: 500017
    gatewayIdPathParam:
      name: gatewayId
      description: ID of the termination host (gateway)
      in: path
      required: true
      schema:
        type: integer
        format: int64
      example: 23
    attributeIdPathParam:
      name: attributeId
      description: ID of the gateway attribute (setting)
      in: path
      required: true
      schema:
        type: integer
        format: int64
      example: 8
    hostQueryParam:
      description: >-
        <p>An IP address or subnet (CIDR format) associated with the account.
        Filter for subnet applies by exact match.</p>
      example: 47.16.211.63 or 69.22.181.68/30
      in: query
      name: host
      required: false
      schema:
        type: string
    hostTypeQueryParam:
      description: >-
        <p>A status value to filter the hosts returned in the payload. Values
        that can be accepted
        include:</p><ul><li>SMS</li><li>TERMINATION</li><li>ORIGINATION</li></ul>
      example: TERMINATION
      in: query
      name: type
      required: false
      schema:
        type: string
    realmPathParam:
      description: Name or ID of the realm
      example: '22'
      in: path
      name: realm
      required: true
      schema:
        type: string
    realmIdPathParam:
      description: ID of the Realm
      example: '22'
      in: path
      name: realmId
      required: true
      schema:
        type: string
    realmFragmentQueryParam:
      description: The realm fragment
      example: myrealm
      in: query
      name: realmFragment
      required: false
      schema:
        type: string
        maxLength: 64
        minLength: 3
    userNameFragmentQueryParam:
      description: The user name fragment
      example: user32
      in: query
      name: userNameFragment
      required: false
      schema:
        type: string
        maxLength: 64
        minLength: 3
    domainFragmentQueryParam:
      description: The domain fragment
      example: bw.
      in: query
      name: domainFragment
      required: false
      schema:
        type: string
        maxLength: 64
        minLength: 3
    applicationNameFragmentQueryParam:
      description: The application name fragment
      example: myapp
      in: query
      name: applicationNameFragment
      required: false
      schema:
        type: string
        maxLength: 64
        minLength: 3
    sipCredentialsPageQueryParam:
      description: >-
        An ID of the first element in a page.  This value will indicate the
        first value, not the count, of the initial entry in the page being
        requested. It can be an index of SIP credential or a combination of user
        name and domain in form {userName}@{domain}. The initial page is tagged
        with the ID '1'
      example: 3, user321@bw.com
      in: query
      name: page
      required: false
      schema:
        type: string
        default: '1'
    sipCredentialsSizeQueryParam:
      description: The number of items to include in a page
      example: 5000
      in: query
      name: size
      required: false
      schema:
        type: integer
        default: 500
    afterCursorQueryParam:
      description: >-
        An ID of the first element in a page. This value will indicate the first
        value, not the count, of the initial entry in the page being requested.
        It can be an index of SIP credential or a combination of user name and
        domain in form {userName}@{domain}. The initial page is tagged with the
        ID '1'
      example: '3'
      in: query
      name: afterCursor
      required: false
      schema:
        type: string
        default: '1'
    limitQueryParam:
      description: The number of items to include in a page
      example: 5000
      in: query
      name: limit
      required: false
      schema:
        type: integer
        default: 500
  requestBodies:
